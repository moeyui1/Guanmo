  <style>
    .rider {
      animation: cross 8s linear infinite;
    }
    @keyframes cross {
      from { transform: translate(1120px, 402px); }
      to { transform: translate(-220px, 402px); }
    }
    .bob {
      animation: bob 1s ease-in-out infinite;
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    .cloudA {
      animation: driftA 8s linear infinite;
    }
    @keyframes driftA {
      from { transform: translateX(0); }
      to { transform: translateX(-960px); }
    }
    .wave {
      animation: waveShift 8s linear infinite;
    }
    @keyframes waveShift {
      from { transform: translateX(0); }
      to { transform: translateX(-160px); }
    }
    .reed {
      animation: sway 2s ease-in-out infinite;
      transform-origin: 50% 100%;
    }
    .reed2 { animation-delay: -0.7s; }
    .reed3 { animation-delay: -1.3s; }
    @keyframes sway {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(4deg); }
    }
    .bird {
      animation: birdFly 8s linear infinite;
    }
    @keyframes birdFly {
      from { transform: translate(980px, 0); }
      to { transform: translate(-80px, 0); }
    }
  </style>
