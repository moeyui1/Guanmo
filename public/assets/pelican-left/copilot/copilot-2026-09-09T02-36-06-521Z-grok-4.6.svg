    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff4b0" stop-opacity="1"/>
      <stop offset="55%" stop-color="#ffd36a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffd36a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
