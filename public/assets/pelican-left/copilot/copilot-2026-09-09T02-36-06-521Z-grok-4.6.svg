    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecd09a"/>
      <stop offset="100%" stop-color="#d2a86a"/>
    </linearGradient>
    <linearGradient id="hillA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7faf72"/>
      <stop offset="100%" stop-color="#4e7d4a"/>
