        <path d="M-2 -132 C34 -130 64 -109 68 -84 C44 -95 8 -89 -18 -68 C-39 -88 -33 -119 -2 -132 Z" fill="#eef3ee" stroke="#b9c7ca" stroke-width="2.5"/>
