      .frame { fill: none; stroke: #e0433f; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      .metal { fill: none; stroke: #22384b; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .pelican-stroke { stroke: #253443; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
