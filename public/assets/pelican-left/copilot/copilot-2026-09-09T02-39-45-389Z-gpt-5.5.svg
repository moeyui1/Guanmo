      <path d="M-11 -58 C-20 -37 -23 -25 -18 -16" fill="none" stroke="#f28b2c" stroke-width="8" stroke-linecap="round"/>
      <path d="M31 -55 C19 -38 14 -24 17 -14" fill="none" stroke="#f28b2c" stroke-width="8" stroke-linecap="round"/>
      <path d="M-18 -16 C-28 -14 -37 -12 -45 -8" fill="none" stroke="#8b4719" stroke-width="3" stroke-linecap="round"/>
      <path d="M17 -14 C26 -12 35 -9 43 -5" fill="none" stroke="#8b4719" stroke-width="3" stroke-linecap="round"/>

      <g>
