<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8ed0ff"/>
      <stop offset="65%" stop-color="#cfeeff"/>
      <stop offset="100%" stop-color="#e9f8ff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4b5563"/>
      <stop offset="100%" stop-color="#2b313a"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#98c88c"/>
      <stop offset="100%" stop-color="#7fb070"/>
    </linearGradient>
  </defs>

  <rect width="960" height="540" fill="url(#sky)"/>

  <g opacity="0.95">
    <circle cx="820" cy="90" r="42" fill="#ffe27a"/>
    <circle cx="806" cy="78" r="10" fill="#fff3b3" opacity="0.65"/>
  </g>

  <g fill="#ffffff" opacity="0.9">
    <g>
      <ellipse cx="170" cy="98" rx="34" ry="20"/>
      <ellipse cx="205" cy="95" rx="30" ry="18"/>
      <ellipse cx="137" cy="105" rx="25" ry="15"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;-50 0;0 0" dur="16s" repeatCount="indefinite"/>
    </g>
    <g>
      <ellipse cx="620" cy="128" rx="36" ry="21"/>
      <ellipse cx="655" cy="125" rx="28" ry="16"/>
      <ellipse cx="590" cy="136" rx="24" ry="14"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;-80 0;0 0" dur="20s" repeatCount="indefinite"/>
    </g>
  </g>

  <path d="M0 340 C120 290, 260 300, 380 338 C520 380, 680 312, 960 352 L960 430 L0 430 Z" fill="url(#hill)"/>
  <path d="M0 372 C180 332, 330 360, 520 386 C700 410, 830 372, 960 392 L960 430 L0 430 Z" fill="#6fa163"/>

  <rect x="0" y="420" width="960" height="120" fill="url(#road)"/>
  <rect x="0" y="418" width="960" height="6" fill="#d9dee5" opacity="0.65"/>
  <g stroke="#f9fafb" stroke-width="6" stroke-linecap="round" opacity="0.85">
    <line x1="30" y1="478" x2="110" y2="478"/>
    <line x1="190" y1="478" x2="270" y2="478"/>
    <line x1="350" y1="478" x2="430" y2="478"/>
    <line x1="510" y1="478" x2="590" y2="478"/>
    <line x1="670" y1="478" x2="750" y2="478"/>
    <line x1="830" y1="478" x2="910" y2="478"/>
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate" values="1160 0;-360 0" dur="8s" repeatCount="indefinite"/>

    <g id="bike" stroke-linecap="round" stroke-linejoin="round">
      <g id="frontWheel">
        <circle cx="100" cy="390" r="60" fill="#111827" stroke="#0b1220" stroke-width="6"/>
        <circle cx="100" cy="390" r="48" fill="#dbe4ef" stroke="#9aa8b8" stroke-width="4"/>
        <g stroke="#65758a" stroke-width="3">
          <line x1="100" y1="342" x2="100" y2="438"/>
          <line x1="52" y1="390" x2="148" y2="390"/>
          <line x1="66" y1="356" x2="134" y2="424"/>
          <line x1="134" y1="356" x2="66" y2="424"/>
        </g>
        <circle cx="100" cy="390" r="7" fill="#6b7280"/>
        <animateTransform attributeName="transform" type="rotate" from="0 100 390" to="-1440 100 390" dur="8s" repeatCount="indefinite"/>
      </g>

      <g id="rearWheel">
        <circle cx="300" cy="390" r="60" fill="#111827" stroke="#0b1220" stroke-width="6"/>
        <circle cx="300" cy="390" r="48" fill="#dbe4ef" stroke="#9aa8b8" stroke-width="4"/>
        <g stroke="#65758a" stroke-width="3">
          <line x1="300" y1="342" x2="300" y2="438"/>
          <line x1="252" y1="390" x2="348" y2="390"/>
          <line x1="266" y1="356" x2="334" y2="424"/>
          <line x1="334" y1="356" x2="266" y2="424"/>
        </g>
        <circle cx="300" cy="390" r="7" fill="#6b7280"/>
        <animateTransform attributeName="transform" type="rotate" from="0 300 390" to="-1440 300 390" dur="8s" repeatCount="indefinite"/>
      </g>

      <g fill="none" stroke="#1f6fb2" stroke-width="8">
        <line x1="100" y1="390" x2="200" y2="390"/>
        <line x1="200" y1="390" x2="300" y2="390"/>
        <line x1="200" y1="390" x2="240" y2="330"/>
        <line x1="240" y1="330" x2="140" y2="330"/>
        <line x1="140" y1="330" x2="100" y2="390"/>
        <line x1="240" y1="330" x2="300" y2="390"/>
        <line x1="140" y1="330" x2="110" y2="310"/>
        <line x1="112" y1="312" x2="86" y2="312"/>
      </g>

      <rect x="228" y="317" width="34" height="8" rx="4" fill="#1f2937"/>
      <g fill="#111827" stroke="#111827" stroke-width="4">
        <line x1="300" y1="390" x2="200" y2="390"/>
      </g>

      <g id="crank">
        <circle cx="200" cy="390" r="16" fill="#d1d5db" stroke="#6b7280" stroke-width="4"/>
        <g stroke="#4b5563" stroke-width="5" stroke-linecap="round">
          <line x1="200" y1="390" x2="240" y2="390"/>
          <line x1="200" y1="390" x2="160" y2="390"/>
        </g>

        <g>
          <rect x="236" y="384" width="10" height="12" rx="2" fill="#374151"/>
          <ellipse cx="250" cy="390" rx="13" ry="8" fill="#f2a93b"/>
          <polygon points="260,390 272,384 272,396" fill="#f2a93b"/>
        </g>
        <g opacity="0.9">
          <rect x="154" y="384" width="10" height="12" rx="2" fill="#374151"/>
          <ellipse cx="150" cy="390" rx="13" ry="8" fill="#e59627"/>
          <polygon points="140,390 128,384 128,396" fill="#e59627"/>
        </g>

        <animateTransform attributeName="transform" type="rotate" from="0 200 390" to="-2880 200 390" dur="8s" repeatCount="indefinite"/>
      </g>
    </g>

    <g id="pelican">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0;0 2;0 0" dur="1s" repeatCount="indefinite"/>

      <ellipse cx="220" cy="292" rx="72" ry="48" fill="#f7f9fc" stroke="#cfd8e3" stroke-width="3"/>
      <path d="M255 285 C300 294, 300 330, 254 337 C268 318, 268 302, 255 285 Z" fill="#e4ebf2"/>
      <path d="M180 282 C205 252, 220 232, 168 222 C142 217, 128 233, 136 252 C145 272, 162 282, 180 282 Z" fill="#f7f9fc" stroke="#cfd8e3" stroke-width="3"/>
      <circle cx="134" cy="226" r="30" fill="#f7f9fc" stroke="#cfd8e3" stroke-width="3"/>
      <circle cx="126" cy="220" r="4.5" fill="#111827"/>
      <circle cx="124.5" cy="218.8" r="1.4" fill="#ffffff"/>

      <path d="M108 230 L38 246 L108 248 Z" fill="#f0b25a" stroke="#d1903f" stroke-width="2"/>
      <path d="M108 248 C84 255, 66 274, 87 286 C113 279, 122 263, 115 250 Z" fill="#ef9f48" stroke="#d08435" stroke-width="2"/>

      <path d="M190 332 C196 352, 204 370, 212 384" fill="none" stroke="#d6dde7" stroke-width="8" stroke-linecap="round"/>
      <path d="M222 334 C214 352, 204 372, 196 390" fill="none" stroke="#cfd8e3" stroke-width="8" stroke-linecap="round"/>
      <ellipse cx="240" cy="330" rx="14" ry="10" fill="#f7f9fc"/>
    </g>
  </g>
</svg>