<svg viewBox="0 0 960 540" width="960" height="540" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Simple gradient for background -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b7eaff"/>
      <stop offset="100%" stop-color="#e5f7ff"/>
    </linearGradient>
    <!-- Road gradient -->
    <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d1dee4"/>
      <stop offset="100%" stop-color="#adb8bf"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="url(#bgGrad)" />

  <!-- Distant hills -->
  <ellipse cx="210" cy="460" rx="200" ry="50" fill="#b2e2b6" opacity="0.45"/>
  <ellipse cx="650" cy="470" rx="230" ry="60" fill="#a6d2a5" opacity="0.38"/>

  <!-- Road -->
  <rect x="0" y="400" width="960" height="80" fill="url(#roadGrad)" />
  <rect x="0" y="478" width="960" height="20" fill="#7e8992" />

  <!-- Road stripes -->
  <g opacity="0.34">
    <rect x="50" y="438" width="70" height="8" rx="2" fill="#fff" />
    <rect x="180" y="438" width="70" height="8" rx="2" fill="#fff" />
    <rect x="310" y="438" width="70" height="8" rx="2" fill="#fff" />
    <rect x="440" y="438" width="70" height="8" rx="2" fill="#fff" />
    <rect x="570" y="438" width="70" height="8" rx="2" fill="#fff" />
    <rect x="700" y="438" width="70" height="8" rx="2" fill="#fff" />
    <rect x="830" y="438" width="70" height="8" rx="2" fill="#fff" />
  </g>

  <!-- Pelican + Bicycle group: all at (0,0), animate leftward across the scene -->
  <g id="rider" >
    <animateTransform attributeName="transform" type="translate"
      from="960 340" to="-280 340"
      dur="8s" repeatCount="indefinite"/>
    <g id="bicycle" >
      <!-- Frame -->
      <g stroke="#414b60" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <!-- Bottom tube -->
        <line x1="110" y1="108" x2="40" y2="118" />
        <!-- Top tube -->
        <line x1="110" y1="108" x2="80" y2="60" />
        <!-- Seat tube -->
        <line x1="110" y1="108" x2="106" y2="62" />
        <!-- Head tube -->
        <line x1="80" y1="60" x2="68" y2="102" />
        <!-- Back fork -->
        <line x1="110" y1="108" x2="116" y2="146" />
        <!-- Chain stay -->
        <line x1="110" y1="108" x2="60" y2="146" />
        <!-- Down tube to pedal -->
        <line x1="110" y1="108" x2="101" y2="135" />
        <!-- Handlebar -->
        <line x1="68" y1="102" x2="60" y2="65" />
        <line x1="60" y1="65" x2="45" y2="70" />
        <line x1="60" y1="65" x2="72" y2="58" />
      </g>
      <!-- Seat -->
      <rect x="92" y="52" width="28" height="10" rx="4" fill="#37323b" />
      <!-- Pedal hub -->
      <circle cx="110" cy="136" r="9" fill="#5b6170" stroke="#444" stroke-width="2"/>
      <!-- Cranks + pedals (animated with group) -->
      <g id="crankgroup">
        <animateTransform
          attributeName="transform"
          attributeType="XML"
          type="rotate"
          from="0 110 136"
          to="360 110 136"
          dur="1.2s"
          repeatCount="indefinite"/>
        <!-- Crank arms -->
        <rect x="108.2" y="128" width="3.6" height="16" rx="1.2" fill="#8a97a6"/>
        <rect x="108.2" y="136" width="3.6" height="16" rx="1.2" fill="#8a97a6" />
        <!-- Pedals -->
        <rect x="107" y="144" width="6" height="10" rx="2" fill="#e7d76f" stroke="#726203" stroke-width="1"/>
        <rect x="107" y="120" width="6" height="10" rx="2" fill="#e7d76f" stroke="#726203" stroke-width="1"/>
      </g>
      <!-- Wheels (snap to crank rotation) -->
      <g>
        <!-- Rear wheel (hub at 115,147, r=36) -->
        <g id="rearWheel">
          <animateTransform
            attributeName="transform"
            type="rotate"
            from="0 115 147"
            to="-360 115 147"
            dur="1.2s"
            repeatCount="indefinite"/>
          <circle cx="115" cy="147" r="36" fill="#e8f2f7" stroke="#252d38" stroke-width="7" />
          <circle cx="115" cy="147" r="27" fill="none" stroke="#8c9caf" stroke-width="2" />
          <!-- Spokes -->
          <g stroke="#818b96" stroke-width="2">
            <line x1="115" y1="147" x2="151" y2="147"/>
            <line x1="115" y1="147" x2="79" y2="147"/>
            <line x1="115" y1="147" x2="115" y2="183"/>
            <line x1="115" y1="147" x2="115" y2="111"/>
            <!-- 4 more -->
            <line x1="115" y1="147" x2="141" y2="173"/>
            <line x1="115" y1="147" x2="89" y2="121"/>
            <line x1="115" y1="147" x2="141" y2="121"/>
            <line x1="115" y1="147" x2="89" y2="173"/>
          </g>
          <!-- Hub -->
          <circle cx="115" cy="147" r="7" fill="#b0bad2" stroke="#626f84" stroke-width="2" />
        </g>
        <!-- Front wheel (hub at 61,149, r=36) -->
        <g id="frontWheel">
          <animateTransform
            attributeName="transform"
            type="rotate"
            from="0 61 149"
            to="-360 61 149"
            dur="1.2s"
            repeatCount="indefinite"/>
          <circle cx="61" cy="149" r="36" fill="#e8f2f7" stroke="#252d38" stroke-width="7" />
          <circle cx="61" cy="149" r="27" fill="none" stroke="#8c9caf" stroke-width="2" />
          <g stroke="#818b96" stroke-width="2">
            <line x1="61" y1="149" x2="97" y2="149"/>
            <line x1="61" y1="149" x2="25" y2="149"/>
            <line x1="61" y1="149" x2="61" y2="185"/>
            <line x1="61" y1="149" x2="61" y2="113"/>
            <line x1="61" y1="149" x2="87" y2="175"/>
            <line x1="61" y1="149" x2="35" y2="123"/>
            <line x1="61" y1="149" x2="87" y2="123"/>
            <line x1="61" y1="149" x2="35" y2="175"/>
          </g>
          <circle cx="61" cy="149" r="7" fill="#b0bad2" stroke="#626f84" stroke-width="2" />
        </g>
      </g>
    </g>
    <!-- Pelican -->
    <g id="pelican" >
      <!-- Body -->
      <ellipse cx="136" cy="87" rx="41" ry="29" fill="#ece7df" stroke="#bdb9b2" stroke-width="3" />
      <!-- Tail -->
      <ellipse cx="172" cy="98" rx="16" ry="6" fill="#dfd9cb" stroke="#aaa69e" stroke-width="2" transform="rotate(10 172 98)"/>
      <ellipse cx="179" cy="102" rx="7" ry="2.1" fill="#bab39d" opacity="0.57" transform="rotate(28 179 102)"/>
      <!-- Neck -->
      <rect x="108" y="55" width="18" height="36" rx="11" fill="#eee8e1" stroke="#cac3bb" stroke-width="3" transform="rotate(17 117 72)" />
      <!-- Head -->
      <ellipse cx="120" cy="45" rx="19" ry="15" fill="#f6f2ee" stroke="#ccc0af" stroke-width="2.2"/>
      <!-- Beak lower -->
      <path d="M116,49 Q100,61 93,46 Q112,58 108,44 Q120,51 116,49" fill="#f6ae3b" stroke="#de9800" stroke-width="2"/>
      <!-- Beak upper -->
      <path d="M118,45 Q98,44 93,46 Q112,44 116,48 Q120,45 118,45" fill="#f7be56" stroke="#e69e09" stroke-width="2"/>
      <!-- Eye socket -->
      <ellipse cx="126.5" cy="45" rx="8.5" ry="7" fill="#fff" />
      <!-- Eye -->
      <ellipse cx="128" cy="46" rx="3.7" ry="3.5" fill="#333" />
      <ellipse cx="129.5" cy="44.5" rx="1.1" ry="1.0" fill="#fff" opacity="0.6" />
      <!-- Brows -->
      <path d="M130,38 Q132,41 126,41" stroke="#b99a53" stroke-width="2" fill="none"/>
      <!-- Wing -->
      <ellipse cx="126" cy="93" rx="23" ry="11" fill="#dfdbd5" stroke="#c1bbaa" stroke-width="2" transform="rotate(-7 124 92)"/>
      <!-- Wing detail lines -->
      <path d="M147,90 Q133,99 113,94" stroke="#beb8ad" stroke-width="1.2" fill="none"/>
      <path d="M142,97 Q128,100 126,92" stroke="#beb8ad" stroke-width="1.1" fill="none"/>
      <!-- Leg (left, near/rear) -->
      <g id="leg-rear">
        <animateTransform
          attributeName="transform"
          type="rotate"
          values="5 113 137; 22 113 137; 42 113 137; 5 113 137"
          keyTimes="0;0.23;0.51;1"
          dur="1.2s"
          repeatCount="indefinite"/>
        <!-- Upper leg -->
        <rect x="109" y="133" width="9" height="28" rx="3" fill="#e5cc70" stroke="#b3993b" stroke-width="2" />
        <!-- Webbed foot -->
        <polygon points="111,161 125,156 113,175 107,168" fill="#ffe386" stroke="#b3993b" stroke-width="2"/>
        <path d="M113,173 Q115,168 123,158" stroke="#b3993b" stroke-width="1" fill="none"/>
      </g>
      <!-- Leg (right, farther/front) -->
      <g id="leg-front">
        <animateTransform
          attributeName="transform"
          type="rotate"
          values="20 113 137; -14 113 137; -38 113 137; 20 113 137"
          keyTimes="0;0.33;0.66;1"
          dur="1.2s"
          repeatCount="indefinite"/>
        <rect x="109" y="133" width="9" height="28" rx="3" fill="#e5cc70" stroke="#b3993b" stroke-width="2" />
        <polygon points="111,161 125,156 113,175 107,168" fill="#ffe386" stroke="#b3993b" stroke-width="2"/>
        <path d="M113,173 Q115,168 123,158" stroke="#b3993b" stroke-width="1" fill="none"/>
      </g>
    </g>
  </g>
</svg>