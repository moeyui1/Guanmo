<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#a7d8ff"/>
      <stop offset="1" stop-color="#e6f6ff"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#8ad37a"/>
      <stop offset="1" stop-color="#5fb050"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="url(#sky)"/>
  <rect y="360" width="960" height="180" fill="url(#ground)"/>
  <!-- subtle distant hill -->
  <ellipse cx="200" cy="380" rx="260" ry="60" fill="#6fbf6a" opacity="0.25"/>
  <ellipse cx="720" cy="400" rx="320" ry="75" fill="#66b95f" opacity="0.18"/>

  <!-- Ground line -->
  <rect y="352" width="960" height="8" fill="#4da444" opacity="0.9"/>

  <!-- One group duplicated twice (offset) for seamless flow -->
  <!-- Parameters: travel from x=1160 (off-right) to x=-220 (off-left), y fixed 300 -->
  <!-- First instance -->
  <g class="ride" id="ride1">
    <animateTransform attributeName="transform" type="translate"
      from="1160 300" to="-220 300" dur="8s" repeatCount="indefinite" calcMode="linear"/>
    <!-- small bobbing for realism -->
    <g>
      <animateTransform attributeName="transform" type="translate" dur="1.2s" values="0 0; 0 -6; 0 0" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1"/>
      <!-- shadow -->
      <ellipse cx="110" cy="120" rx="70" ry="12" fill="#000" opacity="0.12"/>
      <!-- Scooter group -->
      <g id="scooter" transform="translate(40,80)">
        <!-- deck -->
        <rect x="20" y="60" rx="8" ry="8" width="220" height="22" fill="#222" />
        <rect x="40" y="64" rx="5" ry="5" width="180" height="12" fill="#2d2d2d" />
        <!-- deck grip -->
        <rect x="60" y="64" width="120" height="8" rx="3" fill="#444" opacity="0.9"/>
        <!-- rear wheel -->
        <g transform="translate(50,92)">
          <ellipse cx="0" cy="0" rx="26" ry="26" fill="#111"/>
          <circle cx="0" cy="0" r="20" fill="#222"/>
          <g stroke="#999" stroke-width="2" stroke-linecap="round" opacity="0.9">
            <line x1="-12" y1="-2" x2="12" y2="2"/>
            <line x1="-2" y1="-12" x2="2" y2="12"/>
            <line x1="-12" y1="8" x2="12" y2="-8"/>
          </g>
          <circle cx="0" cy="0" r="6" fill="#333"/>
          <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-3546 0 0" dur="8s" repeatCount="indefinite"/>
        </g>
        <!-- front wheel -->
        <g transform="translate(210,92)">
          <ellipse cx="0" cy="0" rx="26" ry="26" fill="#111"/>
          <circle cx="0" cy="0" r="20" fill="#222"/>
          <g stroke="#999" stroke-width="2" stroke-linecap="round" opacity="0.9">
            <line x1="-12" y1="-2" x2="12" y2="2"/>
            <line x1="-2" y1="-12" x2="2" y2="12"/>
            <line x1="-12" y1="8" x2="12" y2="-8"/>
          </g>
          <circle cx="0" cy="0" r="6" fill="#333"/>
          <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-3546 0 0" dur="8s" repeatCount="indefinite"/>
        </g>
        <!-- handlebar stem -->
        <rect x="200" y="-18" width="6" height="60" rx="3" fill="#333"/>
        <!-- handlebar cross -->
        <g transform="translate(203,-20)">
          <rect x="-40" y="-8" width="80" height="10" rx="5" fill="#2b2b2b"/>
          <rect x="-38" y="-6" width="14" height="6" rx="3" fill="#444"/>
          <rect x="24" y="-6" width="14" height="6" rx="3" fill="#444"/>
        </g>
      </g>

      <!-- Cat group positioned on the deck facing left -->
      <g id="cat" transform="translate(100,34) scale(1)">
        <!-- tail -->
        <path d="M140 54 C168 40, 190 36, 206 42 C196 48, 180 58, 164 64 C156 66, 150 62, 140 54 Z"
          fill="#f07c2c"/>
        <path d="M144 52 C170 44, 186 42, 200 46" stroke="#000" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
        <!-- body -->
        <ellipse cx="92" cy="56" rx="44" ry="30" fill="#fff" />
        <!-- orange patch on body -->
        <path d="M68 48 C78 40, 100 38, 116 48 C108 56, 88 60, 68 56 Z" fill="#f07c2c"/>
        <!-- black patch -->
        <path d="M110 66 C120 62, 132 64, 140 72 C132 74, 120 72, 110 70 Z" fill="#141414"/>
        <!-- front leg (left-facing) -->
        <g transform="translate(60,70)">
          <rect x="-6" y="0" width="12" height="26" rx="6" fill="#fff"/>
          <rect x="-6" y="18" width="12" height="8" rx="4" fill="#f07c2c"/>
        </g>
        <!-- rear leg -->
        <g transform="translate(96,72)">
          <rect x="-6" y="0" width="12" height="28" rx="6" fill="#fff"/>
          <rect x="-6" y="20" width="12" height="8" rx="4" fill="#000"/>
        </g>
        <!-- head facing left -->
        <g transform="translate(44,30)">
          <circle cx="0" cy="0" r="22" fill="#fff"/>
          <!-- orange ear patch left -->
          <path d="M-12 -20 L-6 -34 L0 -20 Z" fill="#f07c2c"/>
          <!-- black patch right -->
          <path d="M4 -8 C10 -12, 14 -4, 8 2 C2 6, -2 4, 4 -8 Z" fill="#000"/>
          <!-- orange cheek -->
          <path d="M-6 -2 C-2 2, 6 4, 10 0 C6 2, -2 0, -6 -2 Z" fill="#f07c2c" opacity="0.9"/>
          <!-- eyes -->
          <ellipse cx="-6" cy="-2" rx="3.2" ry="4" fill="#2b2b2b"/>
          <ellipse cx="4" cy="-2" rx="3" ry="3.8" fill="#111"/>
          <circle cx="-5.2" cy="-3.2" r="0.9" fill="#fff"/>
          <circle cx="3.4" cy="-3.2" r="0.8" fill="#fff"/>
          <!-- nose and mouth -->
          <path d="M0 0 C-2 4, 2 4, 0 0" stroke="#b25" stroke-width="1.5" fill="none" stroke-linecap="round"/>
          <!-- whiskers -->
          <g stroke="#333" stroke-width="1" stroke-linecap="round" opacity="0.9">
            <path d="M-2 2 L-18 0"/>
            <path d="M-2 4 L-18 4"/>
            <path d="M2 2 L18 0"/>
            <path d="M2 4 L18 4"/>
          </g>
        </g>
        <!-- subtle collar -->
        <rect x="64" y="56" width="14" height="6" rx="3" fill="#f05a7a"/>
        <!-- small patch on top of head -->
        <path d="M36 16 C40 10, 50 10, 54 16 C46 18, 40 20, 36 16 Z" fill="#f07c2c"/>
      </g>
    </g>
  </g>

  <!-- Second instance offset by half a cycle so loop appears continuous -->
  <g class="ride" id="ride2">
    <!-- begin negative to start mid-way, creating a continuous replacement -->
    <animateTransform attributeName="transform" type="translate"
      from="1160 300" to="-220 300" dur="8s" begin="-4s" repeatCount="indefinite" calcMode="linear"/>
    <g>
      <animateTransform attributeName="transform" type="translate" dur="1.2s" values="0 0; 0 -6; 0 0" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1"/>
      <ellipse cx="110" cy="120" rx="70" ry="12" fill="#000" opacity="0.12"/>
      <g id="scooter2" transform="translate(40,80)">
        <rect x="20" y="60" rx="8" ry="8" width="220" height="22" fill="#222" />
        <rect x="40" y="64" rx="5" ry="5" width="180" height="12" fill="#2d2d2d" />
        <rect x="60" y="64" width="120" height="8" rx="3" fill="#444" opacity="0.9"/>
        <g transform="translate(50,92)">
          <ellipse cx="0" cy="0" rx="26" ry="26" fill="#111"/>
          <circle cx="0" cy="0" r="20" fill="#222"/>
          <g stroke="#999" stroke-width="2" stroke-linecap="round" opacity="0.9">
            <line x1="-12" y1="-2" x2="12" y2="2"/>
            <line x1="-2" y1="-12" x2="2" y2="12"/>
            <line x1="-12" y1="8" x2="12" y2="-8"/>
          </g>
          <circle cx="0" cy="0" r="6" fill="#333"/>
          <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-3546 0 0" dur="8s" repeatCount="indefinite"/>
        </g>
        <g transform="translate(210,92)">
          <ellipse cx="0" cy="0" rx="26" ry="26" fill="#111"/>
          <circle cx="0" cy="0" r="20" fill="#222"/>
          <g stroke="#999" stroke-width="2" stroke-linecap="round" opacity="0.9">
            <line x1="-12" y1="-2" x2="12" y2="2"/>
            <line x1="-2" y1="-12" x2="2" y2="12"/>
            <line x1="-12" y1="8" x2="12" y2="-8"/>
          </g>
          <circle cx="0" cy="0" r="6" fill="#333"/>
          <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-3546 0 0" dur="8s" repeatCount="indefinite"/>
        </g>
        <rect x="200" y="-18" width="6" height="60" rx="3" fill="#333"/>
        <g transform="translate(203,-20)">
          <rect x="-40" y="-8" width="80" height="10" rx="5" fill="#2b2b2b"/>
          <rect x="-38" y="-6" width="14" height="6" rx="3" fill="#444"/>
          <rect x="24" y="-6" width="14" height="6" rx="3" fill="#444"/>
        </g>
      </g>

      <g id="cat2" transform="translate(100,34) scale(1)">
        <path d="M140 54 C168 40, 190 36, 206 42 C196 48, 180 58, 164 64 C156 66, 150 62, 140 54 Z"
          fill="#f07c2c"/>
        <path d="M144 52 C170 44, 186 42, 200 46" stroke="#000" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
        <ellipse cx="92" cy="56" rx="44" ry="30" fill="#fff" />
        <path d="M68 48 C78 40, 100 38, 116 48 C108 56, 88 60, 68 56 Z" fill="#f07c2c"/>
        <path d="M110 66 C120 62, 132 64, 140 72 C132 74, 120 72, 110 70 Z" fill="#141414"/>
        <g transform="translate(60,70)">
          <rect x="-6" y="0" width="12" height="26" rx="6" fill="#fff"/>
          <rect x="-6" y="18" width="12" height="8" rx="4" fill="#f07c2c"/>
        </g>
        <g transform="translate(96,72)">
          <rect x="-6" y="0" width="12" height="28" rx="6" fill="#fff"/>
          <rect x="-6" y="20" width="12" height="8" rx="4" fill="#000"/>
        </g>
        <g transform="translate(44,30)">
          <circle cx="0" cy="0" r="22" fill="#fff"/>
          <path d="M-12 -20 L-6 -34 L0 -20 Z" fill="#f07c2c"/>
          <path d="M4 -8 C10 -12, 14 -4, 8 2 C2 6, -2 4, 4 -8 Z" fill="#000"/>
          <path d="M-6 -2 C-2 2, 6 4, 10 0 C6 2, -2 0, -6 -2 Z" fill="#f07c2c" opacity="0.9"/>
          <ellipse cx="-6" cy="-2" rx="3.2" ry="4" fill="#2b2b2b"/>
          <ellipse cx="4" cy="-2" rx="3" ry="3.8" fill="#111"/>
          <circle cx="-5.2" cy="-3.2" r="0.9" fill="#fff"/>
          <circle cx="3.4" cy="-3.2" r="0.8" fill="#fff"/>
          <path d="M0 0 C-2 4, 2 4, 0 0" stroke="#b25" stroke-width="1.5" fill="none" stroke-linecap="round"/>
          <g stroke="#333" stroke-width="1" stroke-linecap="round" opacity="0.9">
            <path d="M-2 2 L-18 0"/>
            <path d="M-2 4 L-18 4"/>
            <path d="M2 2 L18 0"/>
            <path d="M2 4 L18 4"/>
          </g>
        </g>
        <rect x="64" y="56" width="14" height="6" rx="3" fill="#f05a7a"/>
        <path d="M36 16 C40 10, 50 10, 54 16 C46 18, 40 20, 36 16 Z" fill="#f07c2c"/>
      </g>
    </g>
  </g>

  <!-- small decorative flowers on ground for visual appeal -->
  <g transform="translate(40,420)" fill="#fff" opacity="0.95">
    <g transform="translate(0,0)">
      <circle cx="0" cy="0" r="4" fill="#ffd"/>
      <path d="M-6 0 C-3 -8, 3 -8, 6 0 C3 -2, -3 -2, -6 0 Z" fill="#ffb6c1" opacity="0.9"/>
    </g>
    <g transform="translate(200,12)">
      <circle cx="0" cy="0" r="4" fill="#ffd"/>
      <path d="M-6 0 C-3 -8, 3 -8, 6 0 C3 -2, -3 -2, -6 0 Z" fill="#fff786" opacity="0.95"/>
    </g>
    <g transform="translate(560,8)">
      <circle cx="0" cy="0" r="4" fill="#ffd"/>
      <path d="M-6 0 C-3 -8, 3 -8, 6 0 C3 -2, -3 -2, -6 0 Z" fill="#f7d1ff" opacity="0.9"/>
    </g>
  </g>
</svg>