      <stop offset="100%" stop-color="#4f9b49"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#53545d"/>
      <stop offset="100%" stop-color="#36373f"/>
    </linearGradient>
    <linearGradient id="deckGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7be0ef"/>
      <stop offset="100%" stop-color="#38abc0"/>
    </linearGradient>
