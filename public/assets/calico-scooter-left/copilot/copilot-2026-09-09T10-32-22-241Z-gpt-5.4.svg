<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fd4ff"/>
      <stop offset="58%" stop-color="#c9efff"/>
      <stop offset="100%" stop-color="#f9fcff"/>
    </linearGradient>
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7ba" stop-opacity="1"/>
      <stop offset="65%" stop-color="#ffd868" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffd868" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hillBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#88c18a"/>
      <stop offset="100%" stop-color="#5f9d6e"/>
    </linearGradient>
    <linearGradient id="hillFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6eaf74"/>
      <stop offset="100%" stop-color="#4d8d57"/>
    </linearGradient>
    <linearGradient id="grassGrad" x1="0" y1="0" x2="0" y2="1">
