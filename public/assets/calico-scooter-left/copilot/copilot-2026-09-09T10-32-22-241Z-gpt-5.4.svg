      .outline{stroke:#4d3a31;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .soft{stroke:#4d3a31;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
      .furWhite{fill:#fff8ef}
      .furOrange{fill:#f3a04e}
      .furBlack{fill:#343239}
      .metal{stroke:#315360;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;fill:none}
      .roadMark{fill:#f8efbf;opacity:.82}
      .wheelRim{fill:#2d2f36;stroke:#1b1d22;stroke-width:3}
      .wheelCore{fill:#d6e6ec;stroke:#1b1d22;stroke-width:3}
      .spoke{stroke:#6a7b86;stroke-width:3.5;stroke-linecap:round}
      .whisk{stroke:#5a4a42;stroke-width:2.1;stroke-linecap:round}
