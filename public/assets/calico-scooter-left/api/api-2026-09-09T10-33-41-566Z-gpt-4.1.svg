<svg width="960" height="540" viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Wheel Gradient -->
    <radialGradient id="wheelGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bbb"/>
      <stop offset="75%" stop-color="#555"/>
      <stop offset="95%" stop-color="#222"/>
    </radialGradient>

    <!-- Fur Patches -->
    <clipPath id="catBodyClip">
      <ellipse cx="159" cy="367" rx="55" ry="36"/>
    </clipPath>
    <clipPath id="catHeadClip">
      <ellipse cx="101" cy="334" rx="31" ry="27"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="#e8fafd"/>
  <rect x="0" y="417" width="960" height="123" fill="#cdf2c8"/>

  <!-- Animated group: scooter and cat -->
  <g>
    <g id="scooterCat" transform="translate(1000,0)">
      <!-- Animate group gliding from right to left -->
      <animateTransform attributeName="transform" type="translate"
        from="1000,0" to="-320,0" dur="8s" repeatCount="indefinite" />

      <!-- Kick Scooter -->
      <!-- Deck -->
      <rect x="100" y="395" width="150" height="12" rx="6" fill="#666" stroke="#333" stroke-width="3"/>
      <!-- Wheels (shadow behind for depth) -->
      <ellipse cx="120" cy="410" rx="28" ry="8" fill="#999" opacity="0.22"/>
      <ellipse cx="250" cy="410" rx="28" ry="8" fill="#999" opacity="0.22"/>

      <!-- Wheel front -->
      <g>
        <g>
          <circle id="wheelF" cx="124" cy="405" r="24" fill="url(#wheelGrad)" stroke="#222" stroke-width="4"/>
          <!-- Spokes -->
          <g>
            <g>
              <rect x="123" y="382" width="2" height="24" fill="#bbb"/>
              <rect x="123" y="405" width="2" height="24" fill="#bbb" transform="rotate(180 124 417)"/>
              <rect x="123" y="405" width="2" height="24" fill="#bbb" transform="rotate(90 124 417)"/>
              <rect x="123" y="405" width="2" height="24" fill="#bbb" transform="rotate(270 124 417)"/>
              <rect x="123" y="405" width="2" height="24" fill="#bbb" transform="rotate(45 124 417)"/>
              <rect x="123" y="405" width="2" height="24" fill="#bbb" transform="rotate(135 124 417)"/>
              <rect x="123" y="405" width="2" height="24" fill="#bbb" transform="rotate(225 124 417)"/>
              <rect x="123" y="405" width="2" height="24" fill="#bbb" transform="rotate(315 124 417)"/>
            </g>
          </g>
          <!-- Rim -->
          <circle cx="124" cy="405" r="18" fill="none" stroke="#aaa" stroke-width="2"/>
          <circle cx="124" cy="405" r="4" fill="#eee" stroke="#888" stroke-width="1"/>
          <!-- Wheel Rotation -->
          <animateTransform attributeName="transform" type="rotate"
            from="0 124 405" to="1440 124 405" dur="8s" repeatCount="indefinite"/>
        </g>
      </g>
      <!-- Wheel rear -->
      <g>
        <g>
          <circle id="wheelR" cx="230" cy="405" r="24" fill="url(#wheelGrad)" stroke="#222" stroke-width="4"/>
          <!-- Spokes -->
          <g>
            <rect x="229" y="382" width="2" height="24" fill="#c2c2c2"/>
            <rect x="229" y="405" width="2" height="24" fill="#c2c2c2" transform="rotate(180 230 417)"/>
            <rect x="229" y="405" width="2" height="24" fill="#c2c2c2" transform="rotate(90 230 417)"/>
            <rect x="229" y="405" width="2" height="24" fill="#c2c2c2" transform="rotate(270 230 417)"/>
            <rect x="229" y="405" width="2" height="24" fill="#c2c2c2" transform="rotate(45 230 417)"/>
            <rect x="229" y="405" width="2" height="24" fill="#c2c2c2" transform="rotate(135 230 417)"/>
            <rect x="229" y="405" width="2" height="24" fill="#c2c2c2" transform="rotate(225 230 417)"/>
            <rect x="229" y="405" width="2" height="24" fill="#c2c2c2" transform="rotate(315 230 417)"/>
          </g>
          <!-- Rim -->
          <circle cx="230" cy="405" r="18" fill="none" stroke="#aaa" stroke-width="2"/>
          <circle cx="230" cy="405" r="4" fill="#eee" stroke="#888" stroke-width="1"/>
          <!-- Wheel Rotation -->
          <animateTransform attributeName="transform" type="rotate"
            from="0 230 405" to="1440 230 405" dur="8s" repeatCount="indefinite"/>
        </g>
      </g>
      <!-- Handlebar stem -->
      <rect x="227" y="328" width="8" height="75" rx="4" fill="#888" stroke="#444" stroke-width="2"/>
      <!-- Handlebar (horizontal part) -->
      <rect x="213" y="318" width="36" height="10" rx="5" fill="#666" stroke="#333" stroke-width="2"/>
      <!-- Handlebar grips -->
      <rect x="211" y="318" width="7" height="10" rx="4" fill="#c7532c" stroke="#601d08" stroke-width="1"/>
      <rect x="242" y="318" width="7" height="10" rx="4" fill="#c7532c" stroke="#601d08" stroke-width="1"/>

      <!-- Calico Cat -->
      <g id="calicoCat">
        <!-- Tail (behind deck) -->
        <g>
          <path d="M200 394
                   Q238 410 206 350
                   Q192 325 186 360
                   Q188 390 200 394"
                fill="#fffaf2" stroke="#2c2220" stroke-width="6" stroke-linecap="round"/>
          <!-- Color tail tip -->
          <path d="M215 375
                   Q218 390 200 388
                   Q193 384 200 378
                   Q212 368 215 375 Z"
                fill="#ce9242" stroke="#2c2220" stroke-width="1"/>
        </g>
        <!-- Left Rear Leg -->
        <g>
          <ellipse cx="179" cy="403" rx="11" ry="25" fill="#fff" stroke="#2c2220" stroke-width="5"/>
          <!-- Fur spot on leg -->
          <ellipse cx="179" cy="408" rx="7" ry="9" fill="#20222a" opacity="0.65"/>
        </g>
        <!-- Cat body main -->
        <g clip-path="url(#catBodyClip)">
          <ellipse cx="159" cy="367" rx="55" ry="36" fill="#fffaf2" stroke="#2c2220" stroke-width="7"/>
          <!-- Orange patches -->
          <ellipse cx="165" cy="355" rx="34" ry="15" fill="#faab34"/>
          <!-- Black patch -->
          <ellipse cx="151" cy="373" rx="12" ry="11" fill="#20222a"/>
          <ellipse cx="183" cy="385" rx="19" ry="9" fill="#2c2220"/>
        </g>
        <!-- Cat neck (under head) -->
        <ellipse cx="120" cy="350" rx="12" ry="16" fill="#fffaf2" stroke="#2c2220" stroke-width="6"/>
        <!-- Cat chest/shoulder patch -->
        <ellipse cx="140" cy="387" rx="15" ry="11" fill="#faab34" opacity="0.88"/>
        <!-- Left front leg (gliding, bent for movement pose) -->
        <g>
          <ellipse cx="193" cy="398" rx="11" ry="24" fill="#fff" stroke="#2c2220" stroke-width="5" transform="rotate(-13 193 398)"/>
          <!-- Paw orange patch -->
          <ellipse cx="194" cy="416" rx="8" ry="5" fill="#faab34"/>
        </g>
        <!-- Right front leg (standing on deck) -->
        <g>
          <ellipse cx="145" cy="414" rx="12" ry="21" fill="#fff" stroke="#2c2220" stroke-width="5" transform="rotate(-7 145 414)"/>
          <!-- Leg black patch -->
          <ellipse cx="151" cy="422" rx="5" ry="7" fill="#20222a"/>
        </g>
        <!-- Cat head -->
        <g clip-path="url(#catHeadClip)">
          <ellipse cx="101" cy="334" rx="31" ry="27" fill="#fffaf2" stroke="#2c2220" stroke-width="6"/>
          <!-- Orange patch left -->
          <ellipse cx="92" cy="327" rx="17" ry="13" fill="#faab34" transform="rotate(-15 92 327)"/>
          <!-- Orange patch right -->
          <ellipse cx="113" cy="336" rx="12" ry="10" fill="#faab34" transform="rotate(18 113 336)"/>
          <!-- Black patch -->
          <ellipse cx="105" cy="322" rx="13" ry="7" fill="#20222a"/>
        </g>
        <!-- Left ear (inside, behind) -->
        <g>
          <polygon points="81,317 97,312 92,327" fill="#fddec6"/>
          <polygon points="81,317 97,312 92,327" fill="none" stroke="#2c2220" stroke-width="4"/>
        </g>
        <!-- Right ear (inside, behind) -->
        <g>
          <polygon points="119,318 111,327 129,331" fill="#fddec6"/>
          <polygon points="119,318 111,327 129,331" fill="none" stroke="#2c2220" stroke-width="4"/>
        </g>
        <!-- Face details -->
        <!-- Nose -->
        <ellipse cx="103" cy="343" rx="5" ry="3" fill="#f59c83" stroke="#2c2220" stroke-width="2"/>
        <!-- Mouth -->
        <path d="M102 345 Q101 350 106 347" fill="none" stroke="#2c2220" stroke-width="2" stroke-linecap="round"/>
        <!-- Left eye -->
        <ellipse cx="94" cy="338" rx="4.2" ry="6" fill="#232d36"/>
        <ellipse cx="92.5" cy="342.8" rx="1.2" ry="1.7" fill="#fff" opacity="0.9"/>
        <!-- Right eye -->
        <ellipse cx="115" cy="342" rx="4.2" ry="6" fill="#232d36"/>
        <ellipse cx="113.5" cy="346.5" rx="1.1" ry="1.7" fill="#fff" opacity="0.85"/>
        <!-- Whiskers Left -->
        <path d="M87 346 Q68 344 82 352" stroke="#51544f" stroke-width="2" stroke-linecap="round" fill="none"/>
        <path d="M87 347 Q68 352 82 356" stroke="#51544f" stroke-width="2" stroke-linecap="round" fill="none"/>
        <path d="M92 350 Q76 360 93 353" stroke="#51544f" stroke-width="2" stroke-linecap="round" fill="none"/>
        <!-- Whiskers Right -->
        <path d="M125 347 Q146 345 130 352" stroke="#51544f" stroke-width="2" stroke-linecap="round" fill="none"/>
        <path d="M126 349 Q146 353 132 355" stroke="#51544f" stroke-width="2" stroke-linecap="round" fill="none"/>
        <path d="M118 352 Q134 362 119 355" stroke="#51544f" stroke-width="2" stroke-linecap="round" fill="none"/>
        <!-- Head outline (over ears, chin) -->
        <ellipse cx="101" cy="334" rx="31" ry="27" fill="none" stroke="#2c2220" stroke-width="6"/>
      </g>
    </g>
  </g>
</svg>