<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" xmlns:xlink="http://www.w3.org/1999/xlink">
  <!-- Background -->
  <rect width="960" height="540" fill="#87CEEB" />
  <rect y="480" width="960" height="60" fill="#228B22" />

  <!-- Scooter path animation -->
  <g>
    <defs>
      <path id="path" d="M960,400 L-200,400" />
    </defs>
  </g>

  <!-- Scooter and Cat -->
  <g id="scooter-cat">
    <!-- Scooter -->
    <g id="scooter">
      <rect x="120" y="380" width="100" height="10" rx="5" fill="#555" />
      <rect x="160" y="300" width="10" height="80" fill="#333" />
      <circle cx="130" cy="400" r="20" fill="#999" stroke="#333" stroke-width="4" />
      <circle cx="190" cy="400" r="20" fill="#999" stroke="#333" stroke-width="4" />

      <!-- Rotating wheels -->
      <circle cx="130" cy="400" r="10" fill="#333">
        <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 130 400" to="360 130 400" dur="1s" repeatCount="indefinite" />
      </circle>
      <circle cx="190" cy="400" r="10" fill="#333">
        <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 190 400" to="360 190 400" dur="1s" repeatCount="indefinite" />
      </circle>
    </g>

    <!-- Cat -->
    <g id="cat">
      <!-- Body -->
      <ellipse cx="160" cy="350" rx="30" ry="40" fill="white" />
      <path d="M150 320 Q160 300 170 320 Z" fill="orange" />
      <path d="M160 350 L140 370 L160 370 Z" fill="black" />
      <path d="M160 350 L180 370 L160 370 Z" fill="orange" />

      <!-- Head -->
      <circle cx="160" cy="310" r="20" fill="white" />
      <circle cx="150" cy="310" r="7" fill="black" />
      <circle cx="170" cy="310" r="7" fill="black" />
      <path d="M150 300 Q160 290 170 300 Z" fill="orange" />

      <!-- Tail -->
      <path d="M190 360 Q220 340 210 310" fill="none" stroke="orange" stroke-width="5" />
    </g>
  </g>

  <!-- Animation for gliding -->
  <animateMotion xlink:href="#scooter-cat" dur="8s" repeatCount="indefinite">
    <mpath xlink:href="#path" />
  </animateMotion>
</svg>