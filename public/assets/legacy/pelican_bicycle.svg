<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc">
  <title id="title">A pelican riding a bicycle</title>
  <desc id="desc">A cheerful pelican pedals a blue bicycle beneath a sunny sky.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfeaff"/>
      <stop offset="1" stop-color="#f4fbff"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#82d4db"/>
      <stop offset="1" stop-color="#5ab7ce"/>
    </linearGradient>
    <linearGradient id="bikePaint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6d72"/>
      <stop offset="1" stop-color="#d93664"/>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc954"/>
      <stop offset="1" stop-color="#ed8c32"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="700" rx="32" fill="url(#sky)"/>
  <circle cx="820" cy="125" r="62" fill="#ffd76a" opacity=".95"/>
  <g fill="#fff" opacity=".8">
    <path d="M90 160c0-24 20-43 44-43 8-27 32-45 61-45 33 0 60 25 64 57 8-6 18-9 29-9 26 0 47 19 50 44H90Z"/>
    <path d="M670 225c0-19 15-35 35-35 7-22 26-37 50-37 27 0 49 20 53 46 7-5 15-7 24-7 21 0 39 15 42 36H670Z"/>
  </g>
  <path d="M0 520c170-34 286-32 438 6 170 43 334 32 562-18v192H0Z" fill="url(#water)"/>
  <path d="M0 560c180-28 310-20 445 14 161 40 338 26 555-18" fill="none" stroke="#d7f7f3" stroke-width="7" opacity=".65"/>

  <!-- Ground shadow -->
  <ellipse cx="510" cy="638" rx="390" ry="25" fill="#216c85" opacity=".2" filter="url(#shadow)"/>

  <!-- Continuously animated pelican riding a bicycle -->
  <g id="rider">
    <!-- Bicycle -->
    <g stroke="#123b59" stroke-linecap="round" stroke-linejoin="round">
    <!-- wheels -->
    <g fill="none" stroke-width="12">
      <circle cx="275" cy="520" r="105" fill="#e9f7fb"/>
      <circle cx="725" cy="520" r="105" fill="#e9f7fb"/>
    </g>
    <g fill="none" stroke="#8fc8d7" stroke-width="4" opacity=".9">
      <circle cx="275" cy="520" r="88"/>
      <circle cx="725" cy="520" r="88"/>
    </g>
    <g id="rear-wheel-spokes" fill="none" stroke="#8fc8d7" stroke-width="4" opacity=".9">
      <path d="M275 415v210M170 520h210M201 446l148 148M201 594l148-148"/>
      <animateTransform attributeName="transform" type="rotate" from="0 275 520" to="360 275 520" dur="1.2s" repeatCount="indefinite"/>
    </g>
    <g id="front-wheel-spokes" fill="none" stroke="#8fc8d7" stroke-width="4" opacity=".9">
      <path d="M725 415v210M620 520h210M651 446l148 148M651 594l148-148"/>
      <animateTransform attributeName="transform" type="rotate" from="0 725 520" to="360 725 520" dur="1.2s" repeatCount="indefinite"/>
    </g>
    <!-- frame -->
    <g fill="none" stroke="url(#bikePaint)" stroke-width="15">
      <path d="M275 520 430 355 490 520 275 520Z"/>
      <path d="M430 355 725 520"/>
      <path d="M490 520 725 520"/>
    </g>
    <!-- front fork and handlebar -->
    <path d="M725 520 690 350 710 318" fill="none" stroke="#123b59" stroke-width="12"/>
    <path d="M690 350c22-17 48-18 72-3l24 15" fill="none" stroke="#123b59" stroke-width="11"/>
    <path d="M785 362c12 4 18 14 13 25-5 10-18 13-27 6" fill="none" stroke="#123b59" stroke-width="9"/>
    <!-- seat and seat post -->
    <path d="M430 355 421 320" fill="none" stroke="#123b59" stroke-width="11"/>
    <path d="M390 316c21-11 48-10 67 1" fill="none" stroke="#123b59" stroke-width="15"/>
    <!-- crank and pedals -->
    <g id="crank">
      <circle cx="490" cy="520" r="25" fill="#ffd45f" stroke-width="8"/>
      <path d="M490 520 530 488M490 520 451 550" fill="none" stroke="#123b59" stroke-width="8"/>
      <path d="M530 488h28M451 550h-28" fill="none" stroke="#123b59" stroke-width="7"/>
      <animateTransform attributeName="transform" type="rotate" from="0 490 520" to="360 490 520" dur="1.2s" repeatCount="indefinite"/>
    </g>
    <!-- hubs -->
    <circle cx="275" cy="520" r="11" fill="#ffd45f" stroke-width="6"/>
    <circle cx="725" cy="520" r="11" fill="#ffd45f" stroke-width="6"/>
    </g>

    <!-- Pelican -->
    <g stroke="#183b54" stroke-linecap="round" stroke-linejoin="round">
    <!-- body -->
    <path d="M430 365c-25-52-14-125 39-165 55-42 133-28 164 28 25 44 10 107-31 139-38 30-105 33-172-2Z" fill="#f8fbf7" stroke-width="8"/>
    <!-- back feather shading -->
    <path d="M484 206c-27 36-29 89-4 132 17 29 48 44 73 46-28-30-38-70-30-111 7-37 26-61 48-80-30-11-62-7-87 13Z" fill="#cbdde0" stroke="none"/>
    <!-- wing -->
    <path d="M493 250c-27 22-35 71-11 111 26 42 83 43 119 15-24-6-46-18-58-39-19-31-18-63-2-92-16-5-32-3-48 5Z" fill="#e6f0ef" stroke-width="7"/>
    <path d="M477 345c30 19 67 19 102 4M493 289c14 18 28 33 49 43M482 315c15 17 31 29 51 37" fill="none" stroke="#adc9ce" stroke-width="6"/>
    <!-- head -->
    <ellipse cx="584" cy="184" rx="78" ry="75" fill="#fffdf8" stroke-width="8"/>
    <path d="M530 145c12-32 46-52 78-43 26 7 46 27 52 54-27-16-53-17-79-5-17 8-34 8-51-6Z" fill="#d6e6e5" stroke="none"/>
    <!-- eye -->
    <circle cx="618" cy="169" r="15" fill="#183b54" stroke-width="5"/>
    <circle cx="623" cy="164" r="5" fill="#fff" stroke="none"/>
    <!-- beak -->
    <path d="M631 193c48 1 112 19 145 44-38 24-90 22-132 5-25-10-38-26-36-42 4-6 11-8 23-7Z" fill="url(#beak)" stroke-width="8"/>
    <path d="M630 216c48 17 94 17 137 2" fill="none" stroke="#c96b2e" stroke-width="6"/>
    <path d="M655 235c16 10 35 16 53 17" fill="none" stroke="#fff0ba" stroke-width="9"/>
    <!-- neck pouch -->
    <path d="M566 230c-25 31-36 74-25 116 10 32 38 47 67 39 30-8 48-36 43-71-4-32-25-67-55-91-10-7-22-4-30 7Z" fill="#f0a83c" stroke-width="7"/>
    <path d="M548 253c25 20 47 26 77 18M542 278c24 18 48 25 82 17M540 306c23 16 47 22 79 14" fill="none" stroke="#d77c2e" stroke-width="5"/>
    <!-- tail -->
    <path d="M439 365c-42 5-69 18-91 43 30 9 64 4 96-15" fill="#dcebea" stroke-width="7"/>
    <!-- alternating legs and webbed feet -->
    <g id="left-leg">
      <path d="M500 382c-1 46-1 79-10 117" fill="none" stroke="#e39a35" stroke-width="13"/>
      <path d="M489 493c-19-8-34-3-43 8 14 8 27 10 41 7 8 12 18 16 30 13-3-12-12-22-28-28Z" fill="#f4b544" stroke-width="6"/>
      <animateTransform attributeName="transform" type="rotate" values="-18 500 382;18 500 382;-18 500 382" dur="1.2s" repeatCount="indefinite"/>
    </g>
    <g id="right-leg">
      <path d="M541 382c11 40 18 70 13 111" fill="none" stroke="#e39a35" stroke-width="13"/>
      <path d="M553 482c17-10 33-7 43 3-12 10-25 14-40 12-7 13-17 18-29 16 2-12 10-23 26-31Z" fill="#f4b544" stroke-width="6"/>
      <animateTransform attributeName="transform" type="rotate" values="18 541 382;-18 541 382;18 541 382" dur="1.2s" repeatCount="indefinite"/>
    </g>
    <!-- wing gesture / handlebar grip -->
    <path d="M592 329c40 6 73 11 101 18" fill="none" stroke="#f8fbf7" stroke-width="26"/>
    <path d="M592 329c40 6 73 11 101 18" fill="none" stroke-width="7"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0;0 -5;0 0" dur="1.2s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Motion marks -->
  <g fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" opacity=".85">
    <path d="M126 370h74"/>
    <path d="M100 405h45"/>
    <path d="M815 410h62"/>
  </g>
  <g fill="#ffcf58">
    <circle cx="112" cy="475" r="6"/>
    <circle cx="865" cy="300" r="7"/>
    <circle cx="160" cy="290" r="5"/>
  </g>
</svg>
