      <stop stop-color="#F9D3A2"/>
      <stop offset="1" stop-color="#FBE3BC"/>
    </linearGradient>
    <linearGradient id="pouch" x1="754" y1="239" x2="758" y2="327" gradientUnits="userSpaceOnUse">
