<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" fill="none" role="img" aria-labelledby="title description">
  <title id="title">A pelican out for a bicycle ride</title>
  <desc id="description">A cheerful white pelican with an enormous golden bill and a fluttering coral scarf pedals a teal bicycle beside the sea. Its wing rests on the handlebars and its orange webbed feet press the pedals. A warm peach sun hangs in a cream-colored sky.</desc>
