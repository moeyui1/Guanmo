<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Animated pelican riding a bicycle</title>
  <desc id="desc">A cheerful pelican pedals a blue bicycle along a looping coastal road while clouds drift and the wheels spin.</desc>
  <style>
    :root {
      color-scheme: light;
    }

    svg {
      background: linear-gradient(#9ddcf3 0%, #c8eef4 58%, #f8dca6 58%, #f1c371 100%);
      overflow: hidden;
    }

    .cloud {
      animation: drift 18s linear infinite;
    }

    .cloud.slow {
      animation-duration: 27s;
      animation-delay: -8s;
    }

    .road-mark {
      animation: road 1.15s linear infinite;
    }

    .pelican {
      animation: bob 1.15s ease-in-out infinite;
    }

    .wheel-spin {
      transform-box: fill-box;
      transform-origin: center;
      animation: spin 0.8s linear infinite;
    }

    .pedal-spin {
      transform-box: fill-box;
      transform-origin: 50% 50%;
      animation: spin 0.8s linear infinite;
    }

    .wing {
      transform-box: fill-box;
      transform-origin: 25% 45%;
      animation: wing 1.15s ease-in-out infinite;
    }

    .tail {
      transform-box: fill-box;
      transform-origin: 20% 50%;
      animation: tail 0.8s ease-in-out infinite;
    }

    .beak-tip {
      transform-box: fill-box;
      transform-origin: 0% 50%;
      animation: beak 2.4s ease-in-out infinite;
    }

    .foot-front {
      animation: footFront 0.8s ease-in-out infinite;
    }

    .foot-back {
      animation: footBack 0.8s ease-in-out infinite;
    }

    @keyframes drift {
      from { transform: translateX(1240px); }
      to { transform: translateX(-340px); }
    }

    @keyframes road {
      from { transform: translateX(0); }
      to { transform: translateX(-160px); }
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes wing {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(8deg) translateY(5px); }
    }

    @keyframes tail {
      0%, 100% { transform: rotate(3deg); }
      50% { transform: rotate(-8deg); }
    }

    @keyframes beak {
      0%, 85%, 100% { transform: rotate(0deg); }
      90% { transform: rotate(3deg); }
    }

    @keyframes footFront {
      0%, 100% { transform: translate(0, 0) rotate(-14deg); }
      50% { transform: translate(94px, -18px) rotate(16deg); }
    }

    @keyframes footBack {
      0%, 100% { transform: translate(0, 0) rotate(16deg); }
      50% { transform: translate(68px, -30px) rotate(-14deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .cloud,
      .road-mark,
      .pelican,
      .wheel-spin,
      .pedal-spin,
      .wing,
      .tail,
      .beak-tip,
      .foot-front,
      .foot-back {
        animation: none;
      }
    }
  </style>

  <defs>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#fff6a8" />
      <stop offset="65%" stop-color="#ffd66b" />
      <stop offset="100%" stop-color="#f7aa43" />
    </radialGradient>

    <linearGradient id="beakGradient" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#f8d36a" />
      <stop offset="62%" stop-color="#f3aa38" />
      <stop offset="100%" stop-color="#e37b2f" />
    </linearGradient>

    <linearGradient id="bodyGradient" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fffdf1" />
      <stop offset="72%" stop-color="#f4ead3" />
      <stop offset="100%" stop-color="#dbcaa6" />
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="7" flood-color="#6c5130" flood-opacity="0.22" />
    </filter>

    <g id="cloudShape">
      <ellipse cx="55" cy="35" rx="54" ry="24" fill="#ffffff" opacity="0.9" />
      <ellipse cx="97" cy="30" rx="42" ry="29" fill="#ffffff" opacity="0.9" />
      <ellipse cx="137" cy="41" rx="55" ry="22" fill="#ffffff" opacity="0.9" />
      <ellipse cx="88" cy="48" rx="92" ry="18" fill="#ffffff" opacity="0.9" />
    </g>
  </defs>

  <circle cx="100" cy="98" r="55" fill="url(#sunGlow)" opacity="0.95" />
  <path d="M0 433 C155 386 304 396 451 423 C599 449 736 447 879 403 C1006 364 1114 369 1200 389 L1200 560 L0 560 Z" fill="#9fcf8c" opacity="0.75" />
  <path d="M0 477 C130 442 253 449 380 472 C557 505 714 497 881 451 C1016 414 1114 421 1200 439 L1200 560 L0 560 Z" fill="#6fb47f" opacity="0.75" />

  <g class="cloud slow" transform="translate(0 0)">
    <use href="#cloudShape" x="0" y="93" />
  </g>
  <g class="cloud" transform="translate(0 0)">
    <use href="#cloudShape" x="0" y="172" transform="scale(0.78)" />
  </g>
  <g class="cloud slow" transform="translate(0 0)">
    <use href="#cloudShape" x="0" y="260" transform="scale(0.58)" opacity="0.78" />
  </g>

  <rect x="-20" y="560" width="1240" height="160" fill="#5a5b61" />
  <rect x="-20" y="557" width="1240" height="14" fill="#44464f" />
  <g class="road-mark">
    <rect x="20" y="632" width="95" height="13" rx="6.5" fill="#ffd884" />
    <rect x="180" y="632" width="95" height="13" rx="6.5" fill="#ffd884" />
    <rect x="340" y="632" width="95" height="13" rx="6.5" fill="#ffd884" />
    <rect x="500" y="632" width="95" height="13" rx="6.5" fill="#ffd884" />
    <rect x="660" y="632" width="95" height="13" rx="6.5" fill="#ffd884" />
    <rect x="820" y="632" width="95" height="13" rx="6.5" fill="#ffd884" />
    <rect x="980" y="632" width="95" height="13" rx="6.5" fill="#ffd884" />
    <rect x="1140" y="632" width="95" height="13" rx="6.5" fill="#ffd884" />
