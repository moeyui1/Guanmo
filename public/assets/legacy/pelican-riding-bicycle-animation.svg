      <circle r="72" fill="none" stroke="#e9eef4" stroke-width="4" opacity="0.72" />
      <g class="wheel-spin">
        <line x1="-78" y1="0" x2="78" y2="0" stroke="#d9e7f1" stroke-width="4" stroke-linecap="round" />
        <line x1="0" y1="-78" x2="0" y2="78" stroke="#d9e7f1" stroke-width="4" stroke-linecap="round" />
        <line x1="-55" y1="-55" x2="55" y2="55" stroke="#d9e7f1" stroke-width="4" stroke-linecap="round" />
        <line x1="55" y1="-55" x2="-55" y2="55" stroke="#d9e7f1" stroke-width="4" stroke-linecap="round" />
      </g>
      <circle r="13" fill="#203043" />
    </g>

    <path d="M430 525 L535 407 L575 515 Z M535 407 L705 525 L575 515 M535 407 L682 407 L735 525 M682 407 L575 515" fill="none" stroke="#156b9f" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M519 394 L555 394" stroke="#26323d" stroke-width="18" stroke-linecap="round" />
    <path d="M681 407 C702 386 732 389 754 405" fill="none" stroke="#26323d" stroke-width="13" stroke-linecap="round" />
    <path d="M694 410 L719 374" stroke="#156b9f" stroke-width="11" stroke-linecap="round" />
    <path d="M535 407 L520 360" stroke="#156b9f" stroke-width="11" stroke-linecap="round" />
    <circle cx="575" cy="515" r="21" fill="#f6d05f" stroke="#203043" stroke-width="8" />

    <g transform="translate(575 515)">
      <g class="pedal-spin">
        <line x1="-58" y1="0" x2="58" y2="0" stroke="#203043" stroke-width="9" stroke-linecap="round" />
        <rect x="-82" y="-9" width="44" height="18" rx="8" fill="#f47b3f" />
        <rect x="38" y="-9" width="44" height="18" rx="8" fill="#f47b3f" />
      </g>
    </g>
  </g>

  <g class="pelican" filter="url(#softShadow)">
    <path class="tail" d="M358 381 C312 351 279 333 235 326 C263 363 297 390 352 407 Z" fill="#efe4c8" stroke="#243548" stroke-width="6" stroke-linejoin="round" />
    <ellipse cx="492" cy="368" rx="149" ry="83" fill="url(#bodyGradient)" stroke="#243548" stroke-width="7" />
    <path d="M565 333 C626 329 675 365 698 421 C650 428 587 409 544 367 Z" fill="#d8e7ec" stroke="#243548" stroke-width="6" opacity="0.95" />
    <path class="wing" d="M403 336 C475 336 526 374 542 435 C460 435 402 399 369 354 C376 344 387 338 403 336 Z" fill="#f7c15e" stroke="#243548" stroke-width="7" stroke-linejoin="round" />
    <path d="M476 402 C500 421 520 427 545 428" fill="none" stroke="#c47931" stroke-width="5" stroke-linecap="round" opacity="0.72" />

    <path d="M609 330 C623 276 651 240 693 222 C723 209 754 219 769 244 C785 270 767 296 731 304 C688 314 650 329 621 354 Z" fill="#fff9e8" stroke="#243548" stroke-width="7" stroke-linejoin="round" />
    <path d="M704 243 C793 225 885 239 945 281 C872 308 791 305 715 286 Z" fill="url(#beakGradient)" stroke="#243548" stroke-width="7" stroke-linejoin="round" />
    <path class="beak-tip" d="M932 281 C957 278 980 282 1000 294 C975 305 949 305 919 294 Z" fill="#e96e31" stroke="#243548" stroke-width="7" stroke-linejoin="round" />
    <path d="M710 286 C769 292 849 292 919 278" fill="none" stroke="#9c6531" stroke-width="5" stroke-linecap="round" opacity="0.55" />
    <path d="M703 293 C731 336 794 350 835 324 C824 366 788 389 743 382 C697 375 662 337 660 300 Z" fill="#f3bd73" stroke="#243548" stroke-width="6" stroke-linejoin="round" opacity="0.96" />
    <circle cx="729" cy="246" r="10" fill="#243548" />
    <circle cx="733" cy="242" r="3.5" fill="#ffffff" />
    <path d="M662 231 C675 213 707 202 735 211" fill="none" stroke="#243548" stroke-width="6" stroke-linecap="round" />

    <path d="M550 435 C525 465 520 493 546 528" fill="none" stroke="#e89242" stroke-width="16" stroke-linecap="round">
      <animate attributeName="d" dur="0.8s" repeatCount="indefinite" values="M550 435 C525 465 520 493 546 528; M550 435 C530 455 556 483 617 498; M550 435 C525 465 520 493 546 528" />
    </path>
    <path d="M610 430 C640 462 650 492 617 532" fill="none" stroke="#e89242" stroke-width="16" stroke-linecap="round">
      <animate attributeName="d" dur="0.8s" repeatCount="indefinite" values="M610 430 C640 462 650 492 617 532; M610 430 C660 455 684 468 711 510; M610 430 C640 462 650 492 617 532" />
    </path>

    <g transform="translate(500 523)">
      <g class="foot-back">
