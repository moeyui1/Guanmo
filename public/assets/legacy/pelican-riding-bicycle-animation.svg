    </g>
    <g transform="translate(596 525)">
      <g class="foot-front">
        <path d="M0 0 C24 -11 45 -7 63 8 C39 18 17 16 0 0 Z" fill="#f47b3f" stroke="#243548" stroke-width="5" stroke-linejoin="round" />
      </g>
    </g>

    <path d="M476 292 C454 258 469 230 501 218 C522 210 544 216 556 232 C524 239 507 258 507 294 Z" fill="#dce9ef" stroke="#243548" stroke-width="6" stroke-linejoin="round" />
    <path d="M521 222 C539 197 573 193 596 212" fill="none" stroke="#243548" stroke-width="6" stroke-linecap="round" />
    <path d="M498 216 C506 200 526 193 545 197" fill="none" stroke="#243548" stroke-width="5" stroke-linecap="round" />
  </g>

  <g opacity="0.45">
    <path d="M72 520 C118 501 168 501 219 520" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" />
    <path d="M882 523 C934 503 990 506 1042 527" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" />
  </g>
</svg>
