<svg xmlns:xlink="http://www.w3.org/1999/xlink" width="320" height="180" viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg">
  <rect width="320" height="180" fill="#f6f4e8"/>
  <!-- 滑板阴影 -->
  <ellipse id="shadow" cx="220" cy="150" rx="35" ry="10" fill="#bbb" opacity="0.4">
    <animate attributeName="cx" values="220;80" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  <!-- 滑板 -->
  <g id="skateboard">
    <rect x="185" y="135" rx="12" ry="14" width="70" height="18" fill="#1a1e22" />
    <!-- 轮子 -->
    <circle cx="200" cy="156" r="7" fill="#45474a">
      <animate attributeName="cx" values="200;60" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="240" cy="156" r="7" fill="#45474a">
      <animate attributeName="cx" values="240;100" dur="3s" repeatCount="indefinite" />
    </circle>
    <!-- 轮毂 -->
    <circle cx="200" cy="156" r="2" fill="#fff">
      <animate attributeName="cx" values="200;60" dur="3s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" attributeType="XML" type="rotate"
        from="0 200 156" to="720 200 156" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="240" cy="156" r="2" fill="#fff">
      <animate attributeName="cx" values="240;100" dur="3s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" attributeType="XML" type="rotate"
        from="0 240 156" to="720 240 156" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
  <!-- 三花猫整体组 -->
  <g id="calico_cat">
    <!-- 身体 -->
    <ellipse id="body" cx="215" cy="131" rx="25" ry="18" fill="#fff" />
    <!-- 橘色斑点身上 -->
    <ellipse cx="221" cy="130" rx="10" ry="7" fill="#e89044" opacity="0.90"/>
    <!-- 黑色斑点身上 -->
    <ellipse cx="208" cy="132" rx="6" ry="4.5" fill="#42312a" opacity="0.85"/>
    <!-- 尾巴 -->
    <path d="M192,138 Q184,146 201,145 Q207,143 195,140" fill="none" stroke="#42312a" stroke-width="6" stroke-linecap="round"/>
    <path d="M195,140 Q187,139 197,136" fill="none" stroke="#e89044" stroke-width="3" stroke-linecap="round"/>
    <!-- 头 -->
    <ellipse id="head" cx="237" cy="120" rx="15" ry="14" fill="#fff" />
    <!-- 头：橘色斑点 -->
    <ellipse cx="242" cy="114" rx="7" ry="5" fill="#e89044" opacity="0.9"/>
    <!-- 头：黑色斑点 -->
    <ellipse cx="233" cy="123" rx="4" ry="3" fill="#42312a" opacity="0.83"/>
    <!-- 耳朵 -->
    <polygon points="226,107 231,117 236,114" fill="#42312a" />
    <polygon points="246,107 241,117 236,114" fill="#e89044"/>
    <!-- 脸 -->
    <ellipse cx="234" cy="122" rx="2" ry="2.3" fill="#222"/>
    <ellipse cx="241" cy="120" rx="1.7" ry="2.1" fill="#222"/>
    <!-- 嘴 -->
    <path d="M236,127 Q237,129 239,127" stroke="#cc7a5d" stroke-width="1.2" fill="none"/>
    <!-- 腮红 -->
    <ellipse cx="230" cy="125" rx="1.5" ry="0.5" fill="#ffb5ae" opacity="0.75"/>
    <ellipse cx="244" cy="123" rx="1.2" ry="0.4" fill="#ffb5ae" opacity="0.75"/>
    <!-- 前腿 -->
    <ellipse cx="220" cy="142" rx="4" ry="5" fill="#fff"/>
    <ellipse cx="228" cy="146" rx="4" ry="5" fill="#fff"/>
    <!-- 后腿(带色块) -->
    <ellipse cx="206" cy="145" rx="4" ry="5" fill="#e89044"/>
    <ellipse cx="214" cy="147" rx="4" ry="5" fill="#42312a"/>
  </g>
  <!-- 动画整体移动 -->
  <animateTransform xlink:href="#calico_cat" attributeName="transform" attributeType="XML"
    type="translate" from="0 0" to="-140 0" dur="3s" repeatCount="indefinite" />
  <!-- 滑板一起联动 -->
  <animateTransform xlink:href="#skateboard" attributeName="transform" attributeType="XML"
    type="translate" from="0 0" to="-140 0" dur="3s" repeatCount="indefinite"/>
</svg>