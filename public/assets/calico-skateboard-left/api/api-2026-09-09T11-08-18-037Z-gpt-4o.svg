<svg xmlns="http://www.w3.org/2000/svg" width="500" height="200" viewBox="0 0 500 200">
  <style>
    .cat {
      animation: move-cat 3s linear infinite;
    }

    @keyframes move-cat {
      from {
        transform: translateX(500px);
      }
      to {
        transform: translateX(-100px);
      }
    }
  </style>
  
  <!-- 滑板 -->
  <g>
    <rect x="0" y="150" width="120" height="10" fill="#964B00" />
    <circle cx="20" cy="165" r="10" fill="#555" />
    <circle cx="100" cy="165" r="10" fill="#555" />
  </g>

  <!-- 三花猫 -->
  <g class="cat" transform="translate(250, 100)">
    <!-- 头 -->
    <circle cx="20" cy="20" r="20" fill="#FFD700" />
    <!-- 耳朵 -->
    <polygon points="5,5 15,-10 25,5" fill="#FFD700" />
    <polygon points="25,5 35,-10 45,5" fill="#FFD700" />
    <!-- 脸上的斑点 -->
    <circle cx="10" cy="15" r="5" fill="#FF5733" />
    <circle cx="30" cy="15" r="5" fill="#FF5733" />
    <!-- 眼睛 -->
    <circle cx="10" cy="20" r="3" fill="#000" />
    <circle cx="30" cy="20" r="3" fill="#000" />
    <!-- 嘴巴 -->
    <path d="M15,30 Q20,35 25,30" stroke="#000" stroke-width="2" fill="none" />
    <!-- 身体 -->
    <ellipse cx="20" cy="50" rx="20" ry="10" fill="#FFD700" />
    <!-- 尾巴 -->
    <path d="M40,50 q10,-20 20,0" stroke="#FFD700" stroke-width="8" fill="none" />
  </g>
</svg>