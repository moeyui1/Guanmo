<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <defs>
    <!-- 渐变背景 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f7fa"/>
      <stop offset="100%" stop-color="#b2ebf2"/>
    </linearGradient>
    <!-- 地面阴影 -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="300" fill="url(#bgGrad)"/>
  
  <!-- 地面 -->
  <rect x="0" y="250" width="800" height="50" fill="#8d6e63"/>
  <rect x="0" y="250" width="800" height="5" fill="#6d4c41"/>

  <!-- 整体滑行组：从右向左移动 -->
  <g filter="url(#shadow)">
    <animateTransform
      attributeName="transform"
      type="translate"
      from="900 0"
      to="-200 0"
      dur="4s"
      repeatCount="indefinite"/>
    
    <!-- 身体上下起伏 -->
    <g>
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0; 0 -5; 0 0"
        dur="0.5s"
        repeatCount="indefinite"
        additive="sum"/>

      <!-- 滑板 -->
      <g transform="translate(0, 220)">
        <!-- 滑板板面 -->
        <ellipse cx="50" cy="8" rx="55" ry="6" fill="#5d4037"/>
        <ellipse cx="50" cy="5" rx="52" ry="5" fill="#8d6e63"/>
        
        <!-- 前轮 -->
        <circle cx="20" cy="15" r="6" fill="#212121">
          <animateTransform
            attributeName="transform"
            type="rotate"
            from="0 20 15"
            to="360 20 15"
            dur="0.3s"
            repeatCount="indefinite"/>
        </circle>
        <circle cx="20" cy="15" r="2" fill="#757575"/>
        
        <!-- 后轮 -->
        <circle cx="80" cy="15" r="6" fill="#212121">
          <animateTransform
            attributeName="transform"
            type="rotate"
            from="0 80 15"
            to="360 80 15"
            dur="0.3s"
            repeatCount="indefinite"/>
        </circle>
        <circle cx="80" cy="15" r="2" fill="#757575"/>
      </g>

      <!-- 三花猫 -->
      <g transform="translate(10, 140)">
        <!-- 尾巴 -->
        <path d="M -5 50 Q -25 40 -20 20 Q -15 10 -5 15" 
              stroke="#ff8f00" stroke-width="8" fill="none" stroke-linecap="round">
          <animate
            attributeName="d"
            values="M -5 50 Q -25 40 -20 20 Q -15 10 -5 15;
                    M -5 50 Q -30 35 -25 15 Q -18 5 -5 12;
                    M -5 50 Q -25 40 -20 20 Q -15 10 -5 15"
            dur="0.8s"
            repeatCount="indefinite"/>
        </path>
        <path d="M -5 50 Q -25 40 -20 20 Q -15 10 -5 15" 
              stroke="#212121" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="4 6">
          <animate
            attributeName="d"
            values="M -5 50 Q -25 40 -20 20 Q -15 10 -5 15;
                    M -5 50 Q -30 35 -25 15 Q -18 5 -5 12;
                    M -5 50 Q -25 40 -20 20 Q -15 10 -5 15"
            dur="0.8s"
            repeatCount="indefinite"/>
        </path>

        <!-- 身体 -->
        <ellipse cx="50" cy="55" rx="35" ry="25" fill="#fff8e1"/>
        <!-- 身体花纹 橘色 -->
        <ellipse cx="35" cy="50" rx="12" ry="10" fill="#ff8f00"/>
        <ellipse cx="65" cy="60" rx="10" ry="8" fill="#ff8f00"/>
        <!-- 身体花纹 黑色 -->
        <ellipse cx="45" cy="65" rx="8" ry="6" fill="#212121"/>
        <ellipse cx="70" cy="48" rx="6" ry="5" fill="#212121"/>

        <!-- 后腿 -->
        <ellipse cx="75" cy="75" rx="8" ry="10" fill="#fff8e1"/>
        <ellipse cx="75" cy="78" rx="5" ry="6" fill="#ff8f00"/>
        
        <!-- 前腿 -->
        <ellipse cx="30" cy="75" rx="7" ry="10" fill="#fff8e1">
          <animateTransform
            attributeName="transform"
            type="rotate"
            values="-5 30 65; 5 30 65; -5 30 65"
            dur="0.5s"
            repeatCount="indefinite"/>
        </ellipse>

        <!-- 头部 -->
        <g transform="translate(20, 20)">
          <!-- 脸 -->
          <ellipse cx="25" cy="25" rx="25" ry="22" fill="#fff8e1"/>
          
          <!-- 左耳 -->
          <polygon points="8,8 15,-5 22,10" fill="#ff8f00"/>
          <polygon points="10,7 15,0 20,9" fill="#ffccbc"/>
          <!-- 右耳 -->
          <polygon points="42,10 35,-5 28,8" fill="#212121"/>
          <polygon points="40,9 35,0 30,8" fill="#ffccbc"/>
          
          <!-- 头顶黑斑 -->
          <ellipse cx="30" cy="12" rx="10" ry="8" fill="#212121"/>
          <!-- 左眼上方橘斑 -->
          <ellipse cx="15" cy="15" rx="7" ry="6" fill="#ff8f00"/>
          
          <!-- 眼睛 -->
          <ellipse cx="16" cy="25" rx="4" ry="5" fill="#fff"/>
          <ellipse cx="34" cy="25" rx="4" ry="5" fill="#fff"/>
          <circle cx="16" cy="26" r="3" fill="#212121"/>
          <circle cx="34" cy="26" r="3" fill="#212121"/>
          <circle cx="17" cy="25" r="1" fill="#fff"/>
          <circle cx="35" cy="25" r="1" fill="#fff"/>
          
          <!-- 鼻子 -->
          <ellipse cx="25" cy="32" rx="3" ry="2" fill="#ff8a80"/>
          
          <!-- 嘴 -->
          <path d="M 25 34 Q 22 38 20 37" stroke="#5d4037" stroke-width="1.5" fill="none"/>
          <path d="M 25 34 Q 28 38 30 37" stroke="#5d4037" stroke-width="1.5" fill="none"/>
          
          <!-- 胡须 -->
          <line x1="8" y1="30" x2="0" y2="28" stroke="#bdbdbd" stroke-width="1"/>
          <line x1="8" y1="33" x2="0" y2="34" stroke="#bdbdbd" stroke-width="1"/>
          <line x1="42" y1="30" x2="50" y2="28" stroke="#bdbdbd" stroke-width="1"/>
          <line x1="42" y1="33" x2="50" y2="34" stroke="#bdbdbd" stroke-width="1"/>
        </g>
      </g>
    </g>
  </g>
</svg>
