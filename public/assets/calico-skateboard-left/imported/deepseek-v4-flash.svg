<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#87CEEB" />
      <stop offset="60%" stop-color="#E0F7FA" />
      <stop offset="100%" stop-color="#FFF" />
    </linearGradient>
    
    <!-- 三花猫配色 -->
    <style>
      .white { fill: #FFFFFF; stroke: #333; stroke-width: 2; }
      .orange { fill: #FF9900; stroke: #333; stroke-width: 2; }
      .black { fill: #333333; stroke: #111; stroke-width: 2; }
      .skin { fill: #FFCC99; stroke: #333; stroke-width: 2; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="600" fill="url(#bgGrad)" />

  <!-- 远景速度线（慢速） -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="800,0" to="-200,0" dur="6s" repeatCount="indefinite" />
    <line x1="50" y1="480" x2="150" y2="480" stroke="#B0BEC5" stroke-width="2" stroke-linecap="round" />
    <line x1="850" y1="480" x2="950" y2="480" stroke="#B0BEC5" stroke-width="2" stroke-linecap="round" />
    <line x1="200" y1="460" x2="300" y2="460" stroke="#B0BEC5" stroke-width="2" stroke-linecap="round" />
    <line x1="1000" y1="460" x2="1100" y2="460" stroke="#B0BEC5" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- 中景速度线（中速） -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="800,0" to="-200,0" dur="3s" repeatCount="indefinite" />
    <line x1="100" y1="520" x2="280" y2="520" stroke="#90A4AE" stroke-width="4" stroke-linecap="round" />
    <line x1="900" y1="520" x2="1080" y2="520" stroke="#90A4AE" stroke-width="4" stroke-linecap="round" />
    <line x1="600" y1="540" x2="700" y2="540" stroke="#90A4AE" stroke-width="4" stroke-linecap="round" />
    <line x1="1400" y1="540" x2="1500" y2="540" stroke="#90A4AE" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- 近景速度线（快速） -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="800,0" to="-200,0" dur="1.5s" repeatCount="indefinite" />
    <line x1="50" y1="580" x2="300" y2="580" stroke="#546E7A" stroke-width="6" stroke-linecap="round" />
    <line x1="850" y1="580" x2="1100" y2="580" stroke="#546E7A" stroke-width="6" stroke-linecap="round" />
    <line x1="450" y1="570" x2="650" y2="570" stroke="#546E7A" stroke-width="6" stroke-linecap="round" />
    <line x1="1250" y1="570" x2="1450" y2="570" stroke="#546E7A" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- 主移动组（从右到左） -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="900, 400" to="-200, 400" dur="4s" repeatCount="indefinite" />
    
    <!-- 阴影（固定在X轴移动，不参与弹跳） -->
    <ellipse cx="0" cy="80" rx="80" ry="15" fill="rgba(0,0,0,0.25)" />

    <!-- 弹跳组（Y轴上下弹跳） -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-15; 0,0" keyTimes="0; 0.5; 1" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1" calcMode="spline" dur="0.6s" repeatCount="indefinite" />

      <!-- 滑板 -->
      <g>
        <!-- 板面 -->
        <rect x="-75" y="48" width="150" height="12" rx="6" fill="#D35400" stroke="#333" stroke-width="2" />
        <rect x="-65" y="46" width="130" height="14" rx="4" fill="#E67E22" stroke="#333" stroke-width="2" />
        <!-- 板底亮条 -->
        <rect x="-75" y="56" width="150" height="4" rx="2" fill="#F1C40F" opacity="0.8" />
        
        <!-- 后轮（带旋转动画） -->
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0 -35 60" to="360 -35 60" dur="0.4s" repeatCount="indefinite" />
          <circle cx="-35" cy="60" r="12" fill="#444" stroke="#111" stroke-width="2" />
          <circle cx="-35" cy="60" r="8" fill="#888" />
          <!-- 轮毂十字线 -->
          <line x1="-35" y1="48" x2="-35" y2="72" stroke="#222" stroke-width="4" />
          <line x1="-47" y1="60" x2="-23" y2="60" stroke="#222" stroke-width="4" />
        </g>

        <!-- 前轮（带旋转动画） -->
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0 35 60" to="360 35 60" dur="0.4s" repeatCount="indefinite" />
          <circle cx="35" cy="60" r="12" fill="#444" stroke="#111" stroke-width="2" />
          <circle cx="35" cy="60" r="8" fill="#888" />
          <line x1="35" y1="48" x2="35" y2="72" stroke="#222" stroke-width="4" />
          <line x1="23" y1="60" x2="47" y2="60" stroke="#222" stroke-width="4" />
        </g>
      </g>

      <!-- 三花猫 -->
      <g>
        <!-- 尾巴（三花色） -->
        <g>
          <!-- 尾巴底部轮廓 -->
          <path d="M 50 -10 Q 90 -40 110 0 Q 90 30 70 10" fill="none" stroke="#333" stroke-width="18" stroke-linecap="round" />
          <!-- 白色尾段 -->
          <path d="M 50 -10 Q 90 -40 110 0 Q 90 30 70 10" fill="none" stroke="#FFF" stroke-width="14" stroke-linecap="round" />
          <!-- 橙色尾段 -->
          <path d="M 70 -20 Q 90 -30 95 -10" fill="none" stroke="#FF9900" stroke-width="14" stroke-linecap="round" />
          <!-- 黑色尾段 -->
          <path d="M 95 5 Q 105 15 100 20" fill="none" stroke="#333" stroke-width="14" stroke-linecap="round" />
        </g>

        <!-- 远侧腿（被身体遮挡部分） -->
        <!-- 远侧后腿（白色） -->
        <path d="M 10 20 L 0 45" stroke="#FFF" stroke-width="16" stroke-linecap="round" />
        <path d="M 10 20 L 0 45" stroke="#333" stroke-width="16" stroke-linecap="round" fill="none" opacity="0.3" />
        <!-- 远侧前腿（橙色） -->
        <path d="M -60 15 L -75 45" stroke="#FF9900" stroke-width="16" stroke-linecap="round" />
        <path d="M -60 15 L -75 45" stroke="#333" stroke-width="16" stroke-linecap="round" fill="none" opacity="0.3" />

        <!-- 身体 -->
        <ellipse cx="0" cy="0" rx="65" ry="45" fill="#FFF" stroke="#333" stroke-width="3" />
        
        <!-- 身体橙色斑块 -->
        <path d="M -20 -40 Q 10 -50 40 -20 Q 20 0 -20 -40" fill="#FF9900" stroke="#333" stroke-width="2" />
        <!-- 身体黑色斑块 -->
        <path d="M 30 -10 Q 60 0 50 30 Q 20 20 30 -10" fill="#333" stroke="#111" stroke-width="2" />

        <!-- 近侧腿（清晰可见） -->
        <!-- 近侧后腿（橙色） -->
        <path d="M 30 20 L 15 45" stroke="#FF9900" stroke-width="16" stroke-linecap="round" />
        <path d="M 30 20 L 15 45" stroke="#333" stroke-width="16" stroke-linecap="round" fill="none" />
        <!-- 近侧前腿（黑色） -->
        <path d="M -40 15 L -55 45" stroke="#333" stroke-width="16" stroke-linecap="round" />

        <!-- 头部 -->
        <circle cx="-60" cy="-20" r="35" fill="#FFF" stroke="#333" stroke-width="3" />

        <!-- 耳朵 -->
        <!-- 左耳（橙色） -->
        <polygon points="-85,-40 -80,-75 -60,-50" fill="#FF9900" stroke="#333" stroke-width="3" stroke-linejoin="round" />
        <!-- 右耳（黑色） -->
        <polygon points="-50,-50 -35,-75 -30,-40" fill="#333" stroke="#111" stroke-width="3" stroke-linejoin="round" />

        <!-- 头部斑块 -->
        <!-- 头顶橙色斑 -->
        <path d="M -80 -45 Q -60 -55 -40 -45 Q -50 -30 -80 -45" fill="#FF9900" stroke="#333" stroke-width="2" />
        <!-- 眼下黑色斑 -->
        <path d="M -85 -10 Q -75 -5 -65 -10 Q -75 -20 -85 -10" fill="#333" stroke="#111" stroke-width="2" />

        <!-- 眼睛 -->
        <circle cx="-75" cy="-25" r="7" fill="#FFF" stroke="#333" stroke-width="2" />
        <circle cx="-75" cy="-25" r="3" fill="#000" />
        <circle cx="-76" cy="-26" r="1" fill="#FFF" />

        <circle cx="-45" cy="-25" r="7" fill="#FFF" stroke="#333" stroke-width="2" />
        <circle cx="-45" cy="-25" r="3" fill="#000" />
        <circle cx="-46" cy="-26" r="1" fill="#FFF" />

        <!-- 嘴巴（微笑） -->
        <path d="M -65 -15 Q -60 -10 -55 -15" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round" />
        <!-- 鼻子 -->
        <polygon points="-62,-20 -58,-20 -60,-18" fill="#FF9999" stroke="#333" stroke-width="1" />

        <!-- 胡须 -->
        <g opacity="0.7">
          <line x1="-95" y1="-15" x2="-115" y2="-25" stroke="#333" stroke-width="2" stroke-linecap="round" />
          <line x1="-95" y1="-10" x2="-115" y2="-10" stroke="#333" stroke-width="2" stroke-linecap="round" />
          <line x1="-95" y1="-5" x2="-115" y2="5" stroke="#333" stroke-width="2" stroke-linecap="round" />
        </g>

        <!-- 红色围巾（增加飘逸速度感） -->
        <g>
          <!-- 围巾主体 -->
          <path d="M -50 -5 Q -30 -15 -10 -5 Q -30 5 -50 -5" fill="#E74C3C" stroke="#333" stroke-width="2" />
          <!-- 飘动的围巾尾巴 -->
          <path d="M -50 -5 Q -60 15 -40 25 Q -30 5 -40 -5" fill="#E74C3C" stroke="#333" stroke-width="2" />
          <path d="M -40 -5 Q -50 10 -30 20" fill="#E74C3C" stroke="#333" stroke-width="2" />
        </g>
      </g>
    </g>
  </g>
</svg>