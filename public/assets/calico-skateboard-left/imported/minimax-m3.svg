<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <title>三花猫滑滑板</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE5B4"/>
      <stop offset="50%" stop-color="#FFD4A3"/>
      <stop offset="100%" stop-color="#FFB6C1"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8853A"/>
      <stop offset="100%" stop-color="#6B3410"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#FFFAE0" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#FFD700" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 天空 -->
  <rect width="800" height="400" fill="url(#sky)"/>

  <!-- 太阳 -->
  <circle cx="680" cy="90" r="55" fill="url(#sun)"/>
  <circle cx="680" cy="90" r="28" fill="#FFFAE0"/>

  <!-- 云 -->
  <g opacity="0.75">
    <ellipse cx="150" cy="100" rx="35" ry="12" fill="#FFFFFF"/>
    <ellipse cx="175" cy="92" rx="25" ry="10" fill="#FFFFFF"/>
    <ellipse cx="125" cy="92" rx="20" ry="8" fill="#FFFFFF"/>
  </g>
  <g opacity="0.6">
    <ellipse cx="450" cy="60" rx="30" ry="10" fill="#FFFFFF"/>
    <ellipse cx="470" cy="55" rx="22" ry="8" fill="#FFFFFF"/>
  </g>

  <!-- 远山 -->
  <path d="M 0 295 Q 150 270 300 285 T 600 280 T 800 270 L 800 310 L 0 310 Z" fill="#7FBF7F" opacity="0.4"/>

  <!-- 地面 -->
  <rect y="300" width="800" height="100" fill="#9B7B4F"/>
  <line x1="0" y1="300" x2="800" y2="300" stroke="#6B5340" stroke-width="2"/>

  <!-- 滚动的地面纹理 -->
  <g>
    <line x1="20" y1="320" x2="60" y2="320" stroke="#6B5340" stroke-width="1.5"/>
    <line x1="120" y1="335" x2="170" y2="335" stroke="#6B5340" stroke-width="1.5"/>
    <line x1="240" y1="325" x2="290" y2="325" stroke="#6B5340" stroke-width="1.5"/>
    <line x1="360" y1="345" x2="420" y2="345" stroke="#6B5340" stroke-width="1.5"/>
    <line x1="500" y1="325" x2="560" y2="325" stroke="#6B5340" stroke-width="1.5"/>
    <line x1="640" y1="340" x2="710" y2="340" stroke="#6B5340" stroke-width="1.5"/>
    <line x1="760" y1="330" x2="800" y2="330" stroke="#6B5340" stroke-width="1.5"/>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-400 0" dur="1.5s" repeatCount="indefinite"/>
  </g>
  <g>
    <line x1="60" y1="370" x2="100" y2="370" stroke="#5D4530" stroke-width="1"/>
    <line x1="200" y1="380" x2="250" y2="380" stroke="#5D4530" stroke-width="1"/>
    <line x1="380" y1="365" x2="430" y2="365" stroke="#5D4530" stroke-width="1"/>
    <line x1="540" y1="385" x2="600" y2="385" stroke="#5D4530" stroke-width="1"/>
    <line x1="700" y1="375" x2="750" y2="375" stroke="#5D4530" stroke-width="1"/>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-400 0" dur="1.5s" repeatCount="indefinite"/>
  </g>

  <!-- 三花猫+滑板:从右向左滑行 -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="900 0" to="-700 0" dur="6s" repeatCount="indefinite" additive="sum"/>

    <g transform="translate(400 287)">
      <!-- 轻微颠簸 -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -1.5; 0 0; 0 -1.5; 0 0" dur="0.4s" repeatCount="indefinite"/>

        <!-- 影子 -->
        <ellipse cx="0" cy="14" rx="88" ry="3" fill="#000" opacity="0.25"/>

        <!-- 滑板板面 -->
        <path d="M -85 -5 Q -90 -10 -82 -13 L 82 -13 Q 90 -10 85 -5 L 82 4 L -82 4 Z" fill="url(#deck)" stroke="#3E2723" stroke-width="1.5"/>
        <line x1="-75" y1="-10" x2="75" y2="-10" stroke="#3E2723" stroke-width="0.5" stroke-dasharray="3,2" opacity="0.6"/>

        <!-- 支架 -->
        <rect x="-60" y="2" width="8" height="6" fill="#888" rx="1"/>
        <rect x="52" y="2" width="8" height="6" fill="#888" rx="1"/>

        <!-- 轮子(旋转) -->
        <g>
          <circle cx="-56" cy="13" r="8" fill="#F5F5F5" stroke="#333" stroke-width="0.5"/>
          <circle cx="-56" cy="13" r="3" fill="#333"/>
          <rect x="-57" y="6" width="2" height="3" fill="#FF8C00"/>
          <rect x="-57" y="17" width="2" height="3" fill="#FF8C00"/>
          <animateTransform attributeName="transform" type="rotate" from="0 -56 13" to="360 -56 13" dur="0.4s" repeatCount="indefinite"/>
        </g>
        <g>
          <circle cx="56" cy="13" r="8" fill="#F5F5F5" stroke="#333" stroke-width="0.5"/>
          <circle cx="56" cy="13" r="3" fill="#333"/>
          <rect x="55" y="6" width="2" height="3" fill="#FF8C00"/>
          <rect x="55" y="17" width="2" height="3" fill="#FF8C00"/>
          <animateTransform attributeName="transform" type="rotate" from="0 56 13" to="360 56 13" dur="0.4s" repeatCount="indefinite"/>
        </g>

        <!-- 三花猫(朝左) -->
        <g transform="translate(0 -45)">
          <!-- 尾巴(摆动) -->
          <g>
            <path d="M 28 22 Q 52 5 58 -22 Q 60 -48 40 -55" fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round"/>
            <path d="M 28 22 Q 52 5 58 -22 Q 60 -48 40 -55" fill="none" stroke="#FF8C00" stroke-width="8" stroke-linecap="round" stroke-dasharray="25,10,10,10"/>
            <path d="M 28 22 Q 52 5 58 -22 Q 60 -48 40 -55" fill="none" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round" stroke-dasharray="3,28,3,18"/>
            <animateTransform attributeName="transform" type="rotate" values="0 28 22; -8 28 22; 0 28 22; 6 28 22; 0 28 22" dur="1.2s" repeatCount="indefinite"/>
          </g>

          <!-- 后腿 -->
          <ellipse cx="20" cy="28" rx="9" ry="5" fill="#FFFFFF" stroke="#333" stroke-width="0.8"/>
          <ellipse cx="22" cy="29" rx="5" ry="3" fill="#1a1a1a"/>

          <!-- 身体(白底) -->
          <ellipse cx="0" cy="15" rx="33" ry="18" fill="#FFFFFF" stroke="#333" stroke-width="1.2"/>

          <!-- 橙色斑块 -->
          <path d="M -8 -2 Q 12 -4 25 5 Q 28 15 18 18 Q 5 20 -6 12 Q -12 4 -8 -2 Z" fill="#FF8C00" stroke="#333" stroke-width="0.4"/>

          <!-- 黑色斑块 -->
          <path d="M 12 5 Q 28 8 28 22 Q 22 28 12 26 Q 4 22 6 14 Z" fill="#1a1a1a"/>

          <!-- 前爪 -->
          <ellipse cx="-15" cy="32" rx="6" ry="4" fill="#FFFFFF" stroke="#333" stroke-width="0.8"/>
          <ellipse cx="-2" cy="32" rx="6" ry="4" fill="#FFFFFF" stroke="#333" stroke-width="0.8"/>
          <ellipse cx="-15" cy="32" rx="3" ry="2" fill="#1a1a1a"/>

          <!-- 头 -->
          <ellipse cx="-30" cy="-5" rx="20" ry="18" fill="#FFFFFF" stroke="#333" stroke-width="1.2"/>

          <!-- 头顶橙色 -->
          <path d="M -45 -14 Q -32 -22 -18 -18 Q -10 -10 -18 -3 Q -30 -2 -42 -7 Z" fill="#FF8C00" stroke="#333" stroke-width="0.4"/>

          <!-- 耳朵(橘色+黑色) -->
          <path d="M -42 -19 L -38 -33 L -32 -21 Z" fill="#FF8C00" stroke="#333" stroke-width="0.8"/>
          <path d="M -39 -22 L -37 -28 L -35 -22 Z" fill="#FFB6C1"/>
          <path d="M -22 -19 L -19 -32 L -12 -21 Z" fill="#1a1a1a" stroke="#333" stroke-width="0.8"/>
          <path d="M -19 -22 L -17 -28 L -15 -22 Z" fill="#FFB6C1"/>

          <!-- 眼睛 -->
          <ellipse cx="-40" cy="-4" rx="2.5" ry="3.5" fill="#2d5016"/>
          <ellipse cx="-28" cy="-4" rx="2.5" ry="3.5" fill="#2d5016"/>
          <circle cx="-40" cy="-5" r="0.8" fill="#fff"/>
          <circle cx="-28" cy="-5" r="0.8" fill="#fff"/>
          <ellipse cx="-40" cy="-2" rx="2.2" ry="0.6" fill="#000"/>
          <ellipse cx="-28" cy="-2" rx="2.2" ry="0.6" fill="#000"/>

          <!-- 鼻子 -->
          <path d="M -37 1 L -33 1 L -35 4 Z" fill="#FFB6C1" stroke="#333" stroke-width="0.3"/>

          <!-- 嘴 -->
          <path d="M -35 5 Q -37 8 -40 7" fill="none" stroke="#333" stroke-width="0.8" stroke-linecap="round"/>
          <path d="M -35 5 Q -33 8 -30 7" fill="none" stroke="#333" stroke-width="0.8" stroke-linecap="round"/>

          <!-- 胡须 -->
          <line x1="-48" y1="1" x2="-62" y2="-1" stroke="#333" stroke-width="0.6" stroke-linecap="round"/>
          <line x1="-48" y1="3" x2="-62" y2="4" stroke="#333" stroke-width="0.6" stroke-linecap="round"/>
          <line x1="-22" y1="1" x2="-10" y2="-1" stroke="#333" stroke-width="0.6" stroke-linecap="round"/>
          <line x1="-22" y1="3" x2="-10" y2="4" stroke="#333" stroke-width="0.6" stroke-linecap="round"/>

          <!-- 腮红 -->
          <ellipse cx="-43" cy="4" rx="2.5" ry="1.5" fill="#FF6B9D" opacity="0.5"/>
        </g>

        <!-- 速度线 -->
        <g stroke="#FFFFFF" stroke-linecap="round">
          <line x1="65" y1="-30" x2="105" y2="-30" stroke-width="2.5">
            <animate attributeName="x1" values="65;40;65" dur="0.3s" repeatCount="indefinite"/>
            <animate attributeName="x2" values="105;80;105" dur="0.3s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0.8;0;0.8" dur="0.3s" repeatCount="indefinite"/>
          </line>
          <line x1="70" y1="-15" x2="100" y2="-15" stroke-width="2">
            <animate attributeName="x1" values="70;50;70" dur="0.25s" repeatCount="indefinite"/>
            <animate attributeName="x2" values="100;80;100" dur="0.25s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0.7;0;0.7" dur="0.25s" repeatCount="indefinite"/>
          </line>
          <line x1="60" y1="0" x2="90" y2="0" stroke-width="2">
            <animate attributeName="x1" values="60;40;60" dur="0.35s" repeatCount="indefinite"/>
            <animate attributeName="x2" values="90;70;90" dur="0.35s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0.7;0;0.7" dur="0.35s" repeatCount="indefinite"/>
          </line>
        </g>
      </g>
    </g>
  </g>
</svg>
