<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="40 40 880 210" width="880" height="210" role="img"
     aria-label="Animated calico cat riding a skateboard, travelling from right to left">
  <title>三花猫滑滑板 · 从右向左前进</title>
  <desc>Hand-drawn SVG animation: a calico (white/orange/black) cat rides a skateboard and moves right to left. Speed lines sweep leftward, the deck bounces, the wheels spin, the tail wags, the head nods and the front paw reaches.</desc>

  <defs>
    <linearGradient id="furWarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#efe2d2"/>
    </linearGradient>
    <linearGradient id="deckGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0a35e"/>
      <stop offset="1" stop-color="#b4581f"/>
    </linearGradient>
    <linearGradient id="boardShadow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d2733" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#0d2733" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#0d2733" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="groundGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <style>
      .out  { fill: none; stroke: #33241a; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; }
      .thin { fill: none; stroke: #33241a; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .claw { fill: none; stroke: #c9b3a2; stroke-width: 2; stroke-linecap: round; }
      .patchOrange { fill: #f0913c; }
      .patchBlack  { fill: #35343f; }
      .eyeWhite { fill: #ffffff; }
      .iris    { fill: #2fa07a; }
      .pupil   { fill: #16233a; }
      .muzzle  { fill: #ffffff; }
      .nose    { fill: #ec8f9e; }
      .wheel   { fill: #2f3646; }
      .hub     { fill: #f4d9a8; }
      .wheelDot{ fill: #8d99b4; }
      .deck    { fill: url(#deckGrad); }
      .stripe  { fill: none; stroke: #f0913c; stroke-width: 4.5; stroke-linecap: round; }
    </style>

    <!-- ground shadow: squashes as the deck bounces -->
    <ellipse id="shadowBase" cx="300" cy="207" rx="118" ry="7" fill="url(#boardShadow)">
      <animate attributeName="rx" values="118;100;118" dur="0.8s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="7;5.2;7" dur="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.55;0.9" dur="0.8s" repeatCount="indefinite"/>
    </ellipse>

    <!-- one skateboard wheel: spins on its own axle -->
    <g id="wheelUnit">
      <circle class="wheel" cx="0" cy="0" r="15" stroke="#1c2231" stroke-width="2.5"/>
      <circle r="14" fill="none" stroke="#4c5674" stroke-width="1.6"/>
      <circle class="wheelDot" cx="8.5" cy="0" r="3.1"/>
      <circle class="wheelDot" cx="-4.2" cy="7.4" r="2.6"/>
      <circle class="wheelDot" cx="-4.2" cy="-7.4" r="2.6"/>
      <circle class="hub" cx="0" cy="0" r="4"/>
      <animateTransform attributeName="transform" type="rotate"
                        from="0 0 0" to="-360 0 0" dur="0.55s" repeatCount="indefinite"/>
    </g>

    <g id="speedLine" stroke="#2f7f9e" stroke-width="5" stroke-linecap="round">
      <line x1="0" y1="-5" x2="118" y2="-5" stroke-opacity="0.6"/>
      <line x1="22" y1="4"   x2="150" y2="4"  stroke-opacity="0.34"/>
    </g>
  </defs>

  <!-- ==== background ==== -->
  <rect x="40" y="40" width="880" height="210" fill="#eaf7fb"/>
  <ellipse cx="480" cy="150" rx="420" ry="120" fill="url(#groundGlow)"/>
  <line x1="60" y1="206" x2="900" y2="206" stroke="#b9d7e2" stroke-width="3" stroke-linecap="round"/>
  <g stroke="#cfd3ce" stroke-width="4" stroke-linecap="round">
    <line x1="96"  y1="206" x2="88"  y2="198"/>
    <line x1="150" y1="206" x2="144" y2="197"/>
    <line x1="470" y1="206" x2="462" y2="198"/>
    <line x1="700" y1="206" x2="694" y2="197"/>
    <line x1="846" y1="206" x2="838" y2="198"/>
  </g>

  <!-- ==== motion: speed lines fly right -> left ==== -->
  <g>
    <use xlink:href="#speedLine" href="#speedLine" x="0" y="0">
      <animateTransform attributeName="transform" type="translate" values="1050 138; 20 138" dur="0.7s" repeatCount="indefinite"/>
    </use>
    <use xlink:href="#speedLine" href="#speedLine" x="0" y="0">
      <animateTransform attributeName="transform" type="translate" values="1080 168; 30 168" dur="0.9s" begin="-0.25s" repeatCount="indefinite"/>
    </use>
    <use xlink:href="#speedLine" href="#speedLine" x="0" y="0">
      <animateTransform attributeName="transform" type="translate" values="1020 96; 60 96" dur="0.62s" begin="-0.4s" repeatCount="indefinite"/>
    </use>
    <use xlink:href="#speedLine" href="#speedLine" x="0" y="0">
      <animateTransform attributeName="transform" type="translate" values="1010 122; 240 122" dur="0.5s" begin="-0.18s" repeatCount="indefinite"/>
    </use>
    <use xlink:href="#speedLine" href="#speedLine" x="0" y="0">
      <animateTransform attributeName="transform" type="translate" values="1060 186; -10 186" dur="0.78s" begin="-0.55s" repeatCount="indefinite"/>
    </use>
  </g>

  <use xlink:href="#shadowBase" href="#shadowBase"/>

  <!-- ==== rider + board: one bouncing platform ==== -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -4; 0 0" dur="0.8s" repeatCount="indefinite"/>

    <!-- = skateboard = -->
    <g>
      <!-- deck with kicked nose (left) and tail (right) -->
      <path d="M 206 178 C 198 178 190 173 184 162 C 181 157 175 157 174 163 C 172 174 180 188 196 189
               L 404 189 C 420 188 428 174 426 163 C 425 157 419 157 416 162 C 410 173 402 178 394 178 Z"
            fill="url(#deckGrad)" stroke="#7d3a12" stroke-width="3" stroke-linejoin="round"/>
      <path d="M 214 183 L 386 183" stroke="#f8d6ac" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
      <!-- grip tape dots -->
      <g fill="#7d3a12" opacity="0.45">
        <circle cx="238" cy="186" r="1.7"/>
        <circle cx="268" cy="186" r="1.7"/>
        <circle cx="298" cy="186" r="1.7"/>
        <circle cx="328" cy="186" r="1.7"/>
        <circle cx="358" cy="186" r="1.7"/>
      </g>
      <!-- trucks -->
      <g stroke="#8f9bb5" stroke-width="4" stroke-linecap="round">
        <line x1="245" y1="190" x2="245" y2="196"/>
        <line x1="355" y1="190" x2="355" y2="196"/>
      </g>
      <rect x="228" y="194" width="34" height="6" rx="3" fill="#6d7893"/>
      <rect x="338" y="194" width="34" height="6" rx="3" fill="#6d7893"/>
      <!-- wheels: spin, and counter-bounce so they stay on the ground -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 4; 0 0" dur="0.8s" repeatCount="indefinite"/>
        <use xlink:href="#wheelUnit" href="#wheelUnit" transform="translate(245 192)"/>
        <use xlink:href="#wheelUnit" href="#wheelUnit" transform="translate(355 192)"/>
      </g>
    </g>

    <!-- = cat = -->
    <g>
      <!-- tail sweeping up and back, wagging -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 303 169; -9 303 169; 0 303 169" dur="1.1s" repeatCount="indefinite"/>
        <path d="M 303 169 C 344 165 390 160 424 138 C 442 125 442 101 425 89
                 C 410 78 389 84 381 99 C 376 108 383 116 391 114
                 C 398 112 396 103 391 105 C 403 94 418 99 420 112
                 C 423 132 404 143 380 150 C 350 158 322 163 303 165 Z"
              fill="url(#furWarm)" stroke="#33241a" stroke-width="3.4" stroke-linejoin="round"/>
        <path d="M 425 89 C 431 96 432 106 427 116 C 420 125 407 119 406 106
                 C 405 96 412 88 425 89 Z" class="patchBlack"/>
        <path d="M 318 161 C 323 157 329 157 333 161 C 329 165 323 165 318 161 Z" class="patchBlack"/>
        <path d="M 350 164 C 372 159 396 152 414 141" fill="none" stroke="#f0913c" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
      </g>

      <!-- back leg tucked on the deck, with a small kick -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 349 167; -4 349 167; 0 349 167" dur="0.8s" repeatCount="indefinite"/>
        <path d="M 337 156 C 337 170 341 179 351 180 C 361 180 365 170 363 157 Z"
              fill="url(#furWarm)" stroke="#33241a" stroke-width="3.4" stroke-linejoin="round"/>
        <path d="M 340 157 C 340 167 343 174 348 175 L 348 159 Z" class="patchOrange" opacity="0.9"/>
        <path d="M 341 180 L 341 182 M 348 180 L 348 182 M 355 180 L 355 182" class="claw"/>
      </g>

      <!-- body -->
      <path d="M 216 172 C 214 150 228 130 252 124 C 274 118 308 116 330 122
               C 350 127 361 142 362 156 C 363 168 355 176 340 177
               L 236 177 C 224 177 216 176 216 172 Z"
            fill="url(#furWarm)" stroke="#33241a" stroke-width="3.4" stroke-linejoin="round"/>
      <!-- calico patches: orange on the shoulder, black on the flank -->
      <path d="M 228 150 C 226 134 240 127 256 125 C 266 124 272 129 270 137 C 267 148 254 155 242 157 C 232 158 228 156 228 150 Z" class="patchOrange"/>
      <path d="M 336 134 C 354 132 366 144 368 158 C 369 168 361 176 350 177 L 332 177
               C 341 168 344 152 336 134 Z" class="patchBlack"/>
      <path d="M 282 128 C 290 124 300 123 306 128 C 302 132 288 133 282 128 Z" class="patchOrange" opacity="0.9"/>
      <!-- back stripes (tabby ticking) -->
      <g class="stripe">
        <path d="M 240 132 C 236 140 234 147 234 153"/>
        <path d="M 256 123 C 253 131 251 139 251 146"/>
      </g>
      <path d="M 276 146 C 291 143 306 143 320 147" stroke="#e8dccd" stroke-width="4" fill="none" stroke-linecap="round"/>

      <!-- front leg reaching forward -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 364 152; -7 364 152; 0 364 152" dur="0.8s" repeatCount="indefinite"/>
        <path d="M 358 136 C 374 138 390 150 397 163 C 401 170 396 178 388 177
                 C 376 176 360 168 353 156 C 349 148 351 137 358 136 Z"
              fill="url(#furWarm)" stroke="#33241a" stroke-width="3.4" stroke-linejoin="round"/>
        <path d="M 363 141 C 373 144 381 151 386 159 C 381 152 372 146 364 144 Z" class="patchBlack" opacity="0.9"/>
        <path d="M 386 178 L 386 180 M 393 176 L 394 178" class="claw"/>
      </g>

      <!-- head -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-2 292 96; 3 292 96; -2 292 96" dur="0.8s" repeatCount="indefinite"/>
        <!-- ears -->
        <path d="M 264 62 L 258 26 L 294 48 Z" fill="url(#furWarm)" stroke="#33241a" stroke-width="3.4" stroke-linejoin="round"/>
        <path d="M 268 57 L 264 36 L 285 49 Z" fill="#f2a3ae" opacity="0.9"/>
        <path d="M 316 50 L 340 20 L 348 58 Z" fill="url(#furWarm)" stroke="#33241a" stroke-width="3.4" stroke-linejoin="round"/>
        <path d="M 322 51 L 336 32 L 341 55 Z" fill="#f2a3ae" opacity="0.9"/>
        <!-- head shape -->
        <ellipse cx="288" cy="91" rx="56" ry="45" fill="url(#furWarm)" stroke="#33241a" stroke-width="3.4"/>
        <path d="M 316 82 C 324 74 336 74 344 80 C 352 86 352 98 344 102 C 336 106 326 102 320 96 Z" class="patchBlack" opacity="0.92"/>
        <path d="M 258 66 C 250 76 248 88 252 96 C 258 88 262 76 264 68 Z" class="patchOrange" opacity="0.92"/>
        <!-- calico forehead blaze -->
        <path d="M 282 46 C 288 60 290 76 286 88 C 280 74 278 58 282 46 Z" class="patchOrange"/>
        <!-- cheeks + muzzle -->
        <ellipse cx="272" cy="107" rx="25" ry="18" fill="#ffffff"/>
        <ellipse cx="311" cy="106" rx="23" ry="17" fill="#ffffff"/>
        <!-- eyes -->
        <ellipse class="eyeWhite" cx="267" cy="86" rx="13" ry="12.5"/>
        <ellipse class="iris" cx="266" cy="87" rx="8.4" ry="9"/>
        <ellipse class="pupil" cx="265" cy="87" rx="3.4" ry="7"/>
        <circle cx="263" cy="82" r="2.6" fill="#ffffff" opacity="0.95"/>
        <ellipse class="eyeWhite" cx="310" cy="85" rx="12" ry="12"/>
        <ellipse class="iris" cx="309" cy="86" rx="7.8" ry="8.6"/>
        <ellipse class="pupil" cx="308" cy="86" rx="3.2" ry="6.6"/>
        <circle cx="306" cy="81" r="2.4" fill="#ffffff" opacity="0.95"/>
        <!-- blinks -->
        <g opacity="0">
          <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.9;0.93;0.96;0.99;1" dur="4.2s" repeatCount="indefinite"/>
          <path d="M 255 87 C 261 92 273 92 279 87" class="thin"/>
          <path d="M 299 86 C 305 91 316 91 321 86" class="thin"/>
        </g>
        <!-- nose, mouth, whiskers -->
        <path d="M 286 99 C 283 95 291 94 293 97 C 295 94 303 95 300 99 C 298 103 289 104 286 99 Z" class="nose"/>
        <path d="M 293 103 C 293 107 289 109 285 110" class="thin"/>
        <path d="M 293 103 C 293 107 297 109 301 110" class="thin"/>
        <g class="thin" opacity="0.75">
          <line x1="252" y1="102" x2="218" y2="96"/>
          <line x1="252" y1="109" x2="219" y2="111"/>
          <line x1="326" y1="100" x2="358" y2="92"/>
          <line x1="326" y1="107" x2="359" y2="110"/>
        </g>
      </g>
    </g>
  </g>

  <!-- ==== motion: dust kicked back by the wheels ==== -->
  <g fill="#9fc7d6" opacity="0.75">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 130 -6" dur="0.62s" repeatCount="indefinite"/>
      <circle cx="238" cy="199" r="5">
        <animate attributeName="r" values="3;9" dur="0.62s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.85;0" dur="0.62s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 160 -12" dur="0.78s" begin="-0.3s" repeatCount="indefinite"/>
      <circle cx="348" cy="198" r="5">
        <animate attributeName="r" values="3;10" dur="0.78s" begin="-0.3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0" dur="0.78s" begin="-0.3s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 110 -16" dur="0.54s" begin="-0.15s" repeatCount="indefinite"/>
      <circle cx="246" cy="194" r="4">
        <animate attributeName="r" values="2;7" dur="0.54s" begin="-0.15s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0" dur="0.54s" begin="-0.15s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- arrow: direction of travel -->
  <g opacity="0.5" stroke="#2f7f9e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="150" y1="66" x2="102" y2="66"/>
    <path d="M 116 55 L 102 66 L 116 77"/>
  </g>
</svg>
