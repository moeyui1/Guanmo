<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <title>三花猫滑板动图</title>
  <desc>A calico cat skateboarding from right to left</desc>

  <defs>
    <!-- 天空渐变 -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cdefff"/>
      <stop offset="0.6" stop-color="#e3f6ff"/>
      <stop offset="1" stop-color="#f4fbff"/>
    </linearGradient>
    <!-- 身体剪裁，用于三花斑块 -->
    <clipPath id="bodyClip">
      <ellipse cx="8" cy="205" rx="50" ry="37"/>
    </clipPath>
    <!-- 头部剪裁 -->
    <clipPath id="headClip">
      <circle cx="-30" cy="155" r="30"/>
    </clipPath>
  </defs>

  <!-- ===================== 背景 ===================== -->
  <rect x="0" y="0" width="800" height="320" fill="url(#sky)"/>

  <!-- 太阳与光芒 -->
  <g>
    <circle cx="690" cy="80" r="42" fill="#ffd23f"/>
    <g stroke="#ffd23f" stroke-width="6" stroke-linecap="round">
      <line x1="690" y1="22" x2="690" y2="10"/>
      <line x1="690" y1="138" x2="690" y2="150"/>
      <line x1="632" y1="80" x2="620" y2="80"/>
      <line x1="748" y1="80" x2="760" y2="80"/>
      <line x1="649" y1="39" x2="640" y2="30"/>
      <line x1="731" y1="121" x2="740" y2="130"/>
      <line x1="731" y1="39" x2="740" y2="30"/>
      <line x1="649" y1="121" x2="640" y2="130"/>
    </g>
  </g>

  <!-- 云朵（向左飘动，视差） -->
  <g opacity="0.9">
    <animateTransform attributeName="transform" type="translate" from="900 0" to="-220 0" dur="70s" repeatCount="indefinite"/>
    <g fill="#ffffff">
      <circle cx="180" cy="90" r="26"/>
      <circle cx="212" cy="74" r="32"/>
      <circle cx="244" cy="92" r="24"/>
      <circle cx="212" cy="98" r="26"/>
    </g>
  </g>
  <g opacity="0.8">
    <animateTransform attributeName="transform" type="translate" from="1000 0" to="-220 0" dur="95s" repeatCount="indefinite"/>
    <g fill="#ffffff">
      <circle cx="520" cy="140" r="18"/>
      <circle cx="546" cy="128" r="24"/>
      <circle cx="570" cy="142" r="16"/>
    </g>
    <g fill="#ffffff">
      <circle cx="120" cy="180" r="14"/>
      <circle cx="142" cy="170" r="18"/>
      <circle cx="162" cy="181" r="12"/>
    </g>
  </g>

  <!-- 地面 -->
  <rect x="0" y="320" width="800" height="80" fill="#8fd460"/>
  <rect x="0" y="320" width="800" height="6" fill="#6fb843"/>

  <!-- 几朵小花点缀 -->
  <g>
    <circle cx="140" cy="352" r="5" fill="#fff"/>
    <circle cx="140" cy="352" r="2.4" fill="#ffd23f"/>
    <circle cx="560" cy="366" r="5" fill="#fff"/>
    <circle cx="560" cy="366" r="2.4" fill="#ff8fb0"/>
    <circle cx="330" cy="368" r="4" fill="#fff"/>
    <circle cx="330" cy="368" r="2" fill="#ffd23f"/>
  </g>

  <!-- ===================== 滑动主体 ===================== -->
  <g>
    <!-- 从右向左平移 -->
    <animateTransform attributeName="transform" type="translate" from="760 0" to="-200 0" dur="10s" repeatCount="indefinite"/>

    <!-- 轻微上下弹跳 -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0" dur="1.6s" repeatCount="indefinite"/>

      <!-- 轮子（在板子后面） -->
      <g>
        <!-- 后轮 -->
        <g transform="translate(45,305)">
          <g>
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.8s" repeatCount="indefinite"/>
            <circle r="15" fill="#2b2b2b" stroke="#141414" stroke-width="2"/>
            <line x1="-13" y1="0" x2="13" y2="0" stroke="#5a646c" stroke-width="2.5"/>
            <line x1="0" y1="-13" x2="0" y2="13" stroke="#5a646c" stroke-width="2.5"/>
            <line x1="-9" y1="-9" x2="9" y2="9" stroke="#5a646c" stroke-width="2.5"/>
            <line x1="-9" y1="9" x2="9" y2="-9" stroke="#5a646c" stroke-width="2.5"/>
            <circle r="6" fill="#cfd6dd" stroke="#8a939c" stroke-width="1.5"/>
            <circle r="2" fill="#5a646c"/>
          </g>
        </g>
        <!-- 前轮 -->
        <g transform="translate(-45,305)">
          <g>
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.8s" repeatCount="indefinite"/>
            <circle r="15" fill="#2b2b2b" stroke="#141414" stroke-width="2"/>
            <line x1="-13" y1="0" x2="13" y2="0" stroke="#5a646c" stroke-width="2.5"/>
            <line x1="0" y1="-13" x2="0" y2="13" stroke="#5a646c" stroke-width="2.5"/>
            <line x1="-9" y1="-9" x2="9" y2="9" stroke="#5a646c" stroke-width="2.5"/>
            <line x1="-9" y1="9" x2="9" y2="-9" stroke="#5a646c" stroke-width="2.5"/>
            <circle r="6" fill="#cfd6dd" stroke="#8a939c" stroke-width="1.5"/>
            <circle r="2" fill="#5a646c"/>
          </g>
        </g>
      </g>

      <!-- 滑板板面 -->
      <rect x="-85" y="286" width="170" height="13" rx="6" fill="#c98a4b" stroke="#8a5a2b" stroke-width="1.5"/>
      <rect x="-80" y="287" width="160" height="4" rx="2" fill="#6a4630"/>

      <!-- 尾巴（橙黄，会摆动） -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-6 54 210; 7 54 210; -6 54 210" dur="1.6s" repeatCount="indefinite"/>
        <path d="M 54 210 C 82 204 100 178 92 150" fill="none" stroke="#f5a623" stroke-width="15" stroke-linecap="round"/>
        <circle cx="92" cy="150" r="8" fill="#3b3b3b"/>
      </g>

      <!-- 腿 -->
      <g>
        <rect x="-34" y="240" width="11" height="46" rx="5" fill="#ffffff" stroke="#cfc0ad" stroke-width="1"/>
        <rect x="-20" y="240" width="11" height="46" rx="5" fill="#ffffff" stroke="#cfc0ad" stroke-width="1"/>
        <rect x="22" y="240" width="11" height="46" rx="5" fill="#3b3b3b"/>
        <rect x="38" y="240" width="11" height="46" rx="5" fill="#f5a623"/>
      </g>

      <!-- 身体 -->
      <ellipse cx="8" cy="205" rx="50" ry="37" fill="#ffffff" stroke="#cfc0ad" stroke-width="1.5"/>
      <g clip-path="url(#bodyClip)">
        <ellipse cx="-25" cy="196" rx="22" ry="17" fill="#f5a623" transform="rotate(-15 -25 196)"/>
        <ellipse cx="18" cy="190" rx="13" ry="10" fill="#f5a623"/>
        <ellipse cx="34" cy="216" rx="19" ry="19" fill="#3b3b3b"/>
        <ellipse cx="-3" cy="222" rx="12" ry="9" fill="#3b3b3b"/>
      </g>

      <!-- 耳朵（先画，头部覆盖根部） -->
      <path d="M -58 138 L -54 100 L -28 124 Z" fill="#f5a623" stroke="#c77b1e" stroke-width="1.5"/>
      <path d="M -52 129 L -49 108 L -34 122 Z" fill="#ffb37d"/>
      <path d="M -36 124 L -22 98 L -4 126 Z" fill="#3b3b3b" stroke="#222222" stroke-width="1.5"/>
      <path d="M -32 120 L -23 106 L -9 122 Z" fill="#c26068"/>

      <!-- 头部 -->
      <circle cx="-30" cy="155" r="30" fill="#ffffff" stroke="#cfc0ad" stroke-width="1.5"/>
      <g clip-path="url(#headClip)">
        <ellipse cx="-53" cy="150" rx="15" ry="15" fill="#3b3b3b"/>
        <ellipse cx="-14" cy="172" rx="14" ry="12" fill="#f5a623"/>
        <ellipse cx="-36" cy="138" rx="9" ry="6" fill="#f5a623"/>
      </g>

      <!-- 脸部 -->
      <!-- 眼睛（弯弯的笑眼） -->
      <path d="M -46 146 Q -40 152 -34 146" fill="none" stroke="#2f2f2f" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M -28 146 Q -22 152 -16 146" fill="none" stroke="#2f2f2f" stroke-width="2.5" stroke-linecap="round"/>
      <!-- 红晕 -->
      <ellipse cx="-43" cy="160" rx="4" ry="2.5" fill="#ffcccf" opacity="0.7"/>
      <ellipse cx="-18" cy="160" rx="4" ry="2.5" fill="#ffcccf" opacity="0.7"/>
      <!-- 鼻子 -->
      <path d="M -35 156 L -27 156 L -31 162 Z" fill="#f27d9b"/>
      <!-- 猫嘴 -->
      <path d="M -38 167 Q -34 172 -31 167 Q -28 172 -24 167" fill="none" stroke="#2f2f2f" stroke-width="2" stroke-linecap="round"/>
      <!-- 胡须 -->
      <g stroke="#999999" stroke-width="1.5" stroke-linecap="round">
        <line x1="-46" y1="162" x2="-70" y2="156"/>
        <line x1="-46" y1="165" x2="-70" y2="165"/>
        <line x1="-46" y1="168" x2="-68" y2="174"/>
        <line x1="-16" y1="162" x2="6" y2="158"/>
        <line x1="-16" y1="165" x2="6" y2="165"/>
        <line x1="-16" y1="168" x2="4" y2="172"/>
      </g>

      <!-- 红围巾（尾带向后飘） -->
      <rect x="-42" y="172" width="52" height="13" rx="6.5" fill="#e2373b" stroke="#a92428" stroke-width="1.2"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-5 4 178; 7 4 178; -5 4 178" dur="1.4s" repeatCount="indefinite"/>
        <path d="M 2 178 C 22 171 30 187 48 180" fill="none" stroke="#e2373b" stroke-width="9" stroke-linecap="round"/>
      </g>
      <circle cx="4" cy="179" r="6.5" fill="#c32b2e"/>

      <!-- 速度线（拖尾） -->
      <g stroke="#a7b8c4" stroke-width="4" stroke-linecap="round">
        <animate attributeName="opacity" values="0.2;0.7;0.2" dur="0.5s" repeatCount="indefinite"/>
        <line x1="95" y1="185" x2="132" y2="185"/>
        <line x1="106" y1="210" x2="152" y2="210"/>
        <line x1="98" y1="235" x2="146" y2="235"/>
      </g>
    </g>
  </g>
</svg>