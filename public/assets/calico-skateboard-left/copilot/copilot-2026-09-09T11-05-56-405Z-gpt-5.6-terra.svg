<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#a8ddf5"/>
      <stop offset="1" stop-color="#f7dfb2"/>
    </linearGradient>
  </defs>

  <rect width="800" height="400" fill="url(#sky)"/>
  <path d="M0 315H800" stroke="#555d67" stroke-width="8"/>
  <path d="M0 350H800" stroke="#f9f4dc" stroke-width="5" stroke-dasharray="45 32"/>

  <g>
    <animateTransform attributeName="transform" type="translate"
      values="900 0; -250 0" dur="6s" repeatCount="indefinite"/>

    <!-- Skateboard -->
    <g transform="translate(265 292)">
      <path d="M0 0 Q65 18 142 0 Q136 15 125 16H16Q5 14 0 0" fill="#55a9df" stroke="#253747" stroke-width="4"/>
      <circle cx="25" cy="22" r="10" fill="#27313b"/>
      <circle cx="118" cy="22" r="10" fill="#27313b"/>
      <circle cx="25" cy="22" r="4" fill="#c6d5df"/>
      <circle cx="118" cy="22" r="4" fill="#c6d5df"/>
    </g>

    <!-- Tail -->
    <path d="M370 235 Q435 186 446 241 Q452 272 420 268"
      fill="none" stroke="#e3a25d" stroke-width="21" stroke-linecap="round"/>
    <path d="M397 218l15 12M423 215l16 12" stroke="#4c352c" stroke-width="9" stroke-linecap="round"/>

    <!-- Legs -->
    <path d="M296 254L283 289H315L328 257M357 254L371 289H402L388 251"
      fill="#fff6e8" stroke="#493832" stroke-width="4" stroke-linejoin="round"/>

    <!-- Body -->
    <ellipse cx="340" cy="228" rx="72" ry="48" fill="#fff7e9" stroke="#493832" stroke-width="4"/>
    <path d="M287 205Q306 179 326 198Q314 223 294 225Z" fill="#3d302c"/>
    <path d="M342 184Q377 187 391 210Q367 228 347 216Z" fill="#e3a25d"/>
    <path d="M350 252Q375 232 401 240Q390 271 363 272Z" fill="#3d302c"/>

    <!-- Head and ears -->
    <path d="M279 202L274 151L311 174Q338 158 364 177L401 151L394 207Z"
      fill="#fff7e9" stroke="#493832" stroke-width="4" stroke-linejoin="round"/>
    <path d="M281 160l7 28 16-13M388 160l-7 28-16-13" fill="#e99ca3"/>
    <path d="M281 187Q305 170 321 184Q311 207 288 205Z" fill="#e3a25d"/>
    <path d="M346 174Q370 176 389 194Q371 211 352 200Z" fill="#3d302c"/>

    <!-- Face -->
    <ellipse cx="316" cy="202" rx="4" ry="6" fill="#26313a"/>
    <ellipse cx="360" cy="202" rx="4" ry="6" fill="#26313a"/>
    <path d="M336 212l-6 5h12z" fill="#d87882"/>
    <path d="M336 218q-8 9-16 1M336 218q8 9 16 1" fill="none" stroke="#493832" stroke-width="2" stroke-linecap="round"/>
    <path d="M307 213l-28-5M307 219l-29 5M365 213l28-5M365 219l29 5"
      stroke="#493832" stroke-width="2" stroke-linecap="round"/>

    <!-- Motion lines -->
    <path d="M450 273h45M467 291h65M442 309h42" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".8">
      <animate attributeName="opacity" values=".15;.9;.15" dur=".45s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>