<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
  <title id="title">三花猫滑滑板</title>
  <desc id="desc">一只三花猫踩着滑板，从画面右侧向左侧前进。</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed8ff"/>
      <stop offset="1" stop-color="#eefaff"/>
    </linearGradient>

    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#66717e"/>
      <stop offset="1" stop-color="#3d4650"/>
    </linearGradient>

    <linearGradient id="board" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5b6e"/>
      <stop offset=".5" stop-color="#ffca3a"/>
      <stop offset="1" stop-color="#7bd55c"/>
    </linearGradient>

    <filter id="shadow" x="-30%" y="-50%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>

    <g id="wheel">
      <circle r="22" fill="#202631"/>
      <circle r="13" fill="#596574"/>
      <circle r="5" fill="#dfe8ef"/>
      <g stroke="#b8c4ce" stroke-width="2">
        <path d="M0-12V12M-12 0H12M-8.5-8.5L8.5 8.5M8.5-8.5L-8.5 8.5"/>
      </g>
    </g>
  </defs>

  <!-- 背景 -->
  <rect width="960" height="480" fill="url(#sky)"/>
  <circle cx="820" cy="82" r="42" fill="#fff3a5" opacity=".9"/>

  <g fill="#fff" opacity=".8">
    <path d="M75 94c12-28 54-26 63 2 23-18 59-4 60 25H52c-4-17 7-27 23-27z"/>
    <path d="M570 72c10-23 43-22 52 1 18-13 47-2 48 21H552c-2-13 6-22 18-22z"/>
  </g>

  <path d="M0 316Q100 270 203 314T410 305T616 310T816 292T960 312V370H0Z"
        fill="#91c86d"/>
  <rect y="350" width="960" height="130" fill="url(#road)"/>
  <rect y="350" width="960" height="8" fill="#dbe5ea"/>

  <!-- 向右移动的路面标记，强化向左前进效果 -->
  <g fill="#f8e27c">
    <g>
      <rect x="-180" y="422" width="115" height="9" rx="4.5"/>
      <rect x="55" y="422" width="115" height="9" rx="4.5"/>
      <rect x="290" y="422" width="115" height="9" rx="4.5"/>
      <rect x="525" y="422" width="115" height="9" rx="4.5"/>
      <rect x="760" y="422" width="115" height="9" rx="4.5"/>
      <rect x="995" y="422" width="115" height="9" rx="4.5"/>
      <animateTransform attributeName="transform" type="translate"
                        values="0 0;235 0" dur="1.15s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- 速度线 -->
  <g stroke="#fff" stroke-linecap="round" opacity=".65">
    <path d="M650 185h115" stroke-width="7">
      <animate attributeName="opacity" values="0;.75;0" dur="1.1s" repeatCount="indefinite"/>
    </path>
    <path d="M760 235h78" stroke-width="5">
      <animate attributeName="opacity" values=".7;0;.7" dur=".8s" repeatCount="indefinite"/>
    </path>
    <path d="M610 285h145" stroke-width="4">
      <animate attributeName="opacity" values="0;.6;0" dur="1.35s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 猫和滑板整体从右向左移动 -->
  <g>
    <animateTransform attributeName="transform" type="translate"
                      values="1010 0;-430 0"
                      dur="7s" repeatCount="indefinite"/>

    <!-- 地面阴影 -->
    <ellipse cx="205" cy="410" rx="155" ry="17" fill="#15202b" opacity=".28"
             filter="url(#shadow)">
      <animate attributeName="rx" values="145;160;145" dur=".55s" repeatCount="indefinite"/>
    </ellipse>

    <!-- 滑板 -->
    <g>
      <animateTransform attributeName="transform" type="translate"
                        values="0 0;0 -3;0 0" dur=".55s" repeatCount="indefinite"/>

      <path d="M42 361Q29 361 23 348Q40 354 59 350H327Q348 351 364 341
               Q360 359 340 364H55Q48 364 42 361Z"
            fill="url(#board)" stroke="#263442" stroke-width="5" stroke-linejoin="round"/>
      <path d="M62 350H330" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".5"/>
      <path d="M82 364v15M310 364v15" stroke="#263442" stroke-width="8"/>

      <g transform="translate(82 387)">
        <use href="#wheel"/>
        <animateTransform attributeName="transform" type="rotate"
                          from="0 82 387" to="-360 82 387"
                          dur=".45s" repeatCount="indefinite"/>
      </g>
      <g transform="translate(310 387)">
        <use href="#wheel"/>
        <animateTransform attributeName="transform" type="rotate"
                          from="0 310 387" to="-360 310 387"
                          dur=".45s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- 三花猫 -->
    <g>
      <animateTransform attributeName="transform" type="translate"
                        values="0 0;0 -7;0 0" dur=".55s" repeatCount="indefinite"/>

      <!-- 尾巴 -->
      <g transform="rotate(0 302 244)">
        <path d="M295 250Q345 222 343 181Q342 151 369 153Q391 155 382 178"
              fill="none" stroke="#f28c28" stroke-width="25" stroke-linecap="round"/>
        <path d="M368 153Q385 154 382 178"
              fill="none" stroke="#292e35" stroke-width="25" stroke-linecap="round"/>
        <animateTransform attributeName="transform" type="rotate"
                          values="-8 302 244;11 302 244;-8 302 244"
                          dur=".8s" repeatCount="indefinite"/>
      </g>

      <!-- 后腿 -->
      <path d="M271 291Q296 302 310 338L281 344Q272 324 252 315Z"
            fill="#f7f4ed" stroke="#333942" stroke-width="5"/>
      <path d="M279 341q19-12 38 2q-4 13-21 12h-18Z"
            fill="#fff" stroke="#333942" stroke-width="5"/>

      <!-- 身体 -->
      <ellipse cx="225" cy="257" rx="92" ry="70"
               fill="#f8f5ed" stroke="#333942" stroke-width="6"/>

      <!-- 身体彩色斑块 -->
      <path d="M220 190Q271 185 299 217Q283 246 247 239Q218 229 220 190Z"
            fill="#292e35"/>
      <path d="M257 273Q298 264 312 294Q293 327 253 320Q235 299 257 273Z"
            fill="#f2912e"/>
      <path d="M155 275Q180 253 204 268Q216 293 190 319Q158 315 145 296Z"
            fill="#292e35"/>

      <!-- 前腿 -->
      <path d="M151 284Q136 309 126 340L158 345Q168 318 183 294Z"
            fill="#f7f4ed" stroke="#333942" stroke-width="5"/>
      <path d="M123 341q19-13 40 2q-4 13-22 12h-19Z"
            fill="#fff" stroke="#333942" stroke-width="5"/>

      <!-- 头部 -->
      <path d="M72 213L68 156L105 177Q128 166 151 177L185 153L180 215
               Q184 266 128 279Q73 268 72 213Z"
            fill="#faf7f0" stroke="#333942" stroke-width="6" stroke-linejoin="round"/>

      <!-- 耳朵 -->
      <path d="M77 169L72 157L102 178Z" fill="#f4a8a8"/>
      <path d="M157 177L181 157L177 190Z" fill="#f4a8a8"/>

      <!-- 头部三花斑 -->
      <path d="M70 158L105 178L101 216Q79 222 71 209Z" fill="#292e35"/>
      <path d="M132 172Q164 166 182 154L179 214Q157 221 139 205Z" fill="#f2912e"/>
      <path d="M101 178Q119 166 139 173L134 203Q115 209 101 199Z" fill="#fff"/>

      <!-- 表情 -->
      <g stroke="#333942" stroke-width="5" stroke-linecap="round" fill="none">
        <path d="M92 225q10-10 20 0"/>
        <path d="M145 225q10-10 20 0"/>
        <path d="M128 239v6"/>
        <path d="M128 245q-9 10-18 2M128 245q9 10 18 2"/>
      </g>
      <path d="M121 237Q128 231 135 237Q133 245 128 245Q123 245 121 237Z"
            fill="#e98686"/>

      <!-- 胡须 -->
      <g stroke="#333942" stroke-width="3" stroke-linecap="round">
        <path d="M93 243L49 235M94 251L47 254M162 243L203 232M160 251L205 258"/>
      </g>

      <!-- 迎风飘动的红领巾 -->
      <path d="M163 263Q199 278 225 267Q201 291 165 280Z"
            fill="#ef4457" stroke="#333942" stroke-width="4">
        <animate attributeName="d"
                 values="M163 263Q199 278 225 267Q201 291 165 280Z;
                         M163 263Q204 267 232 250Q207 286 165 280Z;
                         M163 263Q199 278 225 267Q201 291 165 280Z"
                 dur=".45s" repeatCount="indefinite"/>
      </path>
      <circle cx="160" cy="263" r="10" fill="#ef4457" stroke="#333942" stroke-width="4"/>
    </g>
  </g>
</svg>