<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="title desc">
  <title id="title">三花猫滑着滑板从右向左前进</title>
  <desc id="desc">一只三花猫站在滑板上，从画面右侧滑向左侧。</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bde9ff"/>
      <stop offset="1" stop-color="#f8fcff"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ff9c4a"/>
      <stop offset="1" stop-color="#e9574f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#sky)"/>
  <circle cx="110" cy="92" r="42" fill="#fff7b2" opacity=".8"/>
  <path d="M0 350 Q180 315 360 345 T800 330 V450 H0Z" fill="#d8f2cf"/>
  <path d="M0 391 Q180 365 360 392 T800 380" fill="none" stroke="#b6dca9" stroke-width="4"/>
  <path d="M0 422 Q200 398 400 425 T800 410" fill="none" stroke="#c1e4b4" stroke-width="3"/>

  <ellipse cx="400" cy="362" rx="160" ry="15" fill="#72977d" opacity=".25" filter="url(#shadow)">
    <animate attributeName="rx" values="150;175;150" dur="1.4s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Entire rider travels from right to left -->
  <g>
    <animateTransform
      attributeName="transform"
      type="translate"
      from="330 0"
      to="-610 0"
      dur="8s"
      repeatCount="indefinite"
      calcMode="linear"/>

    <!-- motion lines -->
    <g fill="none" stroke="#ffffff" stroke-linecap="round" opacity=".7">
      <path d="M520 224h55"><animate attributeName="x1" values="520;485;520" dur="1s" repeatCount="indefinite"/></path>
      <path d="M545 246h35"><animate attributeName="x1" values="545;515;545" dur=".8s" repeatCount="indefinite"/></path>
    </g>

    <!-- tail, behind the body -->
    <path d="M326 210 C270 195 278 145 325 151 C357 155 350 184 323 180"
          fill="none" stroke="#5a4038" stroke-width="17" stroke-linecap="round">
      <animate attributeName="d"
        values="M326 210 C270 195 278 145 325 151 C357 155 350 184 323 180;
                M326 210 C270 220 260 177 310 163 C344 154 350 184 323 180;
                M326 210 C270 195 278 145 325 151 C357 155 350 184 323 180"
        dur="1.5s" repeatCount="indefinite"/>
    </path>
    <path d="M300 178l20 8M293 195l20 5" stroke="#d88743" stroke-width="8" stroke-linecap="round"/>

    <!-- cat body -->
    <ellipse cx="395" cy="218" rx="64" ry="78" fill="#f5eee2" stroke="#493833" stroke-width="5"/>
    <path d="M356 180 C342 206 349 237 372 252 C390 264 412 263 430 249
             C407 231 399 195 408 158Z" fill="#c87542"/>
    <path d="M410 165 C430 180 447 202 449 229 C450 246 443 258 434 268
             C419 248 407 224 405 196Z" fill="#4f4743"/>
    <path d="M354 224 C372 214 386 215 397 228" fill="none" stroke="#b9a69a" stroke-width="8"/>
    <ellipse cx="382" cy="278" rx="23" ry="42" fill="#f5eee2" stroke="#493833" stroke-width="5"/>
    <ellipse cx="428" cy="273" rx="22" ry="44" fill="#f5eee2" stroke="#493833" stroke-width="5"/>

    <!-- cat head facing left -->
    <path d="M330 124 L324 80 L356 101 C375 92 400 94 417 106 L446 84 L439 134
             C450 158 436 185 407 194 C370 205 336 184 328 157Z"
          fill="#f5eee2" stroke="#493833" stroke-width="5" stroke-linejoin="round"/>
    <path d="M329 125 L326 86 L355 106 L354 137Z" fill="#c87542"/>
    <path d="M414 108 L442 90 L435 137 L416 139Z" fill="#4f4743"/>
    <path d="M342 143 C353 128 372 126 385 139 C372 154 355 159 342 143Z" fill="#c87542"/>
    <ellipse cx="348" cy="139" rx="6" ry="8" fill="#2d2725"/>
    <ellipse cx="350" cy="136" rx="2" ry="3" fill="#fff"/>
    <path d="M332 158 Q343 167 354 158" fill="none" stroke="#493833" stroke-width="4" stroke-linecap="round"/>
    <path d="M331 151l-32-8M331 158l-34 5M333 164l-29 16" stroke="#493833" stroke-width="2" stroke-linecap="round"/>
    <path d="M354 157q7 7 14 0" fill="none" stroke="#e78b91" stroke-width="5" stroke-linecap="round"/>

    <!-- front paw -->
    <path d="M363 210 Q330 235 315 267" fill="none" stroke="#493833" stroke-width="15" stroke-linecap="round"/>
    <path d="M315 267q-15 8-26 1" fill="none" stroke="#493833" stroke-width="9" stroke-linecap="round"/>

    <!-- skateboard -->
    <path d="M286 326 Q390 342 507 319 Q522 316 530 326
             Q520 345 497 348 Q390 364 285 344 Q269 340 286 326Z"
          fill="url(#board)" stroke="#4b3732" stroke-width="5"/>
    <path d="M305 338 Q400 351 500 331" fill="none" stroke="#ffc06c" stroke-width="4" opacity=".8"/>

    <g>
      <g transform="translate(335 351)">
        <circle r="16" fill="#4b4a4b" stroke="#29282b" stroke-width="4"/>
        <circle r="6" fill="#d5d5d5"/>
        <animateTransform attributeName="transform" type="rotate"
          from="0 0 0" to="360 0 0" dur=".45s" repeatCount="indefinite"/>
      </g>
      <g transform="translate(477 338)">
        <circle r="16" fill="#4b4a4b" stroke="#29282b" stroke-width="4"/>
        <circle r="6" fill="#d5d5d5"/>
        <animateTransform attributeName="transform" type="rotate"
          from="0 0 0" to="360 0 0" dur=".45s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- gentle bob while skating -->
    <animateTransform attributeName="transform" additive="sum"
      type="translate" values="0 0;0 -4;0 0" dur=".7s" repeatCount="indefinite"/>
  </g>
</svg>