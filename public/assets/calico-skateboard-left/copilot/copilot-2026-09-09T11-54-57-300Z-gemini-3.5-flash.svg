<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <!-- 天空渐变 -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="40%" stop-color="#1E1B4B" />
      <stop offset="70%" stop-color="#581C87" />
      <stop offset="100%" stop-color="#DB2777" />
    </linearGradient>

    <!-- 尾迹渐变 -->
    <linearGradient id="trailGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF2E63" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00ADB5" stop-opacity="0" />
    </linearGradient>

    <!-- 猫头裁剪路径 (用于完美贴合三花色块) -->
    <clipPath id="head-clip">
      <ellipse cx="0" cy="0" rx="34" ry="28" />
    </clipPath>

    <!-- 猫身体裁剪路径 -->
    <clipPath id="body-clip">
      <path d="M -50 -25 C -55 -45, -45 -65, -20 -65 C 10 -65, 40 -65, 55 -55 C 65 -45, 65 -25, 55 -15 C 45 -5, 20 -5, -15 -5 C -35 -5, -45 -10, -50 -25 Z" />
    </clipPath>
  </defs>

  <!-- 背景：天空 -->
  <rect width="800" height="400" fill="url(#skyGrad)" />

  <!-- 闪烁的星星 -->
  <g fill="#FFF" opacity="0.8">
    <path d="M 120 60 Q 120 70 110 70 Q 120 70 120 80 Q 120 70 130 70 Q 120 70 120 60 Z" />
    <path d="M 380 40 Q 380 48 372 48 Q 380 48 380 56 Q 380 48 388 48 Q 380 48 380 40 Z" opacity="0.6" />
    <path d="M 680 80 Q 680 88 672 88 Q 680 88 680 96 Q 680 88 688 88 Q 680 88 680 80 Z" opacity="0.5" />
    <circle cx="250" cy="100" r="1.5" />
    <circle cx="500" cy="50" r="1" />
    <circle cx="720" cy="120" r="2" />
  </g>

  <!-- 慢速漂浮的云朵 -->
  <g fill="#FFF" opacity="0.15">
    <path d="M 150 110 Q 175 85 200 110 Q 225 95 240 120 Q 210 145 150 135 Z" />
    <animateTransform attributeName="transform" type="translate" from="850 0" to="-300 0" dur="50s" repeatCount="indefinite" />
  </g>
  <g fill="#FFF" opacity="0.1">
    <path d="M 550 70 Q 570 50 590 70 Q 610 60 620 80 Q 600 100 550 90 Z" />
    <animateTransform attributeName="transform" type="translate" from="850 0" to="-300 0" dur="70s" repeatCount="indefinite" />
  </g>

  <!-- 背景：巨大的落日 -->
  <circle cx="480" cy="200" r="75" fill="#FEE2E2" opacity="0.15" />
  <circle cx="480" cy="200" r="60" fill="#FDE047" opacity="0.7" />

  <!-- 背景山脉 -->
  <path d="M 0 300 L 120 190 L 280 300 L 450 170 L 620 300 L 740 210 L 800 300 Z" fill="#3B0764" opacity="0.4" />
  <path d="M 0 300 L 180 230 L 350 300 L 520 210 L 700 300 Z" fill="#1E1B4B" opacity="0.7" />

  <!-- 飞速掠过的风线 -->
  <g stroke="rgba(255,255,255,0.25)" stroke-width="2" stroke-linecap="round">
    <line x1="0" y1="130" x2="80" y2="130">
      <animate attributeName="x1" values="900; -200" dur="1.5s" repeatCount="indefinite" />
      <animate attributeName="x2" values="980; -120" dur="1.5s" repeatCount="indefinite" />
    </line>
    <line x1="0" y1="210" x2="120" y2="210">
      <animate attributeName="x1" values="950; -250" dur="1.1s" begin="0.2s" repeatCount="indefinite" />
      <animate attributeName="x2" values="1070; -130" dur="1.1s" begin="0.2s" repeatCount="indefinite" />
    </line>
    <line x1="0" y1="160" x2="60" y2="160">
      <animate attributeName="x1" values="900; -200" dur="1.8s" begin="0.5s" repeatCount="indefinite" />
      <animate attributeName="x2" values="960; -140" dur="1.8s" begin="0.5s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- 道路与霓虹地平线 -->
  <rect x="0" y="300" width="800" height="100" fill="#0F172A" />
  <rect x="0" y="297" width="800" height="4" fill="#00ADB5" /> <!-- 霓虹路缘蓝光 -->
  
  <!-- 滚动道路标线 -->
  <g stroke="#FF2E63" stroke-width="4" stroke-dasharray="30 20">
    <line x1="0" y1="350" x2="800" y2="350" />
    <animate attributeName="stroke-dashoffset" values="0; 50" dur="0.5s" repeatCount="indefinite" />
  </g>

  <!-- ==================== 主体：三花猫与滑板 ==================== -->
  <g id="cat-and-board">
    <!-- 从右向左横跨屏幕动画 (3s一循环) -->
    <animateTransform attributeName="transform" type="translate" from="920 269" to="-180 269" dur="3s" repeatCount="indefinite" />

    <!-- 颠簸/滑行微震动组 -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -1.5; 0 1; 0 -0.5; 0 0" dur="0.12s" repeatCount="indefinite" />

      <!-- 霓虹速度尾迹 -->
      <path d="M 70 5 L 170 5" stroke="url(#trailGrad)" stroke-width="6" stroke-linecap="round" opacity="0.9" />
      
      <!-- 轮子冒出的喷射粒子 -->
      <g>
        <circle cx="65" cy="18" r="3" fill="#00ADB5">
          <animate attributeName="cx" values="65; 115; 155" dur="0.6s" repeatCount="indefinite" />
          <animate attributeName="cy" values="18; 10; 0" dur="0.6s" repeatCount="indefinite" />
          <animate attributeName="r" values="3; 5; 0" dur="0.6s" repeatCount="indefinite" />
          <animate attributeName="opacity" values="0.9; 0.5; 0" dur="0.6s" repeatCount="indefinite" />
        </circle>
        <circle cx="75" cy="22" r="2.5" fill="#FF2E63">
          <animate attributeName="cx" values="75; 130; 170" dur="0.8s" begin="0.2s" repeatCount="indefinite" />
          <animate attributeName="cy" values="22; 15; 5" dur="0.8s" begin="0.2s" repeatCount="indefinite" />
          <animate attributeName="r" values="2.5; 4.5; 0" dur="0.8s" begin="0.2s" repeatCount="indefinite" />
          <animate attributeName="opacity" values="0.9; 0.4; 0" dur="0.8s" begin="0.2s" repeatCount="indefinite" />
        </circle>
      </g>

      <!-- 滑板支架 (Trucks) -->
      <rect x="-55" y="-3" width="10" height="18" fill="#64748B" stroke="#111" stroke-width="3" stroke-linejoin="round" />
      <rect x="45" y="-3" width="10" height="18" fill="#64748B" stroke="#111" stroke-width="3" stroke-linejoin="round" />

      <!-- 前轮 (左侧，带旋转动画) -->
      <g transform="translate(-50, 15)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="0.3s" repeatCount="indefinite" />
          <circle cx="0" cy="0" r="16" fill="#1E293B" stroke="#111" stroke-width="3" />
          <circle cx="0" cy="0" r="10" fill="#00F5FF" />
          <line x1="-10" y1="0" x2="10" y2="0" stroke="#1E293B" stroke-width="3" />
          <line x1="0" y1="-10" x2="0" y2="10" stroke="#1E293B" stroke-width="3" />
          <circle cx="0" cy="0" r="3" fill="#FFF" />
        </g>
      </g>

      <!-- 后轮 (右侧，带旋转动画) -->
      <g transform="translate(50, 15)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="0.3s" repeatCount="indefinite" />
          <circle cx="0" cy="0" r="16" fill="#1E293B" stroke="#111" stroke-width="3" />
          <circle cx="0" cy="0" r="10" fill="#00F5FF" />
          <line x1="-10" y1="0" x2="10" y2="0" stroke="#1E293B" stroke-width="3" />
          <line x1="0" y1="-10" x2="0" y2="10" stroke="#1E293B" stroke-width="3" />
          <circle cx="0" cy="0" r="3" fill="#FFF" />
        </g>
      </g>

      <!-- 滑板板面 (Deck) -->
      <!-- 板底霓虹粉层 -->
      <path d="M -95 -10 C -100 -10 -105 -5 -100 0 C -95 5 -80 5 -70 5 L 70 5 C 80 5 95 5 100 0 C 105 -5 100 -10 95 -10 Z" fill="#FF2E63" stroke="#111" stroke-width="4" stroke-linejoin="round" />
      <!-- 板面防滑贴层 -->
      <path d="M -90 -7 C -95 -7 -98 -4 -95 -1 C -92 2 -80 2 -70 2 L 70 2 C 80 2 92 2 95 -1 C 98 -4 95 -7 90 -7 Z" fill="#1E293B" />

      <!-- ==================== 猫咪主体 ==================== -->
      <!-- 1. 远侧后脚 (灰色暗影) -->
      <path d="M 18 -22 C 18 -10, 14 -6, 21 -6 C 27 -6, 26 -12, 26 -22" fill="#CBD5E1" stroke="#111" stroke-width="4" stroke-linejoin="round" />
      
      <!-- 2. 远侧前脚 (灰色暗影) -->
      <path d="M -32 -22 C -32 -10, -35 -6, -29 -6 C -23 -6, -24 -12, -24 -22" fill="#CBD5E1" stroke="#111" stroke-width="4" stroke-linejoin="round" />

      <!-- 3. 摇晃的尾巴 -->
      <g id="cat-tail" transform="translate(52, -35)">
        <animateTransform attributeName="transform" type="rotate" values="-15; 20; -15" dur="1s" repeatCount="indefinite" additive="sum" />
        <!-- 尾巴粗轮廓线 -->
        <path d="M 0 0 C 15 -10, 25 -30, 20 -45 C 18 -50, 12 -50, 10 -45 C 5 -30, 10 -15, -5 -2" fill="none" stroke="#111" stroke-width="14" stroke-linecap="round" />
        <!-- 尾巴主体 (白色) -->
        <path d="M 0 0 C 15 -10, 25 -30, 20 -45 C 18 -50, 12 -50, 10 -45 C 5 -30, 10 -15, -5 -2" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" />
        <!-- 尾巴三花色块 (使用 stroke-dasharray 贴合曲线) -->
        <path d="M 0 0 C 15 -10, 25 -30, 20 -45 C 18 -50, 12 -50, 10 -45 C 5 -30, 10 -15, -5 -2" fill="none" stroke="#2D3436" stroke-width="8" stroke-dasharray="20 60" stroke-linecap="round" />
        <path d="M 0 0 C 15 -10, 25 -30, 20 -45 C 18 -50, 12 -50, 10 -45 C 5 -30, 10 -15, -5 -2" fill="none" stroke="#FF9233" stroke-width="8" stroke-dasharray="0 35 20 20" stroke-linecap="round" />
      </g>

      <!-- 4. 猫身体 (呼吸/上下起伏微动) -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 1; 0 -0.5; 0 0" dur="0.6s" repeatCount="indefinite" />
        
        <!-- 身体基底与裁剪色块 -->
        <g>
          <path d="M -50 -25 C -55 -45, -45 -65, -20 -65 C 10 -65, 40 -65, 55 -55 C 65 -45, 65 -25, 55 -15 C 45 -5, 20 -5, -15 -5 C -35 -5, -45 -10, -50 -25 Z" fill="#FFFFFF" />
          
          <!-- 身体三花色块叠层 -->
          <g clip-path="url(#body-clip)">
            <!-- 后背橘色斑块 -->
            <path d="M -15 -70 C 15 -70, 35 -60, 40 -35 C 20 -20, -5 -30, -25 -45 Z" fill="#FF9233" />
            <!-- 臀部黑色斑块 -->
            <path d="M 25 -65 C 45 -65, 60 -50, 60 -20 C 45 -15, 35 -30, 25 -45 Z" fill="#2D3436" />
            <!-- 腹部黑色斑块 -->
            <path d="M -35 -15 C -25 -15, -15 -5, -25 -5 Z" fill="#2D3436" />
          </g>

          <!-- 身体粗轮廓线 -->
          <path d="M -50 -25 C -55 -45, -45 -65, -20 -65 C 10 -65, 40 -65, 55 -55 C 65 -45, 65 -25, 55 -15 C 45 -5, 20 -5, -15 -5 C -35 -5, -45 -10, -50 -25 Z" fill="none" stroke="#111" stroke-width="4" stroke-linejoin="round" />
        </g>
      </g>

      <!-- 5. 近侧后脚 (白色，带斑纹) -->
      <g>
        <path d="M 32 -20 C 32 -8, 28 -4, 36 -4 C 42 -4, 42 -10, 42 -20" fill="#FFFFFF" stroke="#111" stroke-width="4" stroke-linejoin="round" />
        <!-- 黑色斑纹 -->
        <path d="M 34 -12 Q 38 -10 40 -13 Q 41 -6 37 -5 Q 33 -6 34 -12" fill="#2D3436" />
      </g>

      <!-- 6. 近侧前脚 (白色，带斑纹) -->
      <g>
        <path d="M -42 -20 C -42 -8, -46 -4, -38 -4 C -32 -4, -34 -10, -34 -20" fill="#FFFFFF" stroke="#111" stroke-width="4" stroke-linejoin="round" />
        <!-- 橘色斑纹 -->
        <path d="M -41 -12 Q -38 -10 -35 -13 Q -34 -6 -38 -5 Q -42 -6 -41 -12" fill="#FF9233" />
      </g>

      <!-- 7. 飘扬的围巾 -->
      <g id="scarf" transform="translate(-35, -48)">
        <!-- 围巾尾翼抖动 -->
        <g>
          <animateTransform attributeName="transform" type="skewY" values="-6; 8; -6" dur="0.25s" repeatCount="indefinite" />
          <!-- 红色围巾本体 -->
          <path d="M 0 0 C 30 -5, 50 -25, 80 -15 C 75 -5, 45 5, 0 4 Z" fill="#FF2E63" stroke="#111" stroke-width="4" stroke-linejoin="round" />
          <!-- 黄色条纹 -->
          <path d="M 28 -6 L 24 4 M 48 -13 L 44 -3 M 68 -13 L 64 -4" stroke="#FDE047" stroke-width="3" />
        </g>
        <!-- 围巾结 -->
        <circle cx="0" cy="0" r="7" fill="#FF2E63" stroke="#111" stroke-width="4" />
      </g>

      <!-- 8. 摇晃的猫头组 -->
      <g id="head-bob" transform="translate(-45, -50)">
        <!-- 头部微幅上下起伏与旋转 -->
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 2; 0 -1; 0 0" dur="0.6s" repeatCount="indefinite" />
        <g>
          <animateTransform attributeName="transform" type="rotate" values="-2; 3; -2" dur="1.2s" repeatCount="indefinite" />
          
          <!-- 远侧右耳 (橘色) -->
          <path d="M 5 -22 L 15 -44 L 25 -18 Z" fill="#FF9233" stroke="#111" stroke-width="4" stroke-linejoin="round" />
          <path d="M 8 -21 L 15 -38 L 20 -18 Z" fill="#FFB7B2" />

          <!-- 近侧左耳 (黑色) -->
          <path d="M -25 -18 L -32 -42 L -5 -22 Z" fill="#2D3436" stroke="#111" stroke-width="4" stroke-linejoin="round" />
          <path d="M -22 -19 L -28 -36 L -10 -21 Z" fill="#FFB7B2" />

          <!-- 头颅主体 (白色) -->
          <ellipse cx="0" cy="0" rx="34" ry="28" fill="#FFFFFF" stroke="#111" stroke-width="4" />

          <!-- 头颅三花色块 -->
          <g clip-path="url(#head-clip)">
            <!-- 头部右后方橘斑 -->
            <path d="M 10 -30 C 20 -20, 30 -10, 35 15 C 20 25, 10 15, 5 -10 Z" fill="#FF9233" />
            <!-- 额头左侧黑斑 -->
            <path d="M -35 -20 C -25 -25, -15 -25, -5 -15 C -10 5, -25 5, -35 -5 Z" fill="#2D3436" />
            <!-- 嘴角橘色圆斑 -->
            <circle cx="-15" cy="12" r="8" fill="#FF9233" opacity="0.9" />
          </g>

          <!-- 脸部五官 -->
          <!-- 闭眼微笑 (前/近处) -->
          <path d="M -22 -2 Q -15 -9 -8 -2" fill="none" stroke="#111" stroke-width="3.5" stroke-linecap="round" />
          <!-- 闭眼微笑 (后/远处) -->
          <path d="M -33 -4 Q -29 -10 -25 -4" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round" />

          <!-- 腮红 -->
          <ellipse cx="-12" cy="5" rx="6" ry="4" fill="#FF8DA1" opacity="0.6" />
          <ellipse cx="-28" cy="3" rx="4" ry="3" fill="#FF8DA1" opacity="0.6" />

          <!-- 鼻子 -->
          <polygon points="-18,2 -14,2 -16,5" fill="#FF6584" />

          <!-- 嘴巴 (可爱猫咪嘴 "3") -->
          <path d="M -16 5 Q -18 8 -20 7 M -16 5 Q -14 8 -12 7" fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round" />

          <!-- 风吹向脑后的胡须 -->
          <path d="M -22 6 C -32 8 -40 13 -44 18" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" />
          <path d="M -22 3 C -34 3 -44 5 -47 8" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" />
          <path d="M -22 0 C -32 -2 -42 -3 -45 -2" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" />
        </g>
      </g> <!-- 摇晃的猫头组结束 -->

    </g> <!-- 颠簸/滑行微震动组结束 -->
  </g> <!-- 主体：三花猫与滑板结束 -->

</svg>