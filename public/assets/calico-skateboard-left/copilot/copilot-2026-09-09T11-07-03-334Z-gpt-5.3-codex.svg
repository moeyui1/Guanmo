<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="三花猫滑着滑板从右到左前进">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfefff"/>
      <stop offset="100%" stop-color="#f5fbff"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity=".2"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect y="230" width="100%" height="70" fill="#d8e6ef"/>
  <line x1="0" y1="240" x2="900" y2="240" stroke="#b8c8d3" stroke-width="4" stroke-dasharray="14 12"/>

  <!-- 整体从右向左移动 -->
  <g filter="url(#shadow)">
    <animateTransform attributeName="transform" type="translate"
      values="980 0; -260 0" dur="7s" repeatCount="indefinite"/>

    <!-- 滑板 -->
    <g transform="translate(0,0)">
      <rect x="70" y="195" rx="16" ry="16" width="170" height="20" fill="#ffb347"/>
      <rect x="70" y="199" rx="14" ry="14" width="170" height="12" fill="#f79d2d"/>

      <g>
        <circle cx="95" cy="224" r="14" fill="#2f3b52"/>
        <circle cx="95" cy="224" r="6" fill="#9db3d0"/>
        <animateTransform attributeName="transform" type="rotate"
          values="0 95 224; -360 95 224" dur="0.7s" repeatCount="indefinite"/>
      </g>
      <g>
        <circle cx="215" cy="224" r="14" fill="#2f3b52"/>
        <circle cx="215" cy="224" r="6" fill="#9db3d0"/>
        <animateTransform attributeName="transform" type="rotate"
          values="0 215 224; -360 215 224" dur="0.7s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- 三花猫 -->
    <g transform="translate(30,20)">
      <!-- 身体 -->
      <ellipse cx="145" cy="150" rx="62" ry="38" fill="#fff7ed"/>
      <ellipse cx="168" cy="142" rx="22" ry="16" fill="#f59e0b"/>
      <ellipse cx="122" cy="160" rx="20" ry="14" fill="#1f2937"/>
      <ellipse cx="150" cy="163" rx="16" ry="10" fill="#fde9d2"/>

      <!-- 头 -->
      <circle cx="92" cy="116" r="34" fill="#fff7ed"/>
      <path d="M64 98 L74 76 L88 99 Z" fill="#fff7ed"/>
      <path d="M98 99 L112 76 L121 99 Z" fill="#fff7ed"/>
      <path d="M69 96 L75 84 L84 97 Z" fill="#f9c2d1"/>
      <path d="M101 97 L109 84 L116 97 Z" fill="#f9c2d1"/>

      <!-- 三花花纹 -->
      <path d="M72 108c8-14 20-14 28-8c-9 2-16 7-20 16c-4 0-8-3-8-8z" fill="#f59e0b"/>
      <path d="M95 119c10-4 18 1 18 8c-4 8-14 10-22 6c-2-6 0-11 4-14z" fill="#111827"/>
      <path d="M82 135c9-4 18-1 24 7c-8 3-17 3-25-1c-2-3-1-5 1-6z" fill="#f59e0b"/>

      <!-- 五官 -->
      <circle cx="82" cy="114" r="3.2" fill="#111827"/>
      <circle cx="101" cy="115" r="3.2" fill="#111827"/>
      <path d="M90 124 l4 0 l-2 4 z" fill="#f08aa0"/>
      <path d="M88 130 q-6 4 -12 0" stroke="#111827" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M94 130 q6 4 12 0" stroke="#111827" stroke-width="2" fill="none" stroke-linecap="round"/>

      <!-- 胡须 -->
      <path d="M72 124 h-20M72 129 h-18M110 124 h20M110 129 h18"
            stroke="#6b7280" stroke-width="1.8" stroke-linecap="round"/>

      <!-- 尾巴（摆动） -->
      <g>
        <path d="M202 148 q42 -20 54 10 q-8 26 -40 18"
              fill="none" stroke="#fff7ed" stroke-width="16" stroke-linecap="round"/>
        <path d="M209 142 q26 -10 34 3" fill="none" stroke="#111827" stroke-width="6" stroke-linecap="round"/>
        <path d="M218 158 q20 2 26 12" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
        <animateTransform attributeName="transform" type="rotate"
          values="0 195 150; 10 195 150; 0 195 150; -10 195 150; 0 195 150"
          dur="1.1s" repeatCount="indefinite"/>
      </g>

      <!-- 四肢 -->
      <ellipse cx="118" cy="183" rx="12" ry="8" fill="#fff7ed"/>
      <ellipse cx="150" cy="185" rx="12" ry="8" fill="#fff7ed"/>
      <ellipse cx="174" cy="181" rx="12" ry="8" fill="#fff7ed"/>
      <ellipse cx="95"  cy="179" rx="12" ry="8" fill="#fff7ed"/>
    </g>

    <!-- 轻微上下颠簸 -->
    <animateTransform attributeName="transform" additive="sum" type="translate"
      values="0 0; 0 -3; 0 0; 0 2; 0 0" dur="0.8s" repeatCount="indefinite"/>
  </g>
</svg>