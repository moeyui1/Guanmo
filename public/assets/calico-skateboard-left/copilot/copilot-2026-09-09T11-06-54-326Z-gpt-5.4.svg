<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#dff6ff"/>
      <stop offset="100%" stop-color="#fef6d8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="800" height="300" fill="url(#bg)"/>
  <rect y="230" width="800" height="70" fill="#d9f0c1"/>
  <line x1="0" y1="230" x2="800" y2="230" stroke="#8bb174" stroke-width="4"/>

  <g opacity="0.35">
    <g>
      <rect x="0" y="238" width="40" height="4" rx="2" fill="#8aa0b8"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-160 0" dur="2s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="200" y="238" width="40" height="4" rx="2" fill="#8aa0b8"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-160 0" dur="2s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="400" y="238" width="40" height="4" rx="2" fill="#8aa0b8"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-160 0" dur="2s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="600" y="238" width="40" height="4" rx="2" fill="#8aa0b8"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-160 0" dur="2s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="800" y="238" width="40" height="4" rx="2" fill="#8aa0b8"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-160 0" dur="2s" repeatCount="indefinite"/>
    </g>
  </g>

  <g filter="url(#shadow)">
    <g transform="translate(930 0)">
      <animateTransform attributeName="transform" type="translate" from="930 0" to="-240 0" dur="6s" repeatCount="indefinite"/>

      <g transform="translate(0 0)">
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -3; 0 0; 0 2; 0 0" dur="0.7s" repeatCount="indefinite"/>

        <!-- skateboard -->
        <g transform="translate(0 0)">
          <rect x="20" y="182" width="132" height="14" rx="7" fill="#5a3d2b"/>
          <rect x="24" y="184" width="124" height="8" rx="4" fill="#70c1b3"/>

          <g transform="translate(42 198)">
            <rect x="-4" y="-10" width="8" height="10" rx="2" fill="#a0a7b5"/>
            <circle cx="0" cy="6" r="11" fill="#2f3640"/>
            <circle cx="0" cy="6" r="4" fill="#f5f6fa"/>
            <animateTransform attributeName="transform" type="rotate" from="0 0 6" to="-360 0 6" dur="0.9s" repeatCount="indefinite"/>
          </g>

          <g transform="translate(130 198)">
            <rect x="-4" y="-10" width="8" height="10" rx="2" fill="#a0a7b5"/>
            <circle cx="0" cy="6" r="11" fill="#2f3640"/>
            <circle cx="0" cy="6" r="4" fill="#f5f6fa"/>
            <animateTransform attributeName="transform" type="rotate" from="0 0 6" to="-360 0 6" dur="0.9s" repeatCount="indefinite"/>
          </g>
        </g>

        <!-- cat -->
        <g transform="translate(0 0)">
          <!-- tail -->
          <g transform="translate(155 120)">
            <path d="M0 20 C30 0, 42 16, 36 34 C30 52, 52 60, 62 42" fill="none" stroke="#f2a65a" stroke-width="14" stroke-linecap="round"/>
            <path d="M34 22 C41 25, 48 32, 49 39" fill="none" stroke="#2f2f2f" stroke-width="4" stroke-linecap="round"/>
            <animateTransform attributeName="transform" type="rotate" values="0 0 20; 12 0 20; -8 0 20; 0 0 20" dur="1.2s" repeatCount="indefinite"/>
          </g>

          <!-- body -->
          <ellipse cx="98" cy="132" rx="54" ry="34" fill="#fff4e6"/>
          <path d="M55 128 C70 96, 128 94, 144 125 C133 112, 121 110, 109 111 C94 112, 78 118, 55 128 Z" fill="#f2a65a"/>
          <path d="M85 106 C98 117, 106 130, 106 147 C92 147, 78 133, 72 118 Z" fill="#2f2f2f"/>
          <path d="M117 111 C129 116, 139 126, 144 137 C132 141, 121 132, 117 111 Z" fill="#f28482"/>

          <!-- head -->
          <g transform="translate(22 58)">
            <circle cx="52" cy="44" r="32" fill="#fff4e6"/>
            <path d="M25 29 L38 8 L48 30 Z" fill="#fff4e6"/>
            <path d="M57 30 L69 8 L80 31 Z" fill="#fff4e6"/>
            <path d="M30 28 L38 14 L44 28 Z" fill="#f7b7c3"/>
            <path d="M61 28 L68 14 L75 28 Z" fill="#f7b7c3"/>

            <path d="M28 45 C34 28, 48 23, 58 27 C50 37, 41 46, 28 45 Z" fill="#f2a65a"/>
            <path d="M55 25 C68 25, 79 34, 82 46 C69 48, 60 42, 55 25 Z" fill="#2f2f2f"/>

            <ellipse cx="43" cy="46" rx="4" ry="6" fill="#1f1f1f"/>
            <ellipse cx="64" cy="46" rx="4" ry="6" fill="#1f1f1f"/>
            <circle cx="42" cy="44" r="1.2" fill="#ffffff"/>
            <circle cx="63" cy="44" r="1.2" fill="#ffffff"/>

            <path d="M50 56 L55 56 L52.5 60 Z" fill="#f08ca0"/>
            <path d="M52.5 60 C49 64, 45 64, 42 61" fill="none" stroke="#7a4b52" stroke-width="2" stroke-linecap="round"/>
            <path d="M52.5 60 C56 64, 60 64, 63 61" fill="none" stroke="#7a4b52" stroke-width="2" stroke-linecap="round"/>

            <path d="M22 55 C33 53, 39 54, 47 56" fill="none" stroke="#7a7a7a" stroke-width="2" stroke-linecap="round"/>
            <path d="M20 61 C32 59, 39 60, 47 61" fill="none" stroke="#7a7a7a" stroke-width="2" stroke-linecap="round"/>
            <path d="M58 56 C66 54, 72 53, 83 55" fill="none" stroke="#7a7a7a" stroke-width="2" stroke-linecap="round"/>
            <path d="M58 61 C66 60, 73 59, 85 61" fill="none" stroke="#7a7a7a" stroke-width="2" stroke-linecap="round"/>

            <animateTransform attributeName="transform" type="rotate" values="0 52 44; -2 52 44; 1 52 44; 0 52 44" dur="1s" repeatCount="indefinite"/>
          </g>

          <!-- legs -->
          <g>
            <rect x="63" y="156" width="12" height="24" rx="6" fill="#fff4e6"/>
            <rect x="84" y="159" width="12" height="22" rx="6" fill="#fff4e6"/>
            <rect x="113" y="156" width="12" height="24" rx="6" fill="#fff4e6"/>
            <rect x="132" y="159" width="12" height="22" rx="6" fill="#fff4e6"/>

            <ellipse cx="69" cy="182" rx="10" ry="6" fill="#ffd6a5"/>
            <ellipse cx="90" cy="183" rx="10" ry="6" fill="#ffd6a5"/>
            <ellipse cx="119" cy="182" rx="10" ry="6" fill="#ffd6a5"/>
            <ellipse cx="138" cy="183" rx="10" ry="6" fill="#ffd6a5"/>
          </g>
        </g>
      </g>
    </g>
  </g>

  <g opacity="0.25">
    <circle cx="120" cy="60" r="20" fill="#ffffff"/>
    <circle cx="145" cy="60" r="16" fill="#ffffff"/>
    <circle cx="168" cy="60" r="18" fill="#ffffff"/>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-100 0" dur="12s" repeatCount="indefinite"/>
  </g>

  <g opacity="0.2">
    <circle cx="520" cy="85" r="16" fill="#ffffff"/>
    <circle cx="540" cy="85" r="13" fill="#ffffff"/>
    <circle cx="560" cy="85" r="15" fill="#ffffff"/>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-140 0" dur="16s" repeatCount="indefinite"/>
  </g>
</svg>