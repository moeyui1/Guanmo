<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="三花猫滑着滑板从右到左">
  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="100%" height="100%" fill="#bfe3ff"/>
  <rect y="160" width="100%" height="80" fill="#9ecf7a"/>
  <line x1="0" y1="160" x2="900" y2="160" stroke="#6aa33a" stroke-width="3"/>

  <!-- invisible motion path for animateMotion (from right to left) -->
  <path id="motionPath" d="M880 130 L-280 130" fill="none" stroke="none"/>

  <!-- Cat + skateboard group (designed facing left) -->
  <g id="catAndBoard" filter="url(#shadow)">
    <!-- animate along path -->
    <animateMotion dur="8s" repeatCount="indefinite" rotate="0">
      <mpath xlink:href="#motionPath" />
    </animateMotion>

    <!-- slight bobbing -->
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="1.2s" repeatCount="indefinite" additive="sum"/>

    <!-- skateboard -->
    <g id="board" transform="translate(30,100)">
      <rect x="-10" y="20" rx="12" ry="12" width="160" height="20" fill="#59331f" stroke="#3b2314" stroke-width="3"/>
      <rect x="0" y="12" rx="8" ry="8" width="140" height="8" fill="#e0a15a"/>
      <!-- wheels (two) -->
      <g id="wheel1" transform="translate(20,50)">
        <circle cx="0" cy="0" r="9" fill="#111"/>
        <circle cx="0" cy="0" r="4" fill="#777"/>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="0.6s" repeatCount="indefinite"/>
      </g>
      <g id="wheel2" transform="translate(120,50)">
        <circle cx="0" cy="0" r="9" fill="#111"/>
        <circle cx="0" cy="0" r="4" fill="#777"/>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="0.6s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- cat body -->
    <g id="cat" transform="translate(20,30) scale(0.9)">
      <!-- tail -->
      <g id="tail" transform="translate(-10,50)">
        <path d="M0 20 C -10 10, -20 10, -28 4" fill="none" stroke="#2b2b2b" stroke-width="10" stroke-linecap="round"/>
        <path d="M0 20 C -8 13, -16 13, -24 7" fill="none" stroke="#f09b3b" stroke-width="6" stroke-linecap="round"/>
        <animateTransform attributeName="transform" type="rotate" values="0 0 30; -20 0 30; 20 0 30; 0 0 30" dur="0.8s" repeatCount="indefinite"/>
      </g>

      <!-- body -->
      <ellipse cx="100" cy="80" rx="56" ry="40" fill="#fff" stroke="#3b3b3b" stroke-width="2"/>
      <!-- calico patches -->
      <path d="M76 70 C64 62, 56 54, 58 46 C66 50, 74 56, 86 58 Z" fill="#f09b3b" opacity="0.95"/>
      <path d="M118 78 C132 74, 140 66, 138 56 C128 58, 122 66, 118 76 Z" fill="#2b2b2b"/>
      <path d="M92 90 C86 96, 78 100, 72 98 C78 94, 84 90, 92 90 Z" fill="#f09b3b" opacity="0.95"/>

      <!-- hind leg -->
      <ellipse cx="60" cy="110" rx="14" ry="10" fill="#fff" stroke="#3b3b3b" stroke-width="1.5"/>
      <ellipse cx="120" cy="110" rx="14" ry="10" fill="#fff" stroke="#3b3b3b" stroke-width="1.5"/>

      <!-- head -->
      <g id="head" transform="translate(30,20)">
        <ellipse cx="50" cy="36" rx="36" ry="34" fill="#fff" stroke="#3b3b3b" stroke-width="2"/>
        <!-- patches on head -->
        <path d="M36 18 C30 10, 22 8, 18 12 C24 16, 30 18, 36 21 Z" fill="#f09b3b"/>
        <path d="M68 26 C74 20, 82 18, 86 22 C82 24, 74 26, 68 30 Z" fill="#2b2b2b"/>
        <!-- ears -->
        <path d="M24 8 L12 -6 L32 6 Z" fill="#fff" stroke="#3b3b3b" stroke-width="1.5"/>
        <path d="M76 8 L88 -6 L68 6 Z" fill="#fff" stroke="#3b3b3b" stroke-width="1.5"/>
        <!-- inner ears -->
        <path d="M22 4 L18 -2 L30 4 Z" fill="#f6cfc1"/>
        <path d="M78 4 L82 -2 L70 4 Z" fill="#f6cfc1"/>

        <!-- eyes -->
        <g id="eyes">
          <ellipse cx="38" cy="36" rx="6" ry="8" fill="#333"/>
          <ellipse cx="62" cy="36" rx="6" ry="8" fill="#333"/>
          <!-- pupils -->
          <circle cx="38" cy="36" r="2.2" fill="#000"/>
          <circle cx="62" cy="36" r="2.2" fill="#000"/>
          <!-- blink animation: briefly close -->
          <rect x="32" y="32" width="12" height="8" fill="#fff" opacity="0">
            <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.6;0.62;1" dur="3.6s" repeatCount="indefinite"/>
          </rect>
          <rect x="56" y="32" width="12" height="8" fill="#fff" opacity="0">
            <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.6;0.62;1" dur="3.6s" repeatCount="indefinite"/>
          </rect>
        </g>

        <!-- nose and mouth -->
        <path d="M50 44 q4 4 0 6 q-4 -2 0 -6" fill="#f6cfc1" stroke="#7a4b3b" stroke-width="1"/>
        <path d="M46 50 q4 4 8 0" fill="none" stroke="#7a4b3b" stroke-width="1"/>

        <!-- front paw on board -->
        <g id="frontPaw" transform="translate(22,66)">
          <ellipse cx="10" cy="8" rx="10" ry="6" fill="#fff" stroke="#3b3b3b" stroke-width="1.2"/>
          <animateTransform attributeName="transform" type="translate" values="22,66; 18,68; 22,66" dur="0.6s" repeatCount="indefinite" additive="sum"/>
        </g>
      </g>
    </g>
  </g>
</svg>