<svg xmlns:xlink="http://www.w3.org/1999/xlink" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dff3ff"/>
      <stop offset="100%" stop-color="#f7fbff"/>
    </linearGradient>
    <linearGradient id="deckGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b3f46"/>
      <stop offset="100%" stop-color="#5a616c"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="800" height="300" fill="url(#bg)"/>
  <rect y="230" width="800" height="70" fill="#d7e3d1"/>
  <line x1="0" y1="230" x2="800" y2="230" stroke="#9bb58d" stroke-width="3"/>

  <!-- moving unit: skateboard + calico cat -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      from="860 0" to="-260 0" dur="6s" repeatCount="indefinite"/>

    <!-- skateboard -->
    <g transform="translate(0,0)">
      <rect x="90" y="190" rx="16" ry="16" width="170" height="20" fill="url(#deckGrad)"/>
      <rect x="105" y="206" width="12" height="8" rx="2" fill="#7b7f87"/>
      <rect x="233" y="206" width="12" height="8" rx="2" fill="#7b7f87"/>

      <g transform="translate(111,220)">
        <circle r="13" fill="#20242b"/>
        <circle r="5" fill="#9aa3b2"/>
        <line x1="0" y1="-11" x2="0" y2="11" stroke="#6b7280" stroke-width="2"/>
        <line x1="-11" y1="0" x2="11" y2="0" stroke="#6b7280" stroke-width="2"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="-720" dur="1s" repeatCount="indefinite"/>
      </g>
      <g transform="translate(239,220)">
        <circle r="13" fill="#20242b"/>
        <circle r="5" fill="#9aa3b2"/>
        <line x1="0" y1="-11" x2="0" y2="11" stroke="#6b7280" stroke-width="2"/>
        <line x1="-11" y1="0" x2="11" y2="0" stroke="#6b7280" stroke-width="2"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="-720" dur="1s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- cat -->
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -4; 0 0; 0 -2; 0 0" dur="0.9s" repeatCount="indefinite"/>

      <!-- tail -->
      <path d="M86,152 C56,140 56,110 83,103"
            fill="none" stroke="#f3efe7" stroke-width="10" stroke-linecap="round"/>
      <path d="M86,152 C58,142 58,116 86,108"
            fill="none" stroke="#2f2a26" stroke-width="4" stroke-linecap="round">
        <animate attributeName="d"
          values="M86,152 C58,142 58,116 86,108;
                  M86,152 C54,136 60,108 90,102;
                  M86,152 C58,142 58,116 86,108"
          dur="0.7s" repeatCount="indefinite"/>
      </path>

      <!-- body -->
      <ellipse cx="160" cy="150" rx="70" ry="45" fill="#f7f4ed" stroke="#2d2a26" stroke-width="3"/>
      <!-- calico spots -->
      <ellipse cx="138" cy="145" rx="20" ry="14" fill="#d58a3a"/>
      <ellipse cx="178" cy="163" rx="18" ry="12" fill="#2d2a26"/>
      <ellipse cx="168" cy="132" rx="16" ry="10" fill="#d58a3a"/>

      <!-- legs -->
      <ellipse cx="128" cy="187" rx="10" ry="12" fill="#f7f4ed" stroke="#2d2a26" stroke-width="2"/>
      <ellipse cx="154" cy="189" rx="10" ry="12" fill="#f7f4ed" stroke="#2d2a26" stroke-width="2"/>
      <ellipse cx="180" cy="189" rx="10" ry="12" fill="#f7f4ed" stroke="#2d2a26" stroke-width="2"/>
      <ellipse cx="206" cy="187" rx="10" ry="12" fill="#f7f4ed" stroke="#2d2a26" stroke-width="2"/>

      <!-- head -->
      <circle cx="228" cy="126" r="34" fill="#f7f4ed" stroke="#2d2a26" stroke-width="3"/>
      <path d="M203,103 L214,80 L224,104 Z" fill="#f7f4ed" stroke="#2d2a26" stroke-width="3"/>
      <path d="M232,104 L244,81 L253,106 Z" fill="#f7f4ed" stroke="#2d2a26" stroke-width="3"/>
      <path d="M209,101 L214,89 L219,102 Z" fill="#f2b7c5"/>
      <path d="M236,103 L242,90 L246,104 Z" fill="#f2b7c5"/>

      <!-- face spots -->
      <ellipse cx="216" cy="122" rx="10" ry="8" fill="#2d2a26"/>
      <ellipse cx="239" cy="134" rx="12" ry="9" fill="#d58a3a"/>

      <!-- eyes -->
      <ellipse cx="219" cy="126" rx="4" ry="6" fill="#222"/>
      <ellipse cx="238" cy="126" rx="4" ry="6" fill="#222"/>
      <animate xlink:href="#blinkL" attributeName="ry" values="6;6;1;6;6" dur="2.8s" repeatCount="indefinite"/>
      <animate xlink:href="#blinkR" attributeName="ry" values="6;6;1;6;6" dur="2.8s" repeatCount="indefinite"/>

      <!-- blink overlays -->
      <ellipse id="blinkL" cx="219" cy="126" rx="4" ry="6" fill="#222" opacity="0"/>
      <ellipse id="blinkR" cx="238" cy="126" rx="4" ry="6" fill="#222" opacity="0"/>

      <!-- nose + mouth -->
      <path d="M227,135 L231,135 L229,139 Z" fill="#d98995"/>
      <path d="M229,139 C225,142 224,145 226,147" fill="none" stroke="#2d2a26" stroke-width="2" stroke-linecap="round"/>
      <path d="M229,139 C233,142 234,145 232,147" fill="none" stroke="#2d2a26" stroke-width="2" stroke-linecap="round"/>

      <!-- whiskers -->
      <g stroke="#2d2a26" stroke-width="2" stroke-linecap="round">
        <line x1="206" y1="136" x2="186" y2="131"/>
        <line x1="206" y1="142" x2="185" y2="142"/>
        <line x1="206" y1="148" x2="187" y2="153"/>
        <line x1="252" y1="136" x2="271" y2="131"/>
        <line x1="252" y1="142" x2="273" y2="142"/>
        <line x1="252" y1="148" x2="271" y2="153"/>
      </g>
    </g>

    <!-- motion streaks -->
    <g stroke="#b8c8d6" stroke-width="3" stroke-linecap="round" opacity="0.7">
      <line x1="280" y1="155" x2="320" y2="155">
        <animate attributeName="x1" values="280;260;280" dur="0.5s" repeatCount="indefinite"/>
        <animate attributeName="x2" values="320;300;320" dur="0.5s" repeatCount="indefinite"/>
      </line>
      <line x1="290" y1="172" x2="340" y2="172">
        <animate attributeName="x1" values="290;265;290" dur="0.6s" repeatCount="indefinite"/>
        <animate attributeName="x2" values="340;315;340" dur="0.6s" repeatCount="indefinite"/>
      </line>
    </g>
  </g>
</svg>