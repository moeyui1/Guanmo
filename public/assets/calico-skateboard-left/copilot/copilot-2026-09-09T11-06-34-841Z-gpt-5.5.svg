<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-label="三花猫滑着滑板从右到左前进">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfe9ff"/>
      <stop offset="100%" stop-color="#f7fbff"/>
    </linearGradient>

    <style>
      .rider {
        animation: moveLeft 6s linear infinite;
        transform-box: fill-box;
      }

      .cat {
        animation: bob 0.45s ease-in-out infinite alternate;
        transform-origin: 90px 175px;
      }

      .tail {
        animation: tailWave 0.8s ease-in-out infinite alternate;
        transform-origin: 50px 145px;
      }

      .wheel {
        animation: spin 0.45s linear infinite;
        transform-box: fill-box;
        transform-origin: center;
      }

      .dash {
        animation: roadMove 1.2s linear infinite;
      }

      @keyframes moveLeft {
        from { transform: translateX(880px); }
        to { transform: translateX(-260px); }
      }

      @keyframes bob {
        from { transform: translateY(0); }
        to { transform: translateY(-7px); }
      }

      @keyframes tailWave {
        from { transform: rotate(-8deg); }
        to { transform: rotate(12deg); }
      }

      @keyframes spin {
        to { transform: rotate(-360deg); }
      }

      @keyframes roadMove {
        from { transform: translateX(0); }
        to { transform: translateX(-120px); }
      }
    </style>
  </defs>

  <rect width="800" height="360" fill="url(#sky)"/>

  <circle cx="95" cy="70" r="32" fill="#ffd86b" opacity="0.95"/>
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="610" cy="80" rx="46" ry="16"/>
    <ellipse cx="650" cy="77" rx="35" ry="13"/>
    <ellipse cx="180" cy="105" rx="42" ry="14"/>
    <ellipse cx="220" cy="101" rx="30" ry="12"/>
  </g>

  <rect y="255" width="800" height="105" fill="#5e6772"/>
  <rect y="255" width="800" height="7" fill="#424a53"/>
  <g class="dash" fill="#f5e66a">
    <rect x="20" y="305" width="70" height="8" rx="4"/>
    <rect x="140" y="305" width="70" height="8" rx="4"/>
    <rect x="260" y="305" width="70" height="8" rx="4"/>
    <rect x="380" y="305" width="70" height="8" rx="4"/>
    <rect x="500" y="305" width="70" height="8" rx="4"/>
    <rect x="620" y="305" width="70" height="8" rx="4"/>
    <rect x="740" y="305" width="70" height="8" rx="4"/>
    <rect x="860" y="305" width="70" height="8" rx="4"/>
  </g>

  <g class="rider">
    <g transform="translate(0 42)">
      <g class="cat">
        <path class="tail" d="M55 145 C15 120, 15 88, 52 78 C73 72, 81 94, 62 103 C44 111, 45 130, 72 136"
              fill="none" stroke="#111318" stroke-width="18" stroke-linecap="round"/>
        <path d="M58 146 C22 122, 18 94, 52 83" fill="none" stroke="#f29a38" stroke-width="10" stroke-linecap="round"/>

        <ellipse cx="105" cy="165" rx="58" ry="38" fill="#fff7ec"/>
        <path d="M72 141 C87 115, 126 118, 142 143 C125 134, 91 132, 72 141Z" fill="#f29a38"/>
        <path d="M105 128 C132 127, 159 144, 159 169 C141 153, 117 143, 96 149Z" fill="#111318"/>
        <path d="M63 166 C77 178, 103 179, 115 164 C103 191, 73 190, 63 166Z" fill="#f29a38" opacity="0.95"/>

        <circle cx="122" cy="105" r="40" fill="#fff7ec"/>
        <path d="M88 85 L76 46 L111 68Z" fill="#fff7ec"/>
        <path d="M154 82 L167 44 L132 66Z" fill="#fff7ec"/>
        <path d="M87 82 L79 56 L102 69Z" fill="#f6a6a6"/>
        <path d="M153 79 L162 55 L140 68Z" fill="#f6a6a6"/>

        <path d="M93 73 C105 58, 128 59, 137 75 C124 67, 105 68, 93 73Z" fill="#111318"/>
        <path d="M132 75 C146 77, 157 89, 158 104 C146 98, 136 90, 132 75Z" fill="#f29a38"/>
        <path d="M91 108 C80 107, 72 100, 70 90 C81 93, 89 99, 91 108Z" fill="#f29a38"/>

        <circle cx="108" cy="104" r="4.8" fill="#18202a"/>
        <circle cx="137" cy="104" r="4.8" fill="#18202a"/>
        <circle cx="109.5" cy="102.5" r="1.5" fill="#fff"/>
        <circle cx="138.5" cy="102.5" r="1.5" fill="#fff"/>
        <path d="M122 113 L116 121 L128 121Z" fill="#e87986"/>
        <path d="M122 121 C116 130, 105 130, 99 123" fill="none" stroke="#26313c" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M122 121 C128 130, 139 130, 145 123" fill="none" stroke="#26313c" stroke-width="2.5" stroke-linecap="round"/>

        <g stroke="#26313c" stroke-width="2" stroke-linecap="round" opacity="0.8">
          <path d="M91 115 L58 106"/>
          <path d="M91 122 L57 123"/>
          <path d="M151 115 L184 106"/>
          <path d="M151 122 L185 123"/>
        </g>

        <path d="M73 191 C68 213, 60 225, 45 228" fill="none" stroke="#fff7ec" stroke-width="13" stroke-linecap="round"/>
        <path d="M122 198 C123 220, 133 230, 149 231" fill="none" stroke="#fff7ec" stroke-width="13" stroke-linecap="round"/>
        <path d="M142 189 C154 208, 171 214, 184 207" fill="none" stroke="#f29a38" stroke-width="13" stroke-linecap="round"/>
        <path d="M92 194 C88 213, 93 226, 107 232" fill="none" stroke="#111318" stroke-width="13" stroke-linecap="round"/>
      </g>

      <g transform="translate(22 222)">
        <path d="M8 25 C48 44, 162 44, 216 25 C222 23, 222 13, 214 14 C150 24, 79 24, 12 14 C4 13, 2 22, 8 25Z"
              fill="#38a3d1"/>
        <path d="M24 23 C82 34, 145 34, 202 23" fill="none" stroke="#186a8b" stroke-width="4" stroke-linecap="round"/>

        <g class="wheel">
          <circle cx="55" cy="47" r="18" fill="#20262e"/>
          <circle cx="55" cy="47" r="8" fill="#8bd8ff"/>
          <path d="M55 29 V65 M37 47 H73" stroke="#dff6ff" stroke-width="3" stroke-linecap="round"/>
        </g>

        <g class="wheel">
          <circle cx="172" cy="47" r="18" fill="#20262e"/>
          <circle cx="172" cy="47" r="8" fill="#8bd8ff"/>
          <path d="M172 29 V65 M154 47 H190" stroke="#dff6ff" stroke-width="3" stroke-linecap="round"/>
        </g>
      </g>
    </g>
  </g>

  <g opacity="0.28" fill="#ffffff">
    <circle cx="730" cy="285" r="3"/>
    <circle cx="745" cy="291" r="2"/>
    <circle cx="760" cy="282" r="2.5"/>
  </g>
</svg>