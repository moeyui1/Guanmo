<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9ad8ff"/>
      <stop offset="100%" stop-color="#eaf6ff"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6b3e26"/>
      <stop offset="50%" stop-color="#a86a3a"/>
      <stop offset="100%" stop-color="#6b3e26"/>
    </linearGradient>
  </defs>

  <rect width="640" height="280" fill="url(#sky)"/>
  <ellipse cx="520" cy="48" rx="42" ry="18" fill="#fff" opacity=".85"/>
  <ellipse cx="548" cy="48" rx="28" ry="14" fill="#fff" opacity=".85"/>
  <rect x="0" y="210" width="640" height="70" fill="#7ec850"/>
  <rect x="0" y="208" width="640" height="8" fill="#6aa83f"/>

  <g>
    <animateTransform attributeName="transform" type="translate" values="720 0; -220 0" dur="3.2s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="0.28s" repeatCount="indefinite"/>

      <!-- skateboard -->
      <ellipse cx="118" cy="198" rx="14" ry="14" fill="#222"/>
      <ellipse cx="118" cy="198" rx="6" ry="6" fill="#bbb"/>
      <ellipse cx="202" cy="198" rx="14" ry="14" fill="#222"/>
      <ellipse cx="202" cy="198" rx="6" ry="6" fill="#bbb"/>
      <path d="M78 186 C88 176 232 176 242 186 C236 196 84 196 78 186Z" fill="url(#deck)"/>
      <rect x="96" y="182" width="128" height="6" rx="3" fill="#2b2b2b"/>

      <!-- tail -->
      <path d="M232 128 C268 118 278 92 258 78" fill="none" stroke="#f4a04a" stroke-width="14" stroke-linecap="round">
        <animate attributeName="d" values="M232 128 C268 118 278 92 258 78; M232 128 C270 132 286 108 270 90; M232 128 C268 118 278 92 258 78" dur="0.4s" repeatCount="indefinite"/>
      </path>
      <path d="M250 96 C262 90 268 82 260 74" fill="none" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round"/>

      <!-- body -->
      <ellipse cx="168" cy="148" rx="58" ry="36" fill="#fff8f0"/>
      <ellipse cx="138" cy="142" rx="22" ry="18" fill="#f4a04a"/>
      <ellipse cx="186" cy="156" rx="18" ry="14" fill="#1a1a1a"/>
      <ellipse cx="168" cy="168" rx="30" ry="12" fill="#fff"/>

      <!-- hind legs -->
      <ellipse cx="210" cy="176" rx="12" ry="16" fill="#fff8f0"/>
      <ellipse cx="208" cy="188" rx="10" ry="8" fill="#f4a04a"/>
      <ellipse cx="188" cy="178" rx="11" ry="15" fill="#1a1a1a"/>
      <ellipse cx="186" cy="190" rx="9" ry="7" fill="#222"/>

      <!-- front legs -->
      <ellipse cx="132" cy="176" rx="11" ry="16" fill="#fff8f0"/>
      <ellipse cx="128" cy="190" rx="10" ry="7" fill="#f4a04a"/>
      <ellipse cx="150" cy="178" rx="10" ry="15" fill="#fff8f0"/>
      <ellipse cx="148" cy="190" rx="9" ry="7" fill="#1a1a1a"/>

      <!-- head -->
      <g transform="translate(108,118) scale(-1,1) translate(-108,-118)">
        <polygon points="78,92 88,68 102,90" fill="#f4a04a"/>
        <polygon points="84,88 88,74 96,88" fill="#ffb6c8"/>
        <polygon points="128,92 140,66 152,94" fill="#1a1a1a"/>
        <polygon points="134,90 140,74 146,90" fill="#ffb6c8"/>
        <ellipse cx="114" cy="108" rx="38" ry="32" fill="#fff8f0"/>
        <ellipse cx="96" cy="100" rx="16" ry="14" fill="#f4a04a"/>
        <ellipse cx="132" cy="98" rx="14" ry="12" fill="#1a1a1a"/>
        <ellipse cx="102" cy="108" rx="6" ry="7" fill="#2d2d2d"/>
        <ellipse cx="126" cy="108" rx="6" ry="7" fill="#2d2d2d"/>
        <circle cx="104" cy="106" r="2" fill="#fff"/>
        <circle cx="128" cy="106" r="2" fill="#fff"/>
        <ellipse cx="114" cy="120" rx="5" ry="3.5" fill="#f28ca8"/>
        <path d="M114 123 Q108 130 102 128" fill="none" stroke="#444" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M114 123 Q120 130 126 128" fill="none" stroke="#444" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M86 118 H72 M86 124 H70 M86 112 H74" stroke="#555" stroke-width="1.2"/>
        <path d="M142 118 H156 M142 124 H158 M142 112 H154" stroke="#555" stroke-width="1.2"/>
      </g>
    </g>
  </g>
</svg>