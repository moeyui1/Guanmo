<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">三花猫滑着滑板从右向左前进</title>
  <desc id="desc">一只三花猫站在滑板上，从画面右侧滑向左侧，尾巴摆动，轮子旋转。</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed8ff"/>
      <stop offset="1" stop-color="#e9f8ff"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#80909c"/>
      <stop offset="1" stop-color="#56636d"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5576"/>
      <stop offset=".5" stop-color="#ffb534"/>
      <stop offset="1" stop-color="#51c9bc"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <clipPath id="bodyClip">
      <ellipse cx="173" cy="230" rx="80" ry="55"/>
    </clipPath>
    <clipPath id="headClip">
      <circle cx="89" cy="181" r="48"/>
    </clipPath>
  </defs>

  <style>
    .scene {
      animation: travel 7s linear infinite;
    }
    .rider {
      animation: bob .42s ease-in-out infinite alternate;
      transform-origin: 150px 300px;
    }
    .tail {
      animation: tail-sway .8s ease-in-out infinite alternate;
      transform-origin: 236px 218px;
    }
    .front-paw {
      animation: paw .42s ease-in-out infinite alternate;
      transform-origin: 111px 260px;
    }
    .back-paw {
      animation: paw .42s ease-in-out infinite alternate-reverse;
      transform-origin: 207px 267px;
    }
    .ear {
      animation: ear-twitch 2.5s ease-in-out infinite;
      transform-origin: 59px 144px;
    }
    .eye {
      animation: blink 3.4s infinite;
      transform-origin: center;
    }
    .wheel {
      animation: wheel-spin .42s linear infinite;
      transform-box: fill-box;
      transform-origin: center;
    }
    .dash {
      animation: dash 1.1s linear infinite;
    }
    .dash:nth-of-type(2) { animation-delay: -.35s; }
    .dash:nth-of-type(3) { animation-delay: -.7s; }

    @keyframes travel {
      from { transform: translateX(790px); }
      to   { transform: translateX(-330px); }
    }
    @keyframes bob {
      from { transform: translateY(0) rotate(-1deg); }
      to   { transform: translateY(-5px) rotate(1deg); }
    }
    @keyframes tail-sway {
      from { transform: rotate(-9deg); }
      to   { transform: rotate(10deg); }
    }
    @keyframes paw {
      from { transform: rotate(-4deg); }
      to   { transform: rotate(5deg); }
    }
    @keyframes ear-twitch {
      0%, 87%, 100% { transform: rotate(0); }
      91% { transform: rotate(-8deg); }
      95% { transform: rotate(4deg); }
    }
    @keyframes blink {
      0%, 44%, 50%, 100% { transform: scaleY(1); }
      47% { transform: scaleY(.08); }
    }
    @keyframes wheel-spin {
      to { transform: rotate(-360deg); }
    }
    @keyframes dash {
      from { transform: translateX(180px); opacity: 0; }
      20%, 75% { opacity: .75; }
      to { transform: translateX(-220px); opacity: 0; }
    }
  </style>

  <!-- Background -->
  <rect width="960" height="540" fill="url(#sky)"/>
  <circle cx="794" cy="91" r="46" fill="#fff2a8" opacity=".9"/>

  <g fill="#fff" opacity=".78">
    <ellipse cx="155" cy="102" rx="61" ry="24"/>
    <ellipse cx="106" cy="111" rx="40" ry="18"/>
    <ellipse cx="202" cy="111" rx="43" ry="17"/>
    <ellipse cx="579" cy="76" rx="54" ry="20"/>
    <ellipse cx="624" cy="85" rx="37" ry="15"/>
  </g>

  <path d="M0 327 Q92 276 183 327 T367 327 T551 327 T735 327 T960 327 V430 H0Z"
        fill="#91c979"/>
  <path d="M0 357 Q115 311 228 357 T456 357 T684 357 T960 357 V430 H0Z"
        fill="#68ab67"/>

  <rect y="400" width="960" height="140" fill="url(#ground)"/>
  <rect y="400" width="960" height="8" fill="#e9edf0"/>
  <path d="M0 493 H960" stroke="#dce2e6" stroke-width="6" stroke-dasharray="72 58" opacity=".75"/>

  <!-- Moving road accents -->
  <g stroke="#eff5f7" stroke-width="5" stroke-linecap="round" opacity=".55">
    <path class="dash" d="M720 448h115"/>
    <path class="dash" d="M870 476h76"/>
    <path class="dash" d="M650 511h92"/>
  </g>

  <!-- Cat and skateboard -->
  <g class="scene">
    <ellipse cx="155" cy="383" rx="137" ry="18" fill="#273139" opacity=".27" filter="url(#shadow)"/>

    <g class="rider">
      <!-- Tail -->
      <g class="tail">
        <path d="M226 224 C285 198 306 142 267 126 C239 114 227 142 249 154 C266 164 271 144 259 139"
              fill="none" stroke="#fff7e8" stroke-width="25" stroke-linecap="round"/>
        <path d="M269 188 C283 172 288 151 274 139"
              fill="none" stroke="#ef8b2f" stroke-width="25" stroke-linecap="butt"/>
        <path d="M281 153 C281 144 277 136 267 131"
              fill="none" stroke="#3e3939" stroke-width="24" stroke-linecap="round"/>
      </g>

      <!-- Body -->
      <ellipse cx="173" cy="230" rx="80" ry="55" fill="#fff7e8" stroke="#3e3939" stroke-width="5"/>
      <g clip-path="url(#bodyClip)">
        <path d="M137 168 C158 178 168 199 157 222 C143 244 114 236 103 216 L103 174Z"
              fill="#ef8b2f"/>
        <path d="M191 170 C227 164 259 184 263 217 C239 232 213 224 202 204Z"
              fill="#3e3939"/>
        <path d="M172 239 C190 221 221 226 235 257 L216 285 H169Z"
              fill="#ef8b2f"/>
        <path d="M124 258 C140 241 161 244 171 273 L138 287Z"
              fill="#3e3939"/>
      </g>

      <!-- Legs -->
      <g class="front-paw">
        <path d="M121 251 C118 276 108 301 94 320 C88 329 96 339 108 336 L139 327"
              fill="#fff7e8" stroke="#3e3939" stroke-width="5" stroke-linecap="round"/>
        <path d="M94 320 C88 329 96 339 108 336 L139 327"
              fill="#ef8b2f" stroke="#3e3939" stroke-width="5" stroke-linejoin="round"/>
      </g>
      <g class="back-paw">
        <path d="M209 263 C211 286 219 305 235 322 C243 331 237 341 224 338 L191 330"
              fill="#fff7e8" stroke="#3e3939" stroke-width="5" stroke-linecap="round"/>
        <path d="M235 322 C243 331 237 341 224 338 L191 330"
              fill="#3e3939" stroke="#3e3939" stroke-width="5" stroke-linejoin="round"/>
      </g>

      <!-- Head -->
      <circle cx="89" cy="181" r="48" fill="#fff7e8" stroke="#3e3939" stroke-width="5"/>

      <!-- Ears -->
      <g class="ear">
        <path d="M48 151 L52 105 L80 139Z" fill="#ef8b2f" stroke="#3e3939" stroke-width="5" stroke-linejoin="round"/>
        <path d="M56 139 L58 120 L70 138Z" fill="#f8a7a7"/>
      </g>
      <path d="M92 137 L119 108 L126 155Z" fill="#3e3939" stroke="#3e3939" stroke-width="5" stroke-linejoin="round"/>
      <path d="M104 140 L116 123 L119 145Z" fill="#f8a7a7"/>

      <!-- Head markings -->
      <g clip-path="url(#headClip)">
        <path d="M54 132 C71 119 93 126 98 145 C93 160 79 165 63 157Z" fill="#ef8b2f"/>
        <path d="M95 132 C116 124 139 139 141 158 C126 170 111 167 99 156Z" fill="#3e3939"/>
        <path d="M113 192 C134 186 147 200 141 223 L115 230Z" fill="#ef8b2f"/>
      </g>

      <!-- Face -->
      <g class="eye">
        <ellipse cx="70" cy="178" rx="6" ry="9" fill="#29343a"/>
        <ellipse cx="106" cy="178" rx="6" ry="9" fill="#29343a"/>
        <circle cx="68" cy="175" r="2" fill="#fff"/>
        <circle cx="104" cy="175" r="2" fill="#fff"/>
      </g>
      <path d="M84 191 Q89 196 94 191 Q89 187 84 191Z" fill="#df777b"/>
      <path d="M89 195 Q87 204 78 202 M89 195 Q92 204 101 201"
            fill="none" stroke="#3e3939" stroke-width="2.5" stroke-linecap="round"/>
      <g stroke="#3e3939" stroke-width="2" stroke-linecap="round">
        <path d="M76 194 L42 188"/>
        <path d="M76 200 L40 203"/>
        <path d="M102 194 L132 186"/>
        <path d="M102 200 L134 204"/>
      </g>

      <!-- Scarf -->
      <path d="M112 215 Q136 218 148 208" fill="none" stroke="#36a9e1" stroke-width="10" stroke-linecap="round"/>
      <path d="M139 214 Q157 231 150 252 L137 236Z" fill="#36a9e1" stroke="#277fad" stroke-width="3"/>
    </g>

    <!-- Skateboard deck -->
    <path d="M40 338 Q49 356 72 355 H238 Q264 355 273 337"
          fill="none" stroke="#3e3939" stroke-width="18" stroke-linecap="round"/>
    <path d="M40 334 Q49 350 72 349 H238 Q264 349 273 333"
          fill="none" stroke="url(#deck)" stroke-width="12" stroke-linecap="round"/>

    <!-- Trucks -->
    <g stroke="#40484d" stroke-width="6" stroke-linecap="round">
      <path d="M88 352 V365 M73 365 H103"/>
      <path d="M222 352 V365 M207 365 H237"/>
    </g>

    <!-- Wheels -->
    <g class="wheel">
      <circle cx="78" cy="371" r="17" fill="#273139"/>
      <circle cx="78" cy="371" r="10" fill="#5fe0d0"/>
      <path d="M78 361v20M68 371h20M71 364l14 14M85 364l-14 14"
            stroke="#273139" stroke-width="2"/>
      <circle cx="78" cy="371" r="3" fill="#f4f7f8"/>
    </g>
    <g class="wheel">
      <circle cx="228" cy="371" r="17" fill="#273139"/>
      <circle cx="228" cy="371" r="10" fill="#ffca4b"/>
      <path d="M228 361v20M218 371h20M221 364l14 14M235 364l-14 14"
            stroke="#273139" stroke-width="2"/>
      <circle cx="228" cy="371" r="3" fill="#f4f7f8"/>
    </g>

    <!-- Speed lines trailing behind the cat -->
    <g stroke="#fff" stroke-linecap="round" opacity=".8">
      <path d="M300 245h74" stroke-width="6"/>
      <path d="M322 274h91" stroke-width="4"/>
      <path d="M295 304h53" stroke-width="5"/>
    </g>
  </g>
</svg>