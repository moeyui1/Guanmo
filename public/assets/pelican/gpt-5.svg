<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#74c3ff"/>
      <stop offset="60%" stop-color="#bfe7ff"/>
      <stop offset="100%" stop-color="#e8fbff"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fc36d"/>
      <stop offset="100%" stop-color="#4b8c4f"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#444"/>
      <stop offset="100%" stop-color="#222"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff59d"/>
      <stop offset="70%" stop-color="#ffd95a"/>
      <stop offset="100%" stop-color="#ffb300"/>
    </radialGradient>
    <style>
      .wheel { fill:#111; stroke:#111; }
      .tire { fill:none; stroke:#111; stroke-width:10; }
      .rim { fill:none; stroke:#bbb; stroke-width:6; }
      .spokes line { stroke:#9aa5ad; stroke-width:3; }
      .frame { fill:none; stroke:#2a3a4b; stroke-width:10; stroke-linecap:round; stroke-linejoin:round; }
      .chainring { fill:#4a5969; stroke:#2a3a4b; stroke-width:4; }
      .crank { stroke:#2a3a4b; stroke-width:8; stroke-linecap:round; }
      .pedal { fill:#2a3a4b; }
      .seat { fill:#1f2a35; }
      .handle { fill:none; stroke:#2a3a4b; stroke-width:8; stroke-linecap:round; }
      .pelican-body { fill:#f3f6f9; stroke:#cfd6dd; stroke-width:3; }
      .pelican-gray { fill:#dfe5ea; }
      .pelican-beak { fill:#f6a63a; stroke:#d9821a; stroke-width:3; }
      .pelican-eye { fill:#fff; stroke:#000; stroke-width:2; }
      .pupil { fill:#000; }
      .wing { fill:#e6edf3; stroke:#c7d1da; stroke-width:3; }
      .leg { fill:#f3a344; stroke:#d9821a; stroke-width:3; }
      .toe { fill:#f6b25b; }
      .cloud { fill:#ffffff; opacity:0.9; }
      .bush { fill:#5aa25d; }
      .dash { stroke:#f8f8f8; stroke-width:8; stroke-linecap:round; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="url(#sky)"/>
  <circle cx="840" cy="90" r="60" fill="url(#sun)" opacity="0.9"/>
  <!-- Distant hills -->
  <g opacity="0.5">
    <path d="M0,330 C120,280 220,300 320,330 S520,380 640,330 840,290 960,330 L960,540 H0Z" fill="#82c08f"/>
  </g>

  <!-- Moving clouds -->
  <g>
    <g class="cloud" transform="translate(-200,60)">
      <ellipse cx="80" cy="40" rx="50" ry="30"/>
      <ellipse cx="120" cy="45" rx="40" ry="25"/>
      <ellipse cx="40" cy="50" rx="35" ry="22"/>
      <animateTransform attributeName="transform" type="translate" from="-200,60" to="1160,60" dur="8s" repeatCount="indefinite"/>
    </g>
    <g class="cloud" transform="translate(-400,120)" opacity="0.8">
      <ellipse cx="80" cy="40" rx="45" ry="28"/>
      <ellipse cx="120" cy="45" rx="35" ry="22"/>
      <ellipse cx="40" cy="50" rx="30" ry="20"/>
      <animateTransform attributeName="transform" type="translate" from="-400,120" to="960,120" dur="8s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Ground and road -->
  <rect y="360" width="960" height="180" fill="url(#ground)"/>
  <g>
    <rect y="410" width="960" height="80" fill="url(#road)" opacity="0.92"/>
    <!-- Center dashed line moving -->
    <g transform="translate(0,450)">
      <g>
        <line x1="-200" y1="0" x2="1160" y2="0" class="dash" stroke-dasharray="40 40">
          <animate attributeName="stroke-dashoffset" from="0" to="-320" dur="8s" repeatCount="indefinite"/>
        </line>
      </g>
    </g>
    <!-- roadside bushes moving slower for parallax -->
    <g opacity="0.7">
      <g class="bush" transform="translate(0,430)">
        <path d="M-200,70 q30,-40 60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t60,0 V110 H-200Z"/>
        <animateTransform attributeName="transform" type="translate" from="0,430" to="-320,430" dur="8s" repeatCount="indefinite"/>
      </g>
    </g>
  </g>

  <!-- Bicycle + Pelican group -->
  <g id="scene" transform="translate(0,0)">
    <!-- subtle bobbing for life -->
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-4; 0,0; 0,4; 0,0" keyTimes="0;0.25;0.5;0.75;1" dur="8s" repeatCount="indefinite"/>
    <!-- Bicycle -->
    <g id="bike">
      <!-- Wheels -->
      <g id="rearWheel" transform="translate(320,380)">
        <circle r="84" class="tire"/>
        <circle r="70" class="rim"/>
        <g class="spokes">
          <line x1="0" y1="-70" x2="0" y2="70"/>
          <line x1="-70" y1="0" x2="70" y2="0"/>
          <line x1="-50" y1="-50" x2="50" y2="50"/>
          <line x1="-50" y1="50" x2="50" y2="-50"/>
          <line x1="-20" y1="-67" x2="20" y2="67"/>
          <line x1="-67" y1="-20" x2="67" y2="20"/>
        </g>
        <circle r="8" fill="#2a3a4b"/>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="8s" repeatCount="indefinite"/>
      </g>
      <g id="frontWheel" transform="translate(640,380)">
        <circle r="84" class="tire"/>
        <circle r="70" class="rim"/>
        <g class="spokes">
          <line x1="0" y1="-70" x2="0" y2="70"/>
          <line x1="-70" y1="0" x2="70" y2="0"/>
          <line x1="-50" y1="-50" x2="50" y2="50"/>
          <line x1="-50" y1="50" x2="50" y2="-50"/>
          <line x1="-20" y1="-67" x2="20" y2="67"/>
          <line x1="-67" y1="-20" x2="67" y2="20"/>
        </g>
        <circle r="8" fill="#2a3a4b"/>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="8s" repeatCount="indefinite"/>
      </g>

      <!-- Frame -->
      <g class="frame">
        <!-- main triangles -->
        <path d="M320,380 L460,300 L640,380"/>
        <path d="M460,300 L520,380"/>
        <path d="M320,380 L520,380"/>
        <path d="M640,380 L600,300"/>
        <!-- seat stay and chain stay -->
        <path d="M320,380 L460,300"/>
        <path d="M320,380 L520,380"/>
      </g>

      <!-- Seat and handlebar -->
      <rect x="448" y="282" width="40" height="8" rx="4" class="seat"/>
      <path d="M600,300 Q640,270 660,270" class="handle"/>
      <circle cx="660" cy="270" r="6" fill="#2a3a4b"/>

      <!-- Chainring and cranks -->
      <g id="crankset" transform="translate(520,380)">
        <circle r="18" class="chainring"/>
        <circle r="34" fill="none" stroke="#4a5969" stroke-width="5" stroke-dasharray="6 8"/>
        <g id="cranks">
          <g id="crankRot" transform="rotate(0)">
            <line x1="0" y1="0" x2="60" y2="0" class="crank"/>
            <line x1="0" y1="0" x2="-60" y2="0" class="crank"/>
            <!-- right pedal -->
            <g class="pedal" transform="translate(70,0)">
              <rect x="-10" y="-4" width="20" height="8" rx="3" fill="#2a3a4b"/>
              <!-- right foot -->
              <g class="leg">
                <path d="M-10,-2 q18,6 36,6 q18,0 32,-6 q-8,10 -32,12 q-22,2 -36,-12Z" class="toe"/>
              </g>
            </g>
            <!-- left pedal -->
            <g class="pedal" transform="translate(-70,0)">
              <rect x="-10" y="-4" width="20" height="8" rx="3" fill="#2a3a4b"/>
              <!-- left foot -->
              <g class="leg">
                <path d="M-10,-2 q18,6 36,6 q18,0 32,-6 q-8,10 -32,12 q-22,2 -36,-12Z" class="toe"/>
              </g>
            </g>
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
          </g>
        </g>
      </g>
    </g>

    <!-- Pelican -->
    <g id="pelican" transform="translate(470,260)">
      <!-- gentle up-down to match scene bob slightly -->
      <animateTransform attributeName="transform" type="translate" values="470,260; 470,256; 470,260; 470,264; 470,260" keyTimes="0;0.25;0.5;0.75;1" dur="8s" repeatCount="indefinite"/>
      <!-- tail -->
      <path d="M-70,70 q-26,4 -40,24 q22,-6 44,6 q6,-12  -4,-30Z" class="pelican-gray"/>
      <!-- body -->
      <ellipse cx="-20" cy="60" rx="70" ry="45" class="pelican-body"/>
      <!-- wing -->
      <path d="M-50,55 q-20,20 -8,40 q30,14 60,0 q8,-24 -18,-42 q-12,8 -34,2Z" class="wing">
        <animate attributeName="d" dur="2s" repeatCount="indefinite"
                 values="M-50,55 q-20,20 -8,40 q30,14 60,0 q8,-24 -18,-42 q-12,8 -34,2Z;
                         M-50,55 q-24,10 -16,34 q30,18 60,4 q10,-18 -14,-38 q-12,8 -30,0Z;
                         M-50,55 q-20,20 -8,40 q30,14 60,0 q8,-24 -18,-42 q-12,8 -34,2Z"/>
      </path>
      <!-- neck -->
      <path d="M-10,40 q20,-30 60,-30 q24,0 40,16 q-10,10 -28,10 q-14,0 -28,8 q-10,6 -16,18 Z" class="pelican-body"/>
      <!-- head -->
      <ellipse cx="82" cy="22" rx="28" ry="22" class="pelican-body"/>
      <!-- eye -->
      <circle cx="94" cy="18" r="8" class="pelican-eye"/>
      <circle cx="94" cy="18" r="3.5" class="pupil">
        <animate attributeName="cx" values="94;96;94;92;94" keyTimes="0;0.2;0.5;0.8;1" dur="8s" repeatCount="indefinite"/>
      </circle>
      <!-- beak upper -->
      <path d="M86,24 q28,-6 60,0 q-20,20 -60,14 Z" class="pelican-beak"/>
      <!-- beak pouch lower -->
      <path d="M82,26 q48,8 64,26 q-42,8 -86,-2 q10,-14 22,-24Z" fill="#f4b55f" stroke="#d9821a" stroke-width="2" opacity="0.95"/>
      <!-- small crest -->
      <path d="M104,6 q-4,-10 -14,-14 q10,2 18,8 q4,6 0,10Z" fill="#e8b83e" opacity="0.8"/>

      <!-- thighs hint covering leg joins -->
      <ellipse cx="-6" cy="84" rx="24" ry="14" class="pelican-gray" opacity="0.9"/>
      <ellipse cx="6" cy="84" rx="24" ry="14" class="pelican-gray" opacity="0.9"/>
    </g>

    <!-- Decorative suggestion of thin legs from body to crank (subtle, animated bend) -->
    <g transform="translate(520,380)" opacity="0.5">
      <path id="legLineR" d="M-70,-16 Q-40,-50 -8,-8" fill="none" stroke="#e5943a" stroke-width="6" stroke-linecap="round">
        <animate attributeName="d" dur="8s" repeatCount="indefinite"
                 values="M-70,-16 Q-40,-50 -8,-8;
                         M-70,-12 Q-36,-48 -8,-8;
                         M-70,-16 Q-40,-50 -8,-8;
                         M-70,-20 Q-44,-52 -8,-8;
                         M-70,-16 Q-40,-50 -8,-8"/>
      </path>
      <path id="legLineL" d="M-70,16 Q-40,50 -8,8" fill="none" stroke="#e5943a" stroke-width="6" stroke-linecap="round">
        <animate attributeName="d" dur="8s" repeatCount="indefinite"
                 values="M-70,16 Q-40,50 -8,8;
                         M-70,12 Q-36,48 -8,8;
                         M-70,16 Q-40,50 -8,8;
                         M-70,20 Q-44,52 -8,8;
                         M-70,16 Q-40,50 -8,8"/>
      </path>
    </g>
  </g>
</svg>