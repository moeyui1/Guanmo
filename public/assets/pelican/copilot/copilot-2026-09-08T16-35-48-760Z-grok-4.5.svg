<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="55%" stop-color="#B8E0F0"/>
      <stop offset="100%" stop-color="#E8F4E8"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7CB342"/>
      <stop offset="100%" stop-color="#558B2F"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78909C"/>
      <stop offset="100%" stop-color="#546E7A"/>
    </linearGradient>
    <linearGradient id="pelicanBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5F5F5"/>
      <stop offset="100%" stop-color="#E0E0E0"/>
    </linearGradient>
    <linearGradient id="wingGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAFAFA"/>
      <stop offset="100%" stop-color="#BDBDBD"/>
    </linearGradient>
    <linearGradient id="beakGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFB74D"/>
      <stop offset="50%" stop-color="#FF9800"/>
      <stop offset="100%" stop-color="#F57C00"/>
    </linearGradient>
    <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#42A5F5"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="70%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </radialGradient>
    <style type="text/css"><![CDATA[
      .wheel-spin {
        transform-origin: 0px 0px;
        animation: spin 1.6s linear infinite;
      }
      .wheel-spin-back {
        transform-origin: 0px 0px;
        animation: spin 1.6s linear infinite;
      }
      .pedal-crank {
        transform-origin: 0px 0px;
        animation: spin 1.6s linear infinite;
      }
      .rider-bob {
        animation: bob 0.8s ease-in-out infinite alternate;
      }
      .wing-flap {
        transform-origin: 480px 250px;
        animation: flap 2s ease-in-out infinite;
      }
      .scene-drift {
        animation: drift 8s linear infinite;
      }
      .cloud-a {
        animation: cloudMove 8s linear infinite;
      }
      .cloud-b {
        animation: cloudMove 8s linear infinite;
        animation-delay: -4s;
      }
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes bob {
        from { transform: translateY(0px); }
        to { transform: translateY(-6px); }
      }
      @keyframes flap {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(-8deg); }
      }
      @keyframes drift {
        0% { transform: translateX(0); }
        100% { transform: translateX(-120px); }
      }
      @keyframes cloudMove {
        0% { transform: translateX(0); }
        100% { transform: translateX(-200px); }
      }
    ]]></style>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="820" cy="90" r="48" fill="url(#sunGrad)"/>
  <circle cx="820" cy="90" r="58" fill="#FFF59D" opacity="0.25"/>

  <!-- Distant hills -->
  <ellipse cx="200" cy="360" rx="280" ry="70" fill="#A5D6A7" opacity="0.7"/>
  <ellipse cx="550" cy="370" rx="320" ry="60" fill="#81C784" opacity="0.6"/>
  <ellipse cx="850" cy="365" rx="200" ry="55" fill="#A5D6A7" opacity="0.65"/>

  <!-- Clouds -->
  <g class="cloud-a" opacity="0.9">
    <g transform="translate(0,0)">
      <ellipse cx="140" cy="80" rx="50" ry="22" fill="#fff"/>
      <ellipse cx="175" cy="75" rx="35" ry="28" fill="#fff"/>
      <ellipse cx="110" cy="78" rx="30" ry="18" fill="#fff"/>
      <ellipse cx="400" cy="110" rx="45" ry="18" fill="#fff"/>
      <ellipse cx="430" cy="105" rx="28" ry="22" fill="#fff"/>
      <ellipse cx="375" cy="108" rx="25" ry="15" fill="#fff"/>
    </g>
    <g transform="translate(960,0)">
      <ellipse cx="140" cy="80" rx="50" ry="22" fill="#fff"/>
      <ellipse cx="175" cy="75" rx="35" ry="28" fill="#fff"/>
      <ellipse cx="110" cy="78" rx="30" ry="18" fill="#fff"/>
      <ellipse cx="400" cy="110" rx="45" ry="18" fill="#fff"/>
      <ellipse cx="430" cy="105" rx="28" ry="22" fill="#fff"/>
      <ellipse cx="375" cy="108" rx="25" ry="15" fill="#fff"/>
    </g>
  </g>
  <g class="cloud-b" opacity="0.75">
    <g transform="translate(0,0)">
      <ellipse cx="700" cy="60" rx="40" ry="16" fill="#fff"/>
      <ellipse cx="725" cy="55" rx="25" ry="20" fill="#fff"/>
      <ellipse cx="680" cy="58" rx="22" ry="14" fill="#fff"/>
    </g>
    <g transform="translate(960,0)">
      <ellipse cx="700" cy="60" rx="40" ry="16" fill="#fff"/>
      <ellipse cx="725" cy="55" rx="25" ry="20" fill="#fff"/>
      <ellipse cx="680" cy="58" rx="22" ry="14" fill="#fff"/>
    </g>
  </g>

  <!-- Ground -->
  <rect y="400" width="960" height="140" fill="url(#ground)"/>
  <!-- Road -->
  <rect y="420" width="960" height="70" fill="url(#road)"/>
  <!-- Road markings that scroll -->
  <g class="scene-drift">
    <g>
      <rect x="0" y="450" width="60" height="8" rx="2" fill="#ECEFF1"/>
      <rect x="120" y="450" width="60" height="8" rx="2" fill="#ECEFF1"/>
      <rect x="240" y="450" width="60" height="8" rx="2" fill="#ECEFF1"/>
      <rect x="360" y="450" width="60" height="8" rx="2" fill="#ECEFF1"/>
      <rect x="480" y="450" width="60" height="8" rx="2" fill="#ECEFF1"/>
      <rect x="600" y="450" width="60" height="8" rx="2" fill="#ECEFF1"/>
      <rect x="720" y="450" width="60" height="8" rx="2" fill="#ECEFF1"/>
      <rect x="840" y="450" width="60" height="8" rx="2" fill="#ECEFF1"/>
      <rect x="960" y="450" width="60" height="8" rx="2" fill="#ECEFF1"/>
      <rect x="1080" y="450" width="60" height="8" rx="2" fill="#ECEFF1"/>
    </g>
  </g>

  <!-- Grass tufts -->
  <g fill="#66BB6A">
    <ellipse cx="80" cy="415" rx="25" ry="8"/>
    <ellipse cx="250" cy="412" rx="30" ry="7"/>
    <ellipse cx="700" cy="414" rx="28" ry="8"/>
    <ellipse cx="900" cy="413" rx="22" ry="6"/>
  </g>

  <!-- Main character group: bicycle + pelican, centered -->
  <g transform="translate(480, 380)">
    <!-- Subtle whole-bike bounce -->
    <g class="rider-bob">

      <!-- ============ BICYCLE ============ -->
      <!-- Rear wheel -->
      <g transform="translate(-140, 40)">
        <g class="wheel-spin-back" style="transform-box: fill-box; transform-origin: center;">
          <circle r="52" fill="none" stroke="#37474F" stroke-width="7"/>
          <circle r="46" fill="none" stroke="#90A4AE" stroke-width="2"/>
          <circle r="8" fill="#455A64"/>
          <!-- Spokes -->
          <g stroke="#607D8B" stroke-width="2">
            <line x1="0" y1="-46" x2="0" y2="46"/>
            <line x1="-46" y1="0" x2="46" y2="0"/>
            <line x1="-32.5" y1="-32.5" x2="32.5" y2="32.5"/>
            <line x1="32.5" y1="-32.5" x2="-32.5" y2="32.5"/>
            <line x1="-18" y1="-42" x2="18" y2="42"/>
            <line x1="18" y1="-42" x2="-18" y2="42"/>
            <line x1="-42" y1="-18" x2="42" y2="18"/>
            <line x1="42" y1="-18" x2="-42" y2="18"/>
          </g>
          <circle r="14" fill="none" stroke="#546E7A" stroke-width="3"/>
        </g>
      </g>

      <!-- Front wheel -->
      <g transform="translate(130, 40)">
        <g class="wheel-spin" style="transform-box: fill-box; transform-origin: center;">
          <circle r="52" fill="none" stroke="#37474F" stroke-width="7"/>
          <circle r="46" fill="none" stroke="#90A4AE" stroke-width="2"/>
          <circle r="8" fill="#455A64"/>
          <g stroke="#607D8B" stroke-width="2">
            <line x1="0" y1="-46" x2="0" y2="46"/>
            <line x1="-46" y1="0" x2="46" y2="0"/>
            <line x1="-32.5" y1="-32.5" x2="32.5" y2="32.5"/>
            <line x1="32.5" y1="-32.5" x2="-32.5" y2="32.5"/>
            <line x1="-18" y1="-42" x2="18" y2="42"/>
            <line x1="18" y1="-42" x2="-18" y2="42"/>
            <line x1="-42" y1="-18" x2="42" y2="18"/>
            <line x1="42" y1="-18" x2="-42" y2="18"/>
          </g>
          <circle r="14" fill="none" stroke="#546E7A" stroke-width="3"/>
        </g>
      </g>

      <!-- Frame -->
      <g stroke="url(#frameGrad)" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <!-- Main triangle -->
        <path d="M-140,40 L-20,-30 L80,40 Z" stroke-width="7"/>
        <!-- Seat tube extension -->
        <path d="M-20,-30 L-35,-70"/>
        <!-- Head tube / fork -->
        <path d="M80,40 L100,-50"/>
        <path d="M100,-50 L130,40" stroke-width="6"/>
        <!-- Chain stays -->
        <path d="M-140,40 L-20,40" stroke-width="5"/>
        <!-- Top tube accent -->
        <path d="M-20,-30 L100,-50" stroke-width="6"/>
        <!-- Down tube -->
        <path d="M-20,40 L100,-50" stroke-width="5" opacity="0.85"/>
      </g>

      <!-- Seat -->
      <ellipse cx="-40" cy="-78" rx="28" ry="10" fill="#5D4037"/>
      <rect x="-55" y="-82" width="36" height="8" rx="3" fill="#4E342E"/>

      <!-- Handlebars -->
      <g stroke="#37474F" stroke-width="5" fill="none" stroke-linecap="round">
        <path d="M100,-50 L115,-75"/>
        <path d="M95,-72 L135,-72"/>
        <path d="M95,-72 L90,-60"/>
        <path d="M135,-72 L140,-60"/>
      </g>
      <!-- Grips -->
      <rect x="85" y="-64" width="12" height="18" rx="4" fill="#795548"/>
      <rect x="134" y="-64" width="12" height="18" rx="4" fill="#795548"/>

      <!-- Chain ring / crank center -->
      <circle cx="-20" cy="40" r="16" fill="#455A64" stroke="#263238" stroke-width="2"/>
      <circle cx="-20" cy="40" r="10" fill="none" stroke="#78909C" stroke-width="2"/>

      <!-- Pedals and crank arms (rotating) -->
      <g transform="translate(-20, 40)">
        <g class="pedal-crank" style="transform-box: fill-box; transform-origin: center;">
          <!-- Crank arm 1 -->
          <line x1="0" y1="0" x2="0" y2="-36" stroke="#37474F" stroke-width="6" stroke-linecap="round"/>
          <!-- Pedal 1 -->
          <rect x="-14" y="-44" width="28" height="10" rx="2" fill="#5D4037"/>
          <!-- Crank arm 2 -->
          <line x1="0" y1="0" x2="0" y2="36" stroke="#37474F" stroke-width="6" stroke-linecap="round"/>
          <!-- Pedal 2 -->
          <rect x="-14" y="34" width="28" height="10" rx="2" fill="#5D4037"/>
        </g>
      </g>

      <!-- Chain -->
      <path d="M-20,52 Q-80,58 -140,48" fill="none" stroke="#455A64" stroke-width="2.5" stroke-dasharray="4 3"/>

      <!-- ============ PELICAN ============ -->
      <g transform="translate(-10, -100)">
        <!-- Legs (pedaling) - attached near seat, feet follow pedals via rotation groups -->
        <!-- Left leg -->
        <g>
          <animateTransform attributeName="transform" type="rotate"
            values="25 -30 80; -25 -30 80; 25 -30 80" dur="1.6s" repeatCount="indefinite"/>
          <!-- Thigh -->
          <path d="M-30,50 Q-40,90 -25,115" fill="none" stroke="#F5F5F5" stroke-width="14" stroke-linecap="round"/>
          <!-- Lower leg -->
          <g>
            <animateTransform attributeName="transform" type="rotate"
              values="-30 -25 115; 20 -25 115; -30 -25 115" dur="1.6s" repeatCount="indefinite"/>
            <path d="M-25,115 Q-20,145 -15,160" fill="none" stroke="#EEEEEE" stroke-width="11" stroke-linecap="round"/>
            <!-- Foot / webbed -->
            <ellipse cx="-10" cy="165" rx="16" ry="7" fill="#FF9800" transform="rotate(-10 -10 165)"/>
            <path d="M-22,163 Q-10,175 2,163" fill="none" stroke="#F57C00" stroke-width="2"/>
          </g>
        </g>

        <!-- Right leg (offset phase) -->
        <g>
          <animateTransform attributeName="transform" type="rotate"
            values="-25 -5 80; 25 -5 80; -25 -5 80" dur="1.6s" repeatCount="indefinite"/>
          <path d="M-5,50 Q5,90 10,115" fill="none" stroke="#E0E0E0" stroke-width="14" stroke-linecap="round"/>
          <g>
            <animateTransform attributeName="transform" type="rotate"
              values="20 10 115; -30 10 115; 20 10 115" dur="1.6s" repeatCount="indefinite"/>
            <path d="M10,115 Q15,145 12,160" fill="none" stroke="#BDBDBD" stroke-width="11" stroke-linecap="round"/>
            <ellipse cx="16" cy="165" rx="16" ry="7" fill="#FF9800" transform="rotate(10 16 165)"/>
            <path d="M4,163 Q16,175 28,163" fill="none" stroke="#F57C00" stroke-width="2"/>
          </g>
        </g>

        <!-- Body -->
        <ellipse cx="10" cy="20" rx="70" ry="48" fill="url(#pelicanBody)"/>
        <!-- Belly -->
        <ellipse cx="15" cy="35" rx="48" ry="30" fill="#FAFAFA" opacity="0.9"/>

        <!-- Tail feathers -->
        <g transform="translate(-55, 25)">
          <ellipse cx="0" cy="0" rx="30" ry="12" fill="#BDBDBD" transform="rotate(-25)"/>
          <ellipse cx="-8" cy="8" rx="25" ry="10" fill="#9E9E9E" transform="rotate(-40)"/>
          <ellipse cx="5" cy="-8" rx="22" ry="9" fill="#E0E0E0" transform="rotate(-10)"/>
        </g>

        <!-- Wing (upper, slightly flapping) -->
        <g class="wing-flap" style="transform-box: fill-box; transform-origin: 20% 40%;">
          <path d="M-10,-10 Q-60,-50 -90,-20 Q-70,10 -20,20 Q0,15 -10,-10 Z" fill="url(#wingGrad)" stroke="#BDBDBD" stroke-width="1.5"/>
          <!-- Wing feather lines -->
          <path d="M-20,0 Q-50,-20 -75,-10" fill="none" stroke="#9E9E9E" stroke-width="1.2" opacity="0.6"/>
          <path d="M-15,8 Q-45,-5 -70,5" fill="none" stroke="#9E9E9E" stroke-width="1.2" opacity="0.5"/>
          <path d="M-25,-8 Q-55,-30 -80,-18" fill="none" stroke="#9E9E9E" stroke-width="1" opacity="0.5"/>
        </g>

        <!-- Neck -->
        <path d="M50,-10 Q90,-60 95,-90" fill="none" stroke="#F5F5F5" stroke-width="28" stroke-linecap="round"/>
        <path d="M50,-10 Q90,-60 95,-90" fill="none" stroke="#EEEEEE" stroke-width="18" stroke-linecap="round"/>

        <!-- Head -->
        <g transform="translate(100, -105)">
          <ellipse cx="0" cy="0" rx="32" ry="28" fill="#FAFAFA"/>
          <!-- Crown / slight crest -->
          <ellipse cx="-5" cy="-18" rx="18" ry="12" fill="#F5F5F5"/>
          <!-- Eye -->
          <circle cx="12" cy="-5" r="8" fill="#fff" stroke="#424242" stroke-width="1"/>
          <circle cx="14" cy="-5" r="4.5" fill="#212121"/>
          <circle cx="15.5" cy="-6.5" r="1.5" fill="#fff"/>
          <!-- Cheek blush -->
          <ellipse cx="5" cy="8" rx="8" ry="5" fill="#FFCCBC" opacity="0.45"/>

          <!-- Beak - distinctive pelican pouch -->
          <g transform="translate(28, 5)">
            <!-- Upper beak -->
            <path d="M0,-8 Q40,-18 85,-2 Q50,5 0,4 Z" fill="url(#beakGrad)" stroke="#E65100" stroke-width="1"/>
            <!-- Lower pouch -->
            <path d="M0,4 Q30,45 75,8 Q40,12 0,4 Z" fill="#FFB74D" stroke="#EF6C00" stroke-width="1.2"/>
            <path d="M0,4 Q30,45 75,8" fill="none" stroke="#F57C00" stroke-width="1" opacity="0.5"/>
            <!-- Beak tip highlight -->
            <path d="M70,-4 Q82,-2 78,4" fill="none" stroke="#FFE0B2" stroke-width="2" stroke-linecap="round"/>
          </g>
        </g>

        <!-- Far wing tip peeking -->
        <ellipse cx="40" cy="5" rx="35" ry="14" fill="#E0E0E0" opacity="0.7" transform="rotate(15 40 5)"/>

        <!-- Arms holding handlebars -->
        <!-- Left arm -->
        <path d="M30,0 Q55,-20 95,-55" fill="none" stroke="#F5F5F5" stroke-width="12" stroke-linecap="round"/>
        <!-- Right arm -->
        <path d="M25,10 Q60,-5 110,-55" fill="none" stroke="#E0E0E0" stroke-width="12" stroke-linecap="round"/>
        <!-- Hands on bars -->
        <ellipse cx="100" cy="-58" rx="10" ry="7" fill="#FFCC80"/>
        <ellipse cx="118" cy="-58" rx="10" ry="7" fill="#FFCC80"/>
      </g>
    </g>
  </g>

  <!-- Foreground grass blades for depth -->
  <g fill="#43A047" opacity="0.85">
    <path d="M40,540 Q50,480 45,540 Q55,490 60,540 Z"/>
    <path d="M100,540 Q108,500 105,540 Q115,510 120,540 Z"/>
    <path d="M860,540 Q870,485 865,540 Q875,495 880,540 Z"/>
    <path d="M920,540 Q928,505 925,540 Q935,515 940,540 Z"/>
  </g>

  <!-- Seamless loop: background elements already use 8s; ensure motion period matches -->
  <!-- Road drift is 8s; clouds 8s; wheel spin 1.6s (5 revolutions per loop) -->
</svg>