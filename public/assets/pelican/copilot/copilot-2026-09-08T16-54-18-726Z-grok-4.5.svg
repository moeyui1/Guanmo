<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="70%" stop-color="#B8E0F0"/>
      <stop offset="100%" stop-color="#E8F4E8"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7CB342"/>
      <stop offset="100%" stop-color="#558B2F"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8E8E8"/>
    </linearGradient>
    <linearGradient id="pouchGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFB74D"/>
      <stop offset="100%" stop-color="#F57C00"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="960" height="540" fill="url(#sky)"/>

  <!-- Distant hills -->
  <ellipse cx="200" cy="380" rx="280" ry="60" fill="#A5D6A7" opacity="0.6"/>
  <ellipse cx="700" cy="370" rx="320" ry="70" fill="#81C784" opacity="0.5"/>

  <!-- Ground -->
  <rect y="400" width="960" height="140" fill="url(#ground)"/>
  <rect y="400" width="960" height="8" fill="#689F38"/>

  <!-- Road -->
  <rect y="420" width="960" height="50" fill="#5D4037"/>
  <rect y="438" width="960" height="6" fill="#FFEB3B" opacity="0.7">
    <animate attributeName="stroke-dashoffset" values="0;40" dur="0.5s" repeatCount="indefinite"/>
  </rect>
  <!-- Dashed center line via moving rects -->
  <g>
    <rect x="0" y="440" width="40" height="4" fill="#FFEB3B" opacity="0.85">
      <animate attributeName="x" values="0;-80" dur="1s" repeatCount="indefinite"/>
    </rect>
    <rect x="80" y="440" width="40" height="4" fill="#FFEB3B" opacity="0.85">
      <animate attributeName="x" values="80;0" dur="1s" repeatCount="indefinite"/>
    </rect>
    <rect x="160" y="440" width="40" height="4" fill="#FFEB3B" opacity="0.85">
      <animate attributeName="x" values="160;80" dur="1s" repeatCount="indefinite"/>
    </rect>
    <rect x="240" y="440" width="40" height="4" fill="#FFEB3B" opacity="0.85">
      <animate attributeName="x" values="240;160" dur="1s" repeatCount="indefinite"/>
    </rect>
    <rect x="320" y="440" width="40" height="4" fill="#FFEB3B" opacity="0.85">
      <animate attributeName="x" values="320;240" dur="1s" repeatCount="indefinite"/>
    </rect>
    <rect x="400" y="440" width="40" height="4" fill="#FFEB3B" opacity="0.85">
      <animate attributeName="x" values="400;320" dur="1s" repeatCount="indefinite"/>
    </rect>
    <rect x="480" y="440" width="40" height="4" fill="#FFEB3B" opacity="0.85">
      <animate attributeName="x" values="480;400" dur="1s" repeatCount="indefinite"/>
    </rect>
    <rect x="560" y="440" width="40" height="4" fill="#FFEB3B" opacity="0.85">
      <animate attributeName="x" values="560;480" dur="1s" repeatCount="indefinite"/>
    </rect>
    <rect x="640" y="440" width="40" height="4" fill="#FFEB3B" opacity="0.85">
      <animate attributeName="x" values="640;560" dur="1s" repeatCount="indefinite"/>
    </rect>
    <rect x="720" y="440" width="40" height="4" fill="#FFEB3B" opacity="0.85">
      <animate attributeName="x" values="720;640" dur="1s" repeatCount="indefinite"/>
    </rect>
    <rect x="800" y="440" width="40" height="4" fill="#FFEB3B" opacity="0.85">
      <animate attributeName="x" values="800;720" dur="1s" repeatCount="indefinite"/>
    </rect>
    <rect x="880" y="440" width="40" height="4" fill="#FFEB3B" opacity="0.85">
      <animate attributeName="x" values="880;800" dur="1s" repeatCount="indefinite"/>
    </rect>
    <rect x="960" y="440" width="40" height="4" fill="#FFEB3B" opacity="0.85">
      <animate attributeName="x" values="960;880" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Clouds drifting -->
  <g opacity="0.85">
    <g>
      <ellipse cx="120" cy="80" rx="50" ry="22" fill="#fff"/>
      <ellipse cx="150" cy="70" rx="40" ry="28" fill="#fff"/>
      <ellipse cx="180" cy="82" rx="45" ry="20" fill="#fff"/>
      <animateTransform attributeName="transform" type="translate" values="0,0; 1000,0" dur="40s" repeatCount="indefinite"/>
    </g>
    <g>
      <ellipse cx="-200" cy="120" rx="60" ry="24" fill="#fff"/>
      <ellipse cx="-160" cy="108" rx="45" ry="30" fill="#fff"/>
      <ellipse cx="-130" cy="122" rx="50" ry="22" fill="#fff"/>
      <animateTransform attributeName="transform" type="translate" values="0,0; 1200,0" dur="55s" repeatCount="indefinite"/>
    </g>
    <g>
      <ellipse cx="600" cy="60" rx="55" ry="20" fill="#fff"/>
      <ellipse cx="640" cy="50" rx="42" ry="26" fill="#fff"/>
      <ellipse cx="670" cy="62" rx="48" ry="18" fill="#fff"/>
      <animateTransform attributeName="transform" type="translate" values="0,0; 500,8; 0,0" dur="25s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Main scene group with gentle bob -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-4; 0,0; 0,-3; 0,0" dur="8s" repeatCount="indefinite"/>

    <!-- Bicycle and pelican centered around x=480 -->
    <g transform="translate(480, 360)">

      <!-- Rear wheel -->
      <g transform="translate(-90, 55)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
          <circle r="48" fill="none" stroke="#333" stroke-width="6"/>
          <circle r="42" fill="none" stroke="#555" stroke-width="2"/>
          <circle r="8" fill="#222"/>
          <!-- Spokes -->
          <line x1="0" y1="-42" x2="0" y2="42" stroke="#666" stroke-width="2"/>
          <line x1="-42" y1="0" x2="42" y2="0" stroke="#666" stroke-width="2"/>
          <line x1="-30" y1="-30" x2="30" y2="30" stroke="#666" stroke-width="2"/>
          <line x1="30" y1="-30" x2="-30" y2="30" stroke="#666" stroke-width="2"/>
          <line x1="-15" y1="-39" x2="15" y2="39" stroke="#888" stroke-width="1.5"/>
          <line x1="15" y1="-39" x2="-15" y2="39" stroke="#888" stroke-width="1.5"/>
          <line x1="-39" y1="-15" x2="39" y2="15" stroke="#888" stroke-width="1.5"/>
          <line x1="39" y1="-15" x2="-39" y2="15" stroke="#888" stroke-width="1.5"/>
        </g>
        <circle r="48" fill="none" stroke="#1a1a1a" stroke-width="3" opacity="0.3"/>
      </g>

      <!-- Front wheel -->
      <g transform="translate(100, 55)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
          <circle r="48" fill="none" stroke="#333" stroke-width="6"/>
          <circle r="42" fill="none" stroke="#555" stroke-width="2"/>
          <circle r="8" fill="#222"/>
          <line x1="0" y1="-42" x2="0" y2="42" stroke="#666" stroke-width="2"/>
          <line x1="-42" y1="0" x2="42" y2="0" stroke="#666" stroke-width="2"/>
          <line x1="-30" y1="-30" x2="30" y2="30" stroke="#666" stroke-width="2"/>
          <line x1="30" y1="-30" x2="-30" y2="30" stroke="#666" stroke-width="2"/>
          <line x1="-15" y1="-39" x2="15" y2="39" stroke="#888" stroke-width="1.5"/>
          <line x1="15" y1="-39" x2="-15" y2="39" stroke="#888" stroke-width="1.5"/>
          <line x1="-39" y1="-15" x2="39" y2="15" stroke="#888" stroke-width="1.5"/>
          <line x1="39" y1="-15" x2="-39" y2="15" stroke="#888" stroke-width="1.5"/>
        </g>
      </g>

      <!-- Bike frame -->
      <g stroke="#1565C0" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <!-- Main triangle -->
        <path d="M -90 55 L 0 10 L 55 55 Z"/>
        <!-- Seat tube extension -->
        <line x1="0" y1="10" x2="-15" y2="-15"/>
        <!-- Down tube / chain stay already in triangle -->
        <!-- Fork -->
        <path d="M 55 55 L 100 55"/>
        <line x1="55" y1="55" x2="70" y2="5"/>
        <!-- Handlebar stem -->
        <line x1="70" y1="5" x2="70" y2="-25"/>
        <!-- Handlebars -->
        <path d="M 50 -25 Q 70 -40 90 -25" stroke-width="6"/>
        <line x1="50" y1="-25" x2="45" y2="-15" stroke-width="5"/>
        <line x1="90" y1="-25" x2="95" y2="-15" stroke-width="5"/>
      </g>
      <!-- Frame accent -->
      <g stroke="#42A5F5" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7">
        <path d="M -90 55 L 0 10 L 55 55"/>
        <line x1="0" y1="10" x2="-15" y2="-15"/>
      </g>

      <!-- Seat -->
      <ellipse cx="-18" cy="-22" rx="22" ry="8" fill="#37474F" transform="rotate(-15 -18 -22)"/>
      <rect x="-28" y="-26" width="18" height="6" rx="2" fill="#263238" transform="rotate(-15 -18 -22)"/>

      <!-- Chainring / crank center -->
      <circle cx="0" cy="55" r="14" fill="#455A64" stroke="#263238" stroke-width="2"/>
      <circle cx="0" cy="55" r="6" fill="#78909C"/>

      <!-- Pedals and feet - rotating crank -->
      <g transform="translate(0, 55)">
        <!-- Crank arms + pedals -->
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
          <!-- Arm 1 -->
          <line x1="0" y1="0" x2="0" y2="-32" stroke="#37474F" stroke-width="5" stroke-linecap="round"/>
          <rect x="-10" y="-40" width="20" height="8" rx="2" fill="#212121"/>
          <!-- Arm 2 -->
          <line x1="0" y1="0" x2="0" y2="32" stroke="#37474F" stroke-width="5" stroke-linecap="round"/>
          <rect x="-10" y="32" width="20" height="8" rx="2" fill="#212121"/>
        </g>
      </g>

      <!-- Pelican body group -->
      <g>
        <!-- Slight body lean bounce -->
        <animateTransform attributeName="transform" type="rotate" values="-2;2;-2" dur="8s" repeatCount="indefinite" additive="sum"/>

        <!-- Legs (behind pedals visually - animated with crank phase) -->
        <!-- Left leg (upper) -->
        <g>
          <!-- Hip to knee approx -->
          <path d="M -10 5 Q -5 30 0 45" fill="none" stroke="#F5F5F5" stroke-width="10" stroke-linecap="round">
            <animate attributeName="d" values="M -10 5 Q -20 28 -8 50; M -10 5 Q 5 30 12 48; M -10 5 Q -20 28 -8 50" dur="1.2s" repeatCount="indefinite"/>
          </path>
          <!-- Foot left -->
          <ellipse cx="-8" cy="52" rx="12" ry="6" fill="#FF8F00">
            <animate attributeName="cx" values="-8;12;-8" dur="1.2s" repeatCount="indefinite"/>
            <animate attributeName="cy" values="52;48;52" dur="1.2s" repeatCount="indefinite"/>
          </ellipse>
        </g>
        <!-- Right leg -->
        <g>
          <path d="M 5 5 Q 15 28 8 50" fill="none" stroke="#EEEEEE" stroke-width="10" stroke-linecap="round">
            <animate attributeName="d" values="M 5 5 Q 20 28 12 48; M 5 5 Q -5 30 -8 50; M 5 5 Q 20 28 12 48" dur="1.2s" repeatCount="indefinite"/>
          </path>
          <ellipse cx="12" cy="48" rx="12" ry="6" fill="#FF8F00">
            <animate attributeName="cx" values="12;-8;12" dur="1.2s" repeatCount="indefinite"/>
            <animate attributeName="cy" values="48;52;48" dur="1.2s" repeatCount="indefinite"/>
          </ellipse>
        </g>

        <!-- Tail feathers -->
        <g transform="translate(-95, -20)">
          <path d="M 0 0 Q -30 -25 -55 -10 Q -40 5 -20 8 Q -35 15 -50 25 Q -25 20 0 15 Z" fill="#ECEFF1"/>
          <path d="M 0 5 Q -25 -15 -45 -5" fill="none" stroke="#B0BEC5" stroke-width="2"/>
          <animateTransform attributeName="transform" type="rotate" values="0;-6;0;4;0" dur="8s" repeatCount="indefinite" additive="sum"/>
        </g>

        <!-- Body -->
        <ellipse cx="-25" cy="-35" rx="55" ry="40" fill="url(#bodyGrad)"/>
        <ellipse cx="-15" cy="-30" rx="40" ry="28" fill="#FAFAFA" opacity="0.9"/>

        <!-- Wing (folded, slight flap) -->
        <g transform="translate(-40, -45)">
          <path d="M 0 0 Q -40 -30 -70 10 Q -50 25 -20 20 Q -35 5 0 8 Z" fill="#E0E0E0" stroke="#BDBDBD" stroke-width="1"/>
          <path d="M -10 5 Q -40 -15 -55 8" fill="none" stroke="#9E9E9E" stroke-width="1.5"/>
          <path d="M -5 12 Q -30 -5 -48 15" fill="none" stroke="#9E9E9E" stroke-width="1"/>
          <animateTransform attributeName="transform" type="rotate" values="0;8;0;-4;0" dur="2s" repeatCount="indefinite" additive="sum"/>
        </g>

        <!-- Neck -->
        <path d="M 20 -50 Q 55 -90 45 -120" fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round"/>
        <path d="M 20 -50 Q 55 -90 45 -120" fill="none" stroke="#F5F5F5" stroke-width="16" stroke-linecap="round"/>

        <!-- Head -->
        <g transform="translate(48, -135)">
          <animateTransform attributeName="transform" type="rotate" values="0;3;0;-2;0" dur="4s" repeatCount="indefinite" additive="sum"/>
          <!-- Head shape -->
          <ellipse cx="0" cy="0" rx="28" ry="24" fill="#FFFFFF"/>
          <!-- Eye -->
          <circle cx="12" cy="-5" r="7" fill="#1A1A1A"/>
          <circle cx="14" cy="-7" r="2.5" fill="#FFFFFF"/>
          <!-- Beak upper -->
          <path d="M 20 2 L 75 8 L 70 18 L 22 14 Z" fill="#FFA000"/>
          <path d="M 20 2 L 75 8 L 72 12 L 22 8 Z" fill="#FFB300"/>
          <!-- Pouch / lower beak -->
          <path d="M 22 14 Q 45 55 72 18 L 70 18 Q 48 40 22 14 Z" fill="url(#pouchGrad)"/>
          <path d="M 28 18 Q 48 42 68 20" fill="none" stroke="#E65100" stroke-width="1.5" opacity="0.5"/>
          <!-- Nostil line -->
          <line x1="35" y1="6" x2="55" y2="9" stroke="#EF6C00" stroke-width="1.5"/>
          <!-- Crest tuft -->
          <path d="M -15 -18 Q -25 -35 -5 -28 Q -18 -40 0 -30" fill="none" stroke="#E0E0E0" stroke-width="4" stroke-linecap="round"/>
        </g>

        <!-- Wing tip overlay on body -->
        <ellipse cx="-5" cy="-25" rx="18" ry="12" fill="#F5F5F5" opacity="0.8" transform="rotate(-20)"/>

        <!-- Arms / wing hands on handlebars -->
        <g>
          <!-- Left arm to handlebar -->
          <path d="M 5 -40 Q 30 -50 48 -28" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
          <path d="M 5 -40 Q 30 -50 48 -28" fill="none" stroke="#FAFAFA" stroke-width="8" stroke-linecap="round"/>
          <!-- Hand left -->
          <ellipse cx="50" cy="-22" rx="10" ry="7" fill="#FFB74D" transform="rotate(20 50 -22)"/>
          <!-- Right arm -->
          <path d="M 10 -35 Q 40 -55 88 -28" fill="none" stroke="#EEEEEE" stroke-width="11" stroke-linecap="round"/>
          <path d="M 10 -35 Q 40 -55 88 -28" fill="none" stroke="#F5F5F5" stroke-width="7" stroke-linecap="round"/>
          <ellipse cx="92" cy="-22" rx="10" ry="7" fill="#FFB74D" transform="rotate(-15 92 -22)"/>
        </g>
      </g>

      <!-- Chain (simple dashed line) -->
      <g stroke="#424242" stroke-width="2" fill="none" stroke-dasharray="4 3">
        <path d="M 0 55 Q -45 70 -90 55"/>
        <animate attributeName="stroke-dashoffset" values="0;14" dur="0.4s" repeatCount="indefinite"/>
      </g>

    </g>
  </g>

  <!-- Foreground grass tufts -->
  <g fill="#33691E">
    <path d="M 40 470 Q 50 440 55 470 Q 60 445 70 470 Z"/>
    <path d="M 120 480 Q 130 450 135 480 Q 142 455 150 480 Z"/>
    <path d="M 850 475 Q 860 445 868 475 Q 875 450 885 475 Z"/>
    <path d="M 920 485 Q 930 455 938 485 Q 945 460 955 485 Z"/>
    <path d="M 780 490 Q 788 465 795 490 Q 800 470 810 490 Z"/>
  </g>

  <!-- Soft vignette via edge fades using large translucent rects would be heavy; skip -->

  <!-- Seamless 8s master timing pulse (invisible anchor for loop feel) -->
  <circle r="0" opacity="0">
    <animate attributeName="opacity" values="0;0" dur="8s" repeatCount="indefinite"/>
  </circle>
</svg>