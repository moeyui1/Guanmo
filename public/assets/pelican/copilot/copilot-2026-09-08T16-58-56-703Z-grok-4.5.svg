<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="55%" stop-color="#B8E0F0"/>
      <stop offset="100%" stop-color="#E8F4E8"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7CB342"/>
      <stop offset="40%" stop-color="#558B2F"/>
      <stop offset="100%" stop-color="#33691E"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78909C"/>
      <stop offset="100%" stop-color="#546E7A"/>
    </linearGradient>
    <linearGradient id="pelicanBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F5F5F0"/>
      <stop offset="100%" stop-color="#E8E4D9"/>
    </linearGradient>
    <linearGradient id="pelicanWing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF8C42"/>
      <stop offset="40%" stop-color="#E86A17"/>
      <stop offset="100%" stop-color="#C45A10"/>
    </linearGradient>
    <linearGradient id="beakGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFB74D"/>
      <stop offset="50%" stop-color="#FF9800"/>
      <stop offset="100%" stop-color="#F57C00"/>
    </linearGradient>
    <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#42A5F5"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
    <radialGradient id="hubGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ECEFF1"/>
      <stop offset="100%" stop-color="#78909C"/>
    </radialGradient>
    <clipPath id="sceneClip">
      <rect x="0" y="0" width="960" height="540"/>
    </clipPath>
  </defs>

  <style type="text/css"><![CDATA[
    .wheel-spin {
      transform-origin: 0px 0px;
      animation: spin 2s linear infinite;
    }
    .wheel-spin-back {
      transform-origin: 0px 0px;
      animation: spin 2s linear infinite;
    }
    .pedal-crank {
      transform-origin: 0px 0px;
      animation: spin 2s linear infinite;
    }
    .foot-L {
      animation: footL 2s linear infinite;
    }
    .foot-R {
      animation: footR 2s linear infinite;
    }
    .rider-bob {
      animation: bob 1s ease-in-out infinite alternate;
    }
    .wing-flap {
      transform-origin: 480px 250px;
      animation: flap 1s ease-in-out infinite alternate;
    }
    .cloud-drift {
      animation: drift 8s linear infinite;
    }
    .leg-L {
      animation: legL 2s linear infinite;
    }
    .leg-R {
      animation: legR 2s linear infinite;
    }
    .pouch-sway {
      animation: pouch 2s ease-in-out infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes bob {
      from { transform: translateY(0px); }
      to { transform: translateY(4px); }
    }
    @keyframes flap {
      from { transform: rotate(-6deg); }
      to { transform: rotate(8deg); }
    }
    @keyframes drift {
      from { transform: translateX(0px); }
      to { transform: translateX(-480px); }
    }
    @keyframes footL {
      0%   { transform: translate(0px, 0px); }
      25%  { transform: translate(18px, 18px); }
      50%  { transform: translate(0px, 36px); }
      75%  { transform: translate(-18px, 18px); }
      100% { transform: translate(0px, 0px); }
    }
    @keyframes footR {
      0%   { transform: translate(0px, 36px); }
      25%  { transform: translate(-18px, 18px); }
      50%  { transform: translate(0px, 0px); }
      75%  { transform: translate(18px, 18px); }
      100% { transform: translate(0px, 36px); }
    }
    @keyframes legL {
      0%   { d: path('M 455 295 Q 448 320 440 348'); }
      25%  { d: path('M 455 295 Q 460 325 458 355'); }
      50%  { d: path('M 455 295 Q 468 330 475 360'); }
      75%  { d: path('M 455 295 Q 450 325 440 355'); }
      100% { d: path('M 455 295 Q 448 320 440 348'); }
    }
    @keyframes legR {
      0%   { d: path('M 470 295 Q 485 325 490 360'); }
      25%  { d: path('M 470 295 Q 475 320 465 350'); }
      50%  { d: path('M 470 295 Q 460 318 450 348'); }
      75%  { d: path('M 470 295 Q 480 328 488 355'); }
      100% { d: path('M 470 295 Q 485 325 490 360'); }
    }
    @keyframes pouch {
      0%, 100% { transform: translateY(0px) scaleY(1); }
      50% { transform: translateY(3px) scaleY(1.04); }
    }
  ]]></style>

  <!-- Sky -->
  <rect x="0" y="0" width="960" height="540" fill="url(#skyGrad)"/>

  <!-- Sun -->
  <circle cx="820" cy="90" r="48" fill="#FFE082" opacity="0.9"/>
  <circle cx="820" cy="90" r="38" fill="#FFD54F"/>

  <!-- Clouds (looping drift over 8s) -->
  <g class="cloud-drift" opacity="0.85">
    <g fill="#FFFFFF">
      <ellipse cx="120" cy="70" rx="40" ry="22"/>
      <ellipse cx="155" cy="65" rx="35" ry="26"/>
      <ellipse cx="185" cy="72" rx="30" ry="18"/>
      <ellipse cx="400" cy="100" rx="50" ry="24"/>
      <ellipse cx="445" cy="92" rx="40" ry="28"/>
      <ellipse cx="480" cy="102" rx="35" ry="20"/>
      <ellipse cx="680" cy="55" rx="45" ry="20"/>
      <ellipse cx="720" cy="50" rx="38" ry="25"/>
      <ellipse cx="755" cy="58" rx="28" ry="16"/>
      <!-- duplicate set for seamless loop -->
      <ellipse cx="600" cy="70" rx="40" ry="22"/>
      <ellipse cx="635" cy="65" rx="35" ry="26"/>
      <ellipse cx="665" cy="72" rx="30" ry="18"/>
      <ellipse cx="880" cy="100" rx="50" ry="24"/>
      <ellipse cx="925" cy="92" rx="40" ry="28"/>
      <ellipse cx="960" cy="102" rx="35" ry="20"/>
      <ellipse cx="1160" cy="55" rx="45" ry="20"/>
      <ellipse cx="1200" cy="50" rx="38" ry="25"/>
      <ellipse cx="1235" cy="58" rx="28" ry="16"/>
      <ellipse cx="1400" cy="70" rx="40" ry="22"/>
      <ellipse cx="1435" cy="65" rx="35" ry="26"/>
    </g>
  </g>

  <!-- Distant hills -->
  <path d="M0 320 Q120 280 240 310 T480 300 T720 315 T960 290 L960 380 L0 380 Z" fill="#81C784" opacity="0.7"/>
  <path d="M0 350 Q150 310 300 340 T600 330 T960 345 L960 400 L0 400 Z" fill="#66BB6A" opacity="0.8"/>

  <!-- Ground -->
  <rect x="0" y="400" width="960" height="140" fill="url(#groundGrad)"/>

  <!-- Road -->
  <ellipse cx="480" cy="430" rx="460" ry="55" fill="url(#roadGrad)"/>
  <ellipse cx="480" cy="425" rx="440" ry="42" fill="#90A4AE"/>

  <!-- Road dashes (static, under bike) -->
  <g stroke="#CFD8DC" stroke-width="4" stroke-dasharray="30 25" fill="none" opacity="0.7">
    <path d="M40 425 Q480 410 920 425"/>
  </g>

  <!-- Main scene group: pelican + bicycle centered -->
  <g transform="translate(0,10)">

    <!-- ========== BICYCLE ========== -->
    <!-- Rear wheel -->
    <g transform="translate(320, 380)">
      <g class="wheel-spin-back">
        <!-- tire -->
        <circle cx="0" cy="0" r="52" fill="none" stroke="#263238" stroke-width="8"/>
        <circle cx="0" cy="0" r="46" fill="none" stroke="#37474F" stroke-width="3"/>
        <!-- rim -->
        <circle cx="0" cy="0" r="40" fill="none" stroke="#B0BEC5" stroke-width="2.5"/>
        <!-- spokes -->
        <g stroke="#90A4AE" stroke-width="1.5">
          <line x1="0" y1="0" x2="0" y2="-40"/>
          <line x1="0" y1="0" x2="0" y2="40"/>
          <line x1="0" y1="0" x2="40" y2="0"/>
          <line x1="0" y1="0" x2="-40" y2="0"/>
          <line x1="0" y1="0" x2="28.3" y2="-28.3"/>
          <line x1="0" y1="0" x2="-28.3" y2="28.3"/>
          <line x1="0" y1="0" x2="28.3" y2="28.3"/>
          <line x1="0" y1="0" x2="-28.3" y2="-28.3"/>
          <line x1="0" y1="0" x2="15.3" y2="-37"/>
          <line x1="0" y1="0" x2="-15.3" y2="37"/>
          <line x1="0" y1="0" x2="37" y2="-15.3"/>
          <line x1="0" y1="0" x2="-37" y2="15.3"/>
        </g>
        <circle cx="0" cy="0" r="8" fill="url(#hubGrad)"/>
        <circle cx="0" cy="0" r="4" fill="#455A64"/>
      </g>
    </g>

    <!-- Front wheel -->
    <g transform="translate(580, 380)">
      <g class="wheel-spin">
        <circle cx="0" cy="0" r="52" fill="none" stroke="#263238" stroke-width="8"/>
        <circle cx="0" cy="0" r="46" fill="none" stroke="#37474F" stroke-width="3"/>
        <circle cx="0" cy="0" r="40" fill="none" stroke="#B0BEC5" stroke-width="2.5"/>
        <g stroke="#90A4AE" stroke-width="1.5">
          <line x1="0" y1="0" x2="0" y2="-40"/>
          <line x1="0" y1="0" x2="0" y2="40"/>
          <line x1="0" y1="0" x2="40" y2="0"/>
          <line x1="0" y1="0" x2="-40" y2="0"/>
          <line x1="0" y1="0" x2="28.3" y2="-28.3"/>
          <line x1="0" y1="0" x2="-28.3" y2="28.3"/>
          <line x1="0" y1="0" x2="28.3" y2="28.3"/>
          <line x1="0" y1="0" x2="-28.3" y2="-28.3"/>
          <line x1="0" y1="0" x2="15.3" y2="-37"/>
          <line x1="0" y1="0" x2="-15.3" y2="37"/>
          <line x1="0" y1="0" x2="37" y2="-15.3"/>
          <line x1="0" y1="0" x2="-37" y2="15.3"/>
        </g>
        <circle cx="0" cy="0" r="8" fill="url(#hubGrad)"/>
        <circle cx="0" cy="0" r="4" fill="#455A64"/>
      </g>
    </g>

    <!-- Frame -->
    <g stroke="url(#frameGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- seat tube -->
      <line x1="380" y1="280" x2="340" y2="375"/>
      <!-- down tube -->
      <line x1="380" y1="280" x2="480" y2="355"/>
      <!-- top tube -->
      <line x1="380" y1="280" x2="520" y2="275"/>
      <!-- seat stays -->
      <line x1="380" y1="280" x2="320" y2="375"/>
      <!-- chain stays -->
      <line x1="340" y1="375" x2="480" y2="355"/>
      <!-- fork -->
      <line x1="520" y1="275" x2="580" y2="375"/>
      <line x1="530" y1="300" x2="570" y2="375"/>
    </g>
    <!-- frame highlight accents -->
    <g stroke="#90CAF9" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5">
      <line x1="382" y1="285" x2="515" y2="280"/>
      <line x1="382" y1="285" x2="478" y2="350"/>
    </g>

    <!-- Handlebars -->
    <g stroke="#37474F" stroke-width="5" stroke-linecap="round" fill="none">
      <line x1="520" y1="275" x2="535" y2="245"/>
      <path d="M505 248 Q535 230 565 248"/>
    </g>
    <circle cx="505" cy="248" r="6" fill="#455A64"/>
    <circle cx="565" cy="248" r="6" fill="#455A64"/>
    <!-- grips -->
    <rect x="498" y="244" width="14" height="8" rx="3" fill="#5D4037"/>
    <rect x="558" y="244" width="14" height="8" rx="3" fill="#5D4037"/>

    <!-- Seat -->
    <ellipse cx="375" cy="272" rx="28" ry="10" fill="#4E342E"/>
    <ellipse cx="370" cy="268" rx="20" ry="6" fill="#6D4C41"/>

    <!-- Chain ring + crank + pedals -->
    <g transform="translate(480, 355)">
      <!-- chain ring -->
      <circle cx="0" cy="0" r="16" fill="none" stroke="#607D8B" stroke-width="4"/>
      <circle cx="0" cy="0" r="10" fill="none" stroke="#78909C" stroke-width="2"/>
      <g class="pedal-crank">
        <!-- crank arms -->
        <line x1="0" y1="0" x2="0" y2="-28" stroke="#455A64" stroke-width="5" stroke-linecap="round"/>
        <line x1="0" y1="0" x2="0" y2="28" stroke="#455A64" stroke-width="5" stroke-linecap="round"/>
        <!-- pedal platforms -->
        <rect x="-12" y="-34" width="24" height="8" rx="2" fill="#37474F"/>
        <rect x="-12" y="26" width="24" height="8" rx="2" fill="#37474F"/>
      </g>
      <circle cx="0" cy="0" r="5" fill="#546E7A"/>
    </g>

    <!-- Chain (simplified) -->
    <path d="M320 380 Q400 370 464 355" fill="none" stroke="#546E7A" stroke-width="2.5" stroke-dasharray="4 3" opacity="0.8"/>

    <!-- ========== PELICAN ========== -->
    <g class="rider-bob">

      <!-- Legs (behind body somewhat, connected to pedals) -->
      <!-- Left leg (far) -->
      <g>
        <path d="M455 295 Q448 320 440 348" fill="none" stroke="#F5F0E6" stroke-width="14" stroke-linecap="round"/>
        <path d="M455 295 Q448 320 440 348" fill="none" stroke="#E8E0D0" stroke-width="8" stroke-linecap="round"/>
        <!-- left foot -->
        <g class="foot-L" transform="translate(440, 348)">
          <ellipse cx="0" cy="4" rx="14" ry="7" fill="#FF9800"/>
          <ellipse cx="6" cy="2" rx="8" ry="5" fill="#FFB74D"/>
          <!-- webbed toes -->
          <path d="M8 0 Q16 -2 18 4 Q12 6 8 4" fill="#FF9800"/>
          <path d="M6 2 Q12 8 8 10 Q4 6 6 2" fill="#F57C00"/>
        </g>
      </g>

      <!-- Right leg (near) -->
      <g>
        <path d="M470 295 Q485 325 490 360" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>
        <path d="M470 295 Q485 325 490 360" fill="none" stroke="#F5F5F0" stroke-width="8" stroke-linecap="round"/>
        <!-- right foot -->
        <g class="foot-R" transform="translate(452, 324)">
          <ellipse cx="0" cy="4" rx="14" ry="7" fill="#FF9800"/>
          <ellipse cx="6" cy="2" rx="8" ry="5" fill="#FFB74D"/>
          <path d="M8 0 Q16 -2 18 4 Q12 6 8 4" fill="#FF9800"/>
          <path d="M6 2 Q12 8 8 10 Q4 6 6 2" fill="#F57C00"/>
        </g>
      </g>

      <!-- Body -->
      <ellipse cx="460" cy="255" rx="55" ry="42" fill="url(#pelicanBody)"/>
      <ellipse cx="455" cy="260" rx="40" ry="30" fill="#FFFFFF" opacity="0.5"/>

      <!-- Tail feathers -->
      <g transform="translate(405, 270)">
        <path d="M0 0 Q-25 -15 -45 -5 Q-30 5 -20 8 Q-30 10 -40 20 Q-15 12 0 5 Z" fill="#FF8C42"/>
        <path d="M0 -5 Q-20 -25 -38 -18 Q-25 -5 -10 0 Z" fill="#E86A17"/>
        <path d="M5 5 Q-15 15 -30 28 Q-10 15 5 10 Z" fill="#C45A10"/>
      </g>

      <!-- Wing (animated flap) -->
      <g class="wing-flap">
        <path d="M430 240 Q380 200 340 220 Q360 250 390 255 Q410 260 435 250 Z" fill="url(#pelicanWing)"/>
        <path d="M425 245 Q390 215 360 225 Q375 245 400 250 Q415 252 428 248 Z" fill="#FFB074" opacity="0.6"/>
        <!-- wing feather lines -->
        <g stroke="#C45A10" stroke-width="1" fill="none" opacity="0.5">
          <path d="M420 248 Q390 230 365 235"/>
          <path d="M425 242 Q395 220 370 228"/>
          <path d="M430 238 Q400 215 380 222"/>
        </g>
      </g>

      <!-- Neck -->
      <path d="M490 235 Q530 200 545 160 Q550 140 540 125" fill="none" stroke="#F5F5F0" stroke-width="22" stroke-linecap="round"/>
      <path d="M490 235 Q530 200 545 160 Q550 140 540 125" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>

      <!-- Throat pouch -->
      <g class="pouch-sway" style="transform-origin: 555px 155px;">
        <path d="M535 145 Q575 160 580 190 Q570 200 545 185 Q525 170 535 145 Z" fill="#FFCC80"/>
        <path d="M540 150 Q565 162 570 185 Q560 190 545 178 Q530 165 540 150 Z" fill="#FFE0B2" opacity="0.7"/>
      </g>

      <!-- Head -->
      <ellipse cx="535" cy="115" rx="28" ry="24" fill="#FFFFFF"/>
      <ellipse cx="530" cy="118" rx="20" ry="16" fill="#FAFAFA"/>

      <!-- Beak (upper) -->
      <path d="M555 108 Q620 95 680 115 Q640 125 600 120 Q575 118 555 115 Z" fill="url(#beakGrad)"/>
      <!-- Beak (lower / mandible with pouch connection) -->
      <path d="M555 118 Q610 125 670 120 Q640 140 600 138 Q570 135 555 125 Z" fill="#FF9800"/>
      <path d="M555 115 Q600 122 650 118" fill="none" stroke="#E65100" stroke-width="1.5" opacity="0.5"/>

      <!-- Eye -->
      <circle cx="525" cy="108" r="7" fill="#212121"/>
      <circle cx="527" cy="106" r="2.5" fill="#FFFFFF"/>
      <circle cx="523" cy="110" r="1.5" fill="#FFFFFF" opacity="0.6"/>

      <!-- Head crest / feathers -->
      <path d="M510 100 Q500 85 505 75 Q512 88 515 95" fill="#FF8C42"/>
      <path d="M518 95 Q512 78 520 70 Q525 85 528 92" fill="#E86A17"/>
      <path d="M528 92 Q525 80 535 72 Q538 86 538 95" fill="#FF8C42"/>

      <!-- Wings holding handlebars suggestion - near wing tip / arm -->
      <path d="M500 250 Q520 240 530 250 Q535 255 525 260 Q510 258 500 250" fill="#FFE0B2" opacity="0.9"/>
      <!-- left "hand" on handlebar -->
      <ellipse cx="510" cy="250" rx="10" ry="7" fill="#FF9800"/>
      <ellipse cx="555" cy="250" rx="10" ry="7" fill="#FF9800"/>

    </g>
  </g>

  <!-- Soft ground shadow under bike -->
  <ellipse cx="450" cy="435" rx="180" ry="12" fill="#33691E" opacity="0.35"/>

  <!-- Foreground grass tufts -->
  <g fill="#43A047" opacity="0.9">
    <path d="M30 480 Q35 460 40 480 Q45 465 50 480 Z"/>
    <path d="M80 500 Q88 475 95 500 Q100 485 108 500 Z"/>
    <path d="M150 490 Q155 470 162 490 Q168 475 175 490 Z"/>
    <path d="M850 485 Q858 460 865 485 Q870 470 878 485 Z"/>
    <path d="M900 500 Q908 478 915 500 Q922 485 930 500 Z"/>
    <path d="M780 495 Q785 475 792 495 Q798 480 805 495 Z"/>
  </g>

</svg>