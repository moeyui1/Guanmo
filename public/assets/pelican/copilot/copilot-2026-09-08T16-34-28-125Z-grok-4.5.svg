<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="70%" stop-color="#B8E0F0"/>
      <stop offset="100%" stop-color="#E8F4E8"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7CB342"/>
      <stop offset="100%" stop-color="#558B2F"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8E8E0"/>
    </linearGradient>
    <linearGradient id="wingGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5F5F0"/>
      <stop offset="100%" stop-color="#D0D0C8"/>
    </linearGradient>
    <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF8C42"/>
      <stop offset="100%" stop-color="#E86A17"/>
    </linearGradient>
    <linearGradient id="frameGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#D84315"/>
    </linearGradient>
    <radialGradient id="wheelHub" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </radialGradient>
    <clipPath id="sceneClip">
      <rect x="0" y="0" width="960" height="540"/>
    </clipPath>
  </defs>

  <!-- Sky -->
  <rect width="960" height="540" fill="url(#skyGrad)"/>

  <!-- Distant hills -->
  <ellipse cx="150" cy="380" rx="220" ry="60" fill="#A5D6A7" opacity="0.7"/>
  <ellipse cx="500" cy="390" rx="280" ry="50" fill="#81C784" opacity="0.6"/>
  <ellipse cx="820" cy="385" rx="200" ry="55" fill="#A5D6A7" opacity="0.65"/>

  <!-- Ground -->
  <rect y="400" width="960" height="140" fill="url(#groundGrad)"/>
  <ellipse cx="480" cy="410" rx="500" ry="25" fill="#66BB6A" opacity="0.4"/>

  <!-- Road -->
  <rect y="430" width="960" height="50" fill="#5D4E37"/>
  <rect y="448" width="960" height="8" fill="#F5E6C8" opacity="0.6"/>
  <!-- Dashed center line moving -->
  <g>
    <rect x="-200" y="450" width="60" height="4" rx="1" fill="#FFF8E1" opacity="0.85">
      <animate attributeName="x" values="-200;1000" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect x="40" y="450" width="60" height="4" rx="1" fill="#FFF8E1" opacity="0.85">
      <animate attributeName="x" values="40;1240" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect x="280" y="450" width="60" height="4" rx="1" fill="#FFF8E1" opacity="0.85">
      <animate attributeName="x" values="280;1480" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect x="520" y="450" width="60" height="4" rx="1" fill="#FFF8E1" opacity="0.85">
      <animate attributeName="x" values="520;1720" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect x="760" y="450" width="60" height="4" rx="1" fill="#FFF8E1" opacity="0.85">
      <animate attributeName="x" values="760;1960" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Soft clouds drifting -->
  <g opacity="0.85">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 30,0; 0,0" dur="8s" repeatCount="indefinite"/>
      <ellipse cx="120" cy="80" rx="50" ry="22" fill="#fff"/>
      <ellipse cx="150" cy="70" rx="40" ry="28" fill="#fff"/>
      <ellipse cx="175" cy="82" rx="35" ry="18" fill="#fff"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; -25,0; 0,0" dur="8s" repeatCount="indefinite"/>
      <ellipse cx="700" cy="60" rx="55" ry="20" fill="#fff"/>
      <ellipse cx="740" cy="52" rx="45" ry="26" fill="#fff"/>
      <ellipse cx="775" cy="65" rx="38" ry="16" fill="#fff"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 20,0; 0,0" dur="8s" repeatCount="indefinite"/>
      <ellipse cx="420" cy="100" rx="40" ry="16" fill="#fff" opacity="0.7"/>
      <ellipse cx="450" cy="95" rx="30" ry="20" fill="#fff" opacity="0.7"/>
    </g>
  </g>

  <!-- Sun -->
  <circle cx="880" cy="70" r="36" fill="#FFE082" opacity="0.9"/>
  <circle cx="880" cy="70" r="28" fill="#FFD54F"/>

  <!-- Main rider group with gentle bob -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-4; 0,0; 0,-3; 0,0" dur="1s" repeatCount="indefinite"/>

    <!-- Bicycle and pelican centered around (480, 360) -->
    <g transform="translate(480, 360)">

      <!-- Rear wheel -->
      <g transform="translate(-110, 40)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
          <!-- Tire -->
          <circle r="52" fill="none" stroke="#2C2C2C" stroke-width="10"/>
          <circle r="46" fill="none" stroke="#1A1A1A" stroke-width="2"/>
          <!-- Rim -->
          <circle r="40" fill="none" stroke="#B0BEC5" stroke-width="3"/>
          <!-- Spokes -->
          <g stroke="#90A4AE" stroke-width="1.5" opacity="0.9">
            <line x1="0" y1="-40" x2="0" y2="40"/>
            <line x1="-40" y1="0" x2="40" y2="0"/>
            <line x1="-28.3" y1="-28.3" x2="28.3" y2="28.3"/>
            <line x1="28.3" y1="-28.3" x2="-28.3" y2="28.3"/>
            <line x1="-14.6" y1="-37.3" x2="14.6" y2="37.3"/>
            <line x1="14.6" y1="-37.3" x2="-14.6" y2="37.3"/>
            <line x1="-37.3" y1="-14.6" x2="37.3" y2="14.6"/>
            <line x1="37.3" y1="-14.6" x2="-37.3" y2="14.6"/>
          </g>
          <!-- Hub -->
          <circle r="10" fill="url(#wheelHub)"/>
          <circle r="5" fill="#FF8F00"/>
        </g>
      </g>

      <!-- Front wheel -->
      <g transform="translate(100, 40)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
          <circle r="52" fill="none" stroke="#2C2C2C" stroke-width="10"/>
          <circle r="46" fill="none" stroke="#1A1A1A" stroke-width="2"/>
          <circle r="40" fill="none" stroke="#B0BEC5" stroke-width="3"/>
          <g stroke="#90A4AE" stroke-width="1.5" opacity="0.9">
            <line x1="0" y1="-40" x2="0" y2="40"/>
            <line x1="-40" y1="0" x2="40" y2="0"/>
            <line x1="-28.3" y1="-28.3" x2="28.3" y2="28.3"/>
            <line x1="28.3" y1="-28.3" x2="-28.3" y2="28.3"/>
            <line x1="-14.6" y1="-37.3" x2="14.6" y2="37.3"/>
            <line x1="14.6" y1="-37.3" x2="-14.6" y2="37.3"/>
            <line x1="-37.3" y1="-14.6" x2="37.3" y2="14.6"/>
            <line x1="37.3" y1="-14.6" x2="-37.3" y2="14.6"/>
          </g>
          <circle r="10" fill="url(#wheelHub)"/>
          <circle r="5" fill="#FF8F00"/>
        </g>
      </g>

      <!-- Bike frame -->
      <g stroke="url(#frameGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <!-- Main triangle -->
        <path d="M -110,40 L -20,-20 L 40,40 Z"/>
        <!-- Top tube extension to seat -->
        <path d="M -20,-20 L -55,-5"/>
        <!-- Down tube / chain stay feel -->
        <path d="M -20,-20 L 100,40"/>
        <!-- Seat stays -->
        <path d="M -55,-5 L -110,40"/>
        <!-- Fork -->
        <path d="M 55,-15 L 100,40"/>
        <!-- Head tube area -->
        <path d="M 40,-25 L 55,-15"/>
      </g>

      <!-- Seat post and saddle -->
      <line x1="-55" y1="-5" x2="-55" y2="-35" stroke="#D84315" stroke-width="5" stroke-linecap="round"/>
      <ellipse cx="-52" cy="-40" rx="22" ry="8" fill="#5D4037"/>
      <ellipse cx="-48" cy="-42" rx="14" ry="5" fill="#6D4C41"/>

      <!-- Handlebars -->
      <g stroke="#455A64" stroke-width="5" stroke-linecap="round" fill="none">
        <path d="M 55,-15 L 55,-45"/>
        <path d="M 40,-50 Q 55,-55 70,-50"/>
        <path d="M 40,-50 L 35,-40"/>
        <path d="M 70,-50 L 75,-40"/>
      </g>
      <!-- Grips -->
      <circle cx="35" cy="-38" r="5" fill="#37474F"/>
      <circle cx="75" cy="-38" r="5" fill="#37474F"/>

      <!-- Chain ring / crank center -->
      <circle cx="-5" cy="40" r="14" fill="none" stroke="#78909C" stroke-width="4"/>
      <circle cx="-5" cy="40" r="6" fill="#FFB300"/>

      <!-- Pedal cranks and feet (rotating) -->
      <g transform="translate(-5, 40)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
          <!-- Crank arm 1 -->
          <line x1="0" y1="0" x2="0" y2="-28" stroke="#546E7A" stroke-width="5" stroke-linecap="round"/>
          <!-- Pedal 1 -->
          <rect x="-10" y="-34" width="20" height="8" rx="2" fill="#37474F"/>
          <!-- Foot on pedal 1 (orange webbed) -->
          <g transform="translate(0, -30)">
            <ellipse cx="0" cy="0" rx="14" ry="8" fill="#FF8C42"/>
            <ellipse cx="-8" cy="4" rx="5" ry="3" fill="#E86A17"/>
            <ellipse cx="0" cy="5" rx="5" ry="3" fill="#E86A17"/>
            <ellipse cx="8" cy="4" rx="5" ry="3" fill="#E86A17"/>
          </g>
          <!-- Crank arm 2 -->
          <line x1="0" y1="0" x2="0" y2="28" stroke="#546E7A" stroke-width="5" stroke-linecap="round"/>
          <!-- Pedal 2 -->
          <rect x="-10" y="26" width="20" height="8" rx="2" fill="#37474F"/>
          <!-- Foot on pedal 2 -->
          <g transform="translate(0, 30)">
            <ellipse cx="0" cy="0" rx="14" ry="8" fill="#FF8C42"/>
            <ellipse cx="-8" cy="4" rx="5" ry="3" fill="#E86A17"/>
            <ellipse cx="0" cy="5" rx="5" ry="3" fill="#E86A17"/>
            <ellipse cx="8" cy="4" rx="5" ry="3" fill="#E86A17"/>
          </g>
        </g>
      </g>

      <!-- Chain (simple links suggestion) -->
      <path d="M -5,54 Q -55,58 -110,40" fill="none" stroke="#78909C" stroke-width="2.5" stroke-dasharray="4 3" opacity="0.8"/>

      <!-- === PELICAN === -->

      <!-- Legs (upper, from body to pedals area) -->
      <g stroke="#FF8C42" stroke-width="6" stroke-linecap="round" fill="none">
        <path d="M -25,-20 Q -20,10 -5,20">
          <animate attributeName="d" values="M -25,-20 Q -20,10 -5,20; M -25,-20 Q -15,5 -5,12; M -25,-20 Q -20,10 -5,20; M -30,-20 Q -25,8 -5,28; M -25,-20 Q -20,10 -5,20" dur="1.2s" repeatCount="indefinite"/>
        </path>
        <path d="M 5,-18 Q 10,12 -5,20">
          <animate attributeName="d" values="M 5,-18 Q 10,12 -5,20; M 5,-18 Q 0,8 -5,28; M 5,-18 Q 10,12 -5,20; M 5,-18 Q 15,5 -5,12; M 5,-18 Q 10,12 -5,20" dur="1.2s" repeatCount="indefinite"/>
        </path>
      </g>

      <!-- Body -->
      <ellipse cx="-10" cy="-55" rx="55" ry="42" fill="url(#bodyGrad)"/>
      <ellipse cx="-5" cy="-50" rx="40" ry="32" fill="#FAFAF5" opacity="0.5"/>

      <!-- Tail feathers -->
      <g transform="translate(-60, -45)">
        <ellipse cx="0" cy="0" rx="18" ry="10" fill="#E0E0D8" transform="rotate(-20)"/>
        <ellipse cx="-8" cy="8" rx="14" ry="8" fill="#D0D0C8" transform="rotate(-35)"/>
        <ellipse cx="-5" cy="-8" rx="12" ry="7" fill="#E8E8E0" transform="rotate(-10)"/>
      </g>

      <!-- Wing (near side) with gentle flap -->
      <g transform="translate(5, -60)">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="0; 8; 0; -5; 0" dur="2s" repeatCount="indefinite"/>
          <path d="M 0,0 Q 50,-30 70,10 Q 40,25 10,20 Q 5,10 0,0" fill="url(#wingGrad)" stroke="#C8C8C0" stroke-width="1"/>
          <path d="M 15,5 Q 40,-10 55,8" fill="none" stroke="#BDBDB5" stroke-width="1.5" opacity="0.6"/>
          <path d="M 12,12 Q 35,0 48,15" fill="none" stroke="#BDBDB5" stroke-width="1.2" opacity="0.5"/>
        </g>
      </g>

      <!-- Far wing tip peeking -->
      <ellipse cx="-30" cy="-75" rx="25" ry="12" fill="#E8E8E0" transform="rotate(-30 -30 -75)" opacity="0.9"/>

      <!-- Neck -->
      <path d="M 20,-70 Q 45,-100 55,-75 Q 60,-55 45,-45" fill="url(#bodyGrad)" stroke="#E0E0D8" stroke-width="1"/>
      <path d="M 28,-68 Q 48,-90 52,-70" fill="#FAFAF5" opacity="0.4"/>

      <!-- Head -->
      <g transform="translate(58, -80)">
        <!-- Head bob subtle -->
        <animateTransform attributeName="transform" type="translate" values="0,0; 1,-2; 0,0; -1,1; 0,0" dur="2s" repeatCount="indefinite"/>
        <ellipse cx="0" cy="0" rx="28" ry="24" fill="url(#bodyGrad)"/>
        <ellipse cx="5" cy="-2" rx="20" ry="18" fill="#FFFEF8" opacity="0.5"/>

        <!-- Eye -->
        <circle cx="12" cy="-5" r="7" fill="#1A1A1A"/>
        <circle cx="14" cy="-7" r="2.5" fill="#fff"/>
        <circle cx="10" cy="-3" r="1.2" fill="#fff" opacity="0.6"/>

        <!-- Beak - distinctive pelican pouch -->
        <g transform="translate(18, 5)">
          <!-- Upper beak -->
          <path d="M 0,-8 L 55,-12 Q 70,-8 68,0 L 0,4 Z" fill="url(#beakGrad)"/>
          <!-- Pouch (lower) -->
          <path d="M 0,4 Q 20,35 55,8 Q 40,5 0,4" fill="#FFB74D"/>
          <path d="M 5,6 Q 25,28 50,8" fill="none" stroke="#E86A17" stroke-width="1" opacity="0.4"/>
          <!-- Beak tip -->
          <path d="M 55,-12 Q 72,-10 70,0 Q 68,2 55,0" fill="#E65100"/>
          <!-- Nostril line -->
          <line x1="8" y1="-6" x2="25" y2="-8" stroke="#E65100" stroke-width="1.5" opacity="0.5"/>
        </g>

        <!-- Small crest feathers -->
        <path d="M -15,-18 Q -20,-35 -5,-28" fill="none" stroke="#D0D0C8" stroke-width="3" stroke-linecap="round"/>
        <path d="M -8,-20 Q -5,-38 8,-30" fill="none" stroke="#E0E0D8" stroke-width="2.5" stroke-linecap="round"/>
      </g>

      <!-- Wing feathers detail near body -->
      <path d="M -15,-40 Q 0,-35 15,-42" fill="none" stroke="#D0D0C8" stroke-width="1.5" opacity="0.5"/>

      <!-- Belly highlight -->
      <ellipse cx="-5" cy="-40" rx="25" ry="18" fill="#fff" opacity="0.35"/>
    </g>
  </g>

  <!-- Ground shadow under bike -->
  <ellipse cx="480" cy="455" rx="160" ry="12" fill="#33691E" opacity="0.25">
    <animate attributeName="rx" values="160;155;160;158;160" dur="1s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Small flowers / grass tufts for scene life -->
  <g fill="#8BC34A">
    <g transform="translate(80, 420)">
      <line x1="0" y1="0" x2="-5" y2="-15" stroke="#689F38" stroke-width="2"/>
      <line x1="0" y1="0" x2="5" y2="-14" stroke="#689F38" stroke-width="2"/>
      <line x1="0" y1="0" x2="0" y2="-18" stroke="#689F38" stroke-width="2"/>
      <circle cx="-5" cy="-16" r="3" fill="#FFEB3B"/>
      <circle cx="5" cy="-15" r="3" fill="#FFC107"/>
    </g>
    <g transform="translate(200, 425)">
      <line x1="0" y1="0" x2="-4" y2="-12" stroke="#689F38" stroke-width="2"/>
      <line x1="0" y1="0" x2="4" y2="-13" stroke="#689F38" stroke-width="2"/>
      <circle cx="0" cy="-14" r="3" fill="#E91E63"/>
    </g>
    <g transform="translate(750, 418)">
      <line x1="0" y1="0" x2="-6" y2="-16" stroke="#689F38" stroke-width="2"/>
      <line x1="0" y1="0" x2="3" y2="-15" stroke="#689F38" stroke-width="2"/>
      <line x1="0" y1="0" x2="8" y2="-12" stroke="#689F38" stroke-width="2"/>
      <circle cx="-6" cy="-17" r="3" fill="#FFEB3B"/>
      <circle cx="8" cy="-13" r="2.5" fill="#FF9800"/>
    </g>
    <g transform="translate(880, 422)">
      <line x1="0" y1="0" x2="-3" y2="-14" stroke="#689F38" stroke-width="2"/>
      <line x1="0" y1="0" x2="5" y2="-12" stroke="#689F38" stroke-width="2"/>
      <circle cx="1" cy="-14" r="3.5" fill="#F44336"/>
    </g>
  </g>

  <!-- Subtle dust puffs near rear wheel for motion -->
  <g opacity="0.4">
    <ellipse cx="340" cy="445" rx="8" ry="4" fill="#A1887F">
      <animate attributeName="cx" values="340;300;340" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0;0.4" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="rx" values="6;14;6" dur="1.2s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="360" cy="448" rx="5" ry="3" fill="#BCAAA4">
      <animate attributeName="cx" values="360;320;360" dur="1.2s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.35;0;0.35" dur="1.2s" begin="0.3s" repeatCount="indefinite"/>
    </ellipse>
  </g>
</svg>