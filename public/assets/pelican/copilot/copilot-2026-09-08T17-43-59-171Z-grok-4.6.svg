  <style>
    .spinW { animation: spinW 8s linear infinite; }
    .spinC { animation: spinC 8s linear infinite; }
    .spinP { animation: spinP 8s linear infinite; }
    .bob { animation: bob 1s ease-in-out infinite; }
    .blink { animation: blink 8s ease-in-out infinite; transform-origin: 522px 194px; }
    .pouch { animation: pouch 2s ease-in-out infinite; }
    .wing { animation: wing 1s ease-in-out infinite; transform-origin: 448px 298px; }
    .sway1 { animation: sway 2s ease-in-out infinite; transform-origin: 70px 530px; }
    .sway2 { animation: sway 2s ease-in-out infinite 0.4s; transform-origin: 180px 532px; }
    .sway3 { animation: sway 2s ease-in-out infinite 0.9s; transform-origin: 820px 528px; }
    .sway4 { animation: sway 2s ease-in-out infinite 0.2s; transform-origin: 900px 534px; }
    .cloud { animation: cloud 8s linear infinite; }
    .pulse { animation: pulse 8s ease-in-out infinite; }
    .chain { stroke-dasharray: 5 4; animation: chain 0.5s linear infinite; }
    @keyframes spinW { from { transform: rotate(0deg); } to { transform: rotate(1440deg); } }
    @keyframes spinC { from { transform: rotate(0deg); } to { transform: rotate(1440deg); } }
    @keyframes spinP { from { transform: rotate(0deg); } to { transform: rotate(-1440deg); } }
    @keyframes bob { 0%,100% { transform: translate(0,0); } 50% { transform: translate(0,4px); } }
    @keyframes blink { 0%,90%,96%,100% { transform: scaleY(1); } 93% { transform: scaleY(0.08); } }
    @keyframes pouch { 0%,100% { transform: translate(0,0) rotate(0deg); } 50% { transform: translate(1px,2px) rotate(1.2deg); } }
    @keyframes wing { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(3deg); } }
    @keyframes sway { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(5deg); } }
    @keyframes cloud { from { transform: translate(0,0); } to { transform: translate(-960px,0); } }
    @keyframes pulse { 0%,100% { opacity: 0.22; } 50% { opacity: 0.4; } }
    @keyframes chain { to { stroke-dashoffset: -18; } }
  </style>
