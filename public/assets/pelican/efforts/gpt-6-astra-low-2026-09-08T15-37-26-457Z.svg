    <circle cx="522" cy="102" r="6" fill="#263e47"/>
    <circle cx="524" cy="100" r="2" fill="#fff"/>
    <path d="M513 86Q522 82 530 87" fill="none" stroke="#344f59" stroke-width="3" stroke-linecap="round"/>

