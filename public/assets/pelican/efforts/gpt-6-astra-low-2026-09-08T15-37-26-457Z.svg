  <rect width="960" height="540" fill="url(#sky)"/>
  <circle cx="758" cy="100" r="54" fill="#fff3be"/>
  <circle cx="758" cy="100" r="66" fill="none" stroke="#fff3be" stroke-width="2" opacity=".4"/>

  <g fill="#fffdf0" opacity=".85">
