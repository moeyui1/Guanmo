<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fd3ff"/>
      <stop offset="100%" stop-color="#dff4ff"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6fbe63"/>
      <stop offset="100%" stop-color="#4a9b48"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff7ba" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fff7ba" stop-opacity="0"/>
    </radialGradient>
    <style>
      .line{stroke:#25323b;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

  <rect width="960" height="540" fill="url(#sky)"/>
  <circle cx="130" cy="95" r="70" fill="url(#sunGlow)"/>
  <circle cx="130" cy="95" r="38" fill="#ffe27a"/>

  <g opacity="0.9" fill="#ffffff">
    <g transform="translate(120 110)">
      <ellipse cx="0" cy="0" rx="44" ry="20"/>
      <ellipse cx="35" cy="-8" rx="34" ry="16"/>
      <ellipse cx="-35" cy="-6" rx="30" ry="14"/>
      <animateTransform attributeName="transform" type="translate" values="120 110;160 108;120 110" dur="8s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(650 85)">
      <ellipse cx="0" cy="0" rx="50" ry="22"/>
      <ellipse cx="-38" cy="-7" rx="34" ry="14"/>
      <ellipse cx="42" cy="-6" rx="30" ry="13"/>
      <animateTransform attributeName="transform" type="translate" values="650 85;610 88;650 85" dur="8s" repeatCount="indefinite"/>
    </g>
  </g>

  <rect y="380" width="960" height="160" fill="url(#ground)"/>
  <rect y="390" width="960" height="72" fill="#5b5b64"/>
  <g stroke="#dcdce2" stroke-width="6" opacity="0.65">
    <line x1="40" y1="426" x2="140" y2="426"/>
    <line x1="200" y1="426" x2="300" y2="426"/>
    <line x1="360" y1="426" x2="460" y2="426"/>
    <line x1="520" y1="426" x2="620" y2="426"/>
    <line x1="680" y1="426" x2="780" y2="426"/>
    <line x1="840" y1="426" x2="940" y2="426"/>
  </g>

  <g transform="translate(480 230)">
    <animateTransform attributeName="transform" type="translate" values="480 230;480 226;480 230" dur="2s" repeatCount="indefinite"/>

    <!-- Bicycle -->
    <g>
      <!-- Wheels -->
      <g transform="translate(-190 190)">
        <circle r="88" fill="#1f2429"/>
        <circle r="76" fill="#f2f7fb" stroke="#1f2429" stroke-width="5"/>
        <g class="line" stroke="#8aa0b1" stroke-width="3">
          <line x1="-76" y1="0" x2="76" y2="0"/>
          <line x1="0" y1="-76" x2="0" y2="76"/>
          <line x1="-54" y1="-54" x2="54" y2="54"/>
          <line x1="-54" y1="54" x2="54" y2="-54"/>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
        </g>
        <circle r="9" fill="#4f606d"/>
      </g>

      <g transform="translate(190 190)">
        <circle r="88" fill="#1f2429"/>
        <circle r="76" fill="#f2f7fb" stroke="#1f2429" stroke-width="5"/>
        <g class="line" stroke="#8aa0b1" stroke-width="3">
          <line x1="-76" y1="0" x2="76" y2="0"/>
          <line x1="0" y1="-76" x2="0" y2="76"/>
          <line x1="-54" y1="-54" x2="54" y2="54"/>
          <line x1="-54" y1="54" x2="54" y2="-54"/>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
        </g>
        <circle r="9" fill="#4f606d"/>
      </g>

      <!-- Frame -->
      <g class="line" fill="none" stroke="#2f7db7" stroke-width="10">
        <line x1="-190" y1="190" x2="0" y2="190"/>
        <line x1="0" y1="190" x2="190" y2="190"/>
        <line x1="-190" y1="190" x2="-40" y2="95"/>
        <line x1="-40" y1="95" x2="0" y2="190"/>
        <line x1="-40" y1="95" x2="120" y2="95"/>
        <line x1="120" y1="95" x2="190" y2="190"/>
      </g>

      <!-- Seat and handlebar -->
      <g class="line" stroke="#25323b" stroke-width="8" fill="none">
        <line x1="-40" y1="95" x2="-40" y2="62"/>
        <line x1="120" y1="95" x2="126" y2="55"/>
      </g>
      <rect x="-68" y="48" width="56" height="12" rx="6" fill="#25323b"/>
      <path d="M100 55 Q125 42 152 52" class="line" stroke="#25323b" stroke-width="8" fill="none"/>

      <!-- Crank + pedals -->
      <circle cx="0" cy="190" r="20" fill="#4f606d" stroke="#25323b" stroke-width="4"/>
      <g class="line" stroke="#25323b" stroke-width="6">
        <animateTransform attributeName="transform" type="rotate" from="0 0 190" to="360 0 190" dur="8s" repeatCount="indefinite"/>
        <line x1="0" y1="190" x2="34" y2="190"/>
        <line x1="0" y1="190" x2="-34" y2="190"/>
        <rect x="28" y="184" width="20" height="12" rx="4" fill="#4a4f55"/>
        <rect x="-48" y="184" width="20" height="12" rx="4" fill="#4a4f55"/>
      </g>
    </g>

    <!-- Pelican -->
    <g>
      <ellipse cx="-18" cy="104" rx="70" ry="48" fill="#f8fbff" stroke="#25323b" stroke-width="3"/>
      <path d="M-64 100 Q-108 116 -86 132 Q-64 126 -50 113 Z" fill="#dfe8ef" stroke="#25323b" stroke-width="3"/>
      <path d="M-20 72 Q24 56 46 92 Q8 114 -26 98 Z" fill="#e8f1f7" stroke="#25323b" stroke-width="3">
        <animateTransform attributeName="transform" type="rotate" values="-2 -10 90;2 -10 90;-2 -10 90" dur="2s" repeatCount="indefinite"/>
      </path>

      <path d="M36 88 Q42 20 98 6 Q124 2 130 24 Q124 34 110 42 Q82 56 68 90 Z" fill="#f8fbff" stroke="#25323b" stroke-width="3"/>
      <ellipse cx="102" cy="20" rx="23" ry="18" fill="#f8fbff" stroke="#25323b" stroke-width="3"/>
      <circle cx="108" cy="16" r="4" fill="#1a1a1a"/>

      <path d="M118 25 Q176 24 204 42 Q170 54 126 48 Z" fill="#f6c24a" stroke="#25323b" stroke-width="3"/>
      <path d="M124 41 Q168 54 188 73 Q148 78 122 60 Z" fill="#f0a85b" stroke="#25323b" stroke-width="3"/>

      <!-- Legs following pedals -->
      <g class="line" stroke="#e08d4a" stroke-width="7" fill="none">
        <line x1="-18" y1="132" x2="34" y2="190">
          <animate attributeName="x2" dur="8s" repeatCount="indefinite"
            values="34;24;0;-24;-34;-24;0;24;34"/>
          <animate attributeName="y2" dur="8s" repeatCount="indefinite"
            values="190;214;224;214;190;166;156;166;190"/>
        </line>
        <line x1="6" y1="136" x2="-34" y2="190">
          <animate attributeName="x2" dur="8s" repeatCount="indefinite"
            values="-34;-24;0;24;34;24;0;-24;-34"/>
          <animate attributeName="y2" dur="8s" repeatCount="indefinite"
            values="190;166;156;166;190;214;224;214;190"/>
        </line>
      </g>

      <!-- Feet -->
      <g fill="#f2a64f" stroke="#25323b" stroke-width="2.5">
        <ellipse rx="12" ry="7">
          <animate attributeName="cx" dur="8s" repeatCount="indefinite"
            values="34;24;0;-24;-34;-24;0;24;34"/>
          <animate attributeName="cy" dur="8s" repeatCount="indefinite"
            values="190;214;224;214;190;166;156;166;190"/>
        </ellipse>
        <ellipse rx="12" ry="7">
          <animate attributeName="cx" dur="8s" repeatCount="indefinite"
            values="-34;-24;0;24;34;24;0;-24;-34"/>
          <animate attributeName="cy" dur="8s" repeatCount="indefinite"
            values="190;166;156;166;190;214;224;214;190"/>
        </ellipse>
      </g>
    </g>
  </g>
</svg>