<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9ed8ff"/>
      <stop offset="70%" stop-color="#dff3ff"/>
      <stop offset="100%" stop-color="#f2fbff"/>
    </linearGradient>
    <linearGradient id="hillGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#89c97a"/>
      <stop offset="100%" stop-color="#5aa65e"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4e5560"/>
      <stop offset="100%" stop-color="#373d46"/>
    </linearGradient>
  </defs>

  <rect width="960" height="540" fill="url(#skyGrad)"/>

  <g transform="translate(130 110)">
    <g opacity="0.28" stroke="#ffd66b" stroke-width="6" stroke-linecap="round">
      <line x1="0" y1="-56" x2="0" y2="-74"/>
      <line x1="0" y1="-56" x2="0" y2="-74" transform="rotate(45)"/>
      <line x1="0" y1="-56" x2="0" y2="-74" transform="rotate(90)"/>
      <line x1="0" y1="-56" x2="0" y2="-74" transform="rotate(135)"/>
      <line x1="0" y1="-56" x2="0" y2="-74" transform="rotate(180)"/>
      <line x1="0" y1="-56" x2="0" y2="-74" transform="rotate(225)"/>
      <line x1="0" y1="-56" x2="0" y2="-74" transform="rotate(270)"/>
      <line x1="0" y1="-56" x2="0" y2="-74" transform="rotate(315)"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
    </g>
    <circle r="42" fill="#ffd66b"/>
    <animate attributeName="opacity" values="0.95;1;0.95" dur="8s" repeatCount="indefinite"/>
  </g>

  <g fill="#ffffff" opacity="0.9">
    <g transform="translate(250 110)">
      <ellipse cx="0" cy="0" rx="46" ry="23"/>
      <ellipse cx="40" cy="0" rx="34" ry="18"/>
      <ellipse cx="-34" cy="4" rx="30" ry="16"/>
    </g>
    <g transform="translate(720 140)">
      <ellipse cx="0" cy="0" rx="50" ry="24"/>
      <ellipse cx="42" cy="-2" rx="30" ry="16"/>
      <ellipse cx="-36" cy="6" rx="28" ry="15"/>
    </g>
  </g>

  <path d="M0 360 C140 315 245 332 360 362 C500 396 630 368 760 342 C850 324 920 332 960 345 L960 540 L0 540 Z" fill="url(#hillGrad)"/>
  <rect x="0" y="420" width="960" height="120" fill="url(#roadGrad)"/>
  <line x1="0" y1="472" x2="960" y2="472" stroke="#f5f5f5" stroke-width="10" stroke-linecap="round" stroke-dasharray="40 40">
    <animate attributeName="stroke-dashoffset" from="0" to="-80" dur="1s" repeatCount="indefinite"/>
  </line>

  <ellipse cx="480" cy="448" rx="250" ry="28" fill="#000000" opacity="0.18"/>

  <!-- Rear wheel -->
  <g transform="translate(320 390)">
    <circle r="102" fill="#1f2329"/>
    <circle r="94" fill="#2e343d"/>
    <circle r="84" fill="#eef5ff" stroke="#b9c8da" stroke-width="3"/>
    <g stroke="#9dafc4" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="0" x2="0" y2="-80"/>
      <line x1="0" y1="0" x2="0" y2="-80" transform="rotate(45)"/>
      <line x1="0" y1="0" x2="0" y2="-80" transform="rotate(90)"/>
      <line x1="0" y1="0" x2="0" y2="-80" transform="rotate(135)"/>
      <line x1="0" y1="0" x2="0" y2="-80" transform="rotate(180)"/>
      <line x1="0" y1="0" x2="0" y2="-80" transform="rotate(225)"/>
      <line x1="0" y1="0" x2="0" y2="-80" transform="rotate(270)"/>
      <line x1="0" y1="0" x2="0" y2="-80" transform="rotate(315)"/>
      <circle r="10" fill="#6f8097" stroke="none"/>
      <rect x="-2" y="-90" width="4" height="10" rx="1.5" fill="#ffd277" stroke="none"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="-2160" dur="8s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Front wheel -->
  <g transform="translate(640 390)">
    <circle r="102" fill="#1f2329"/>
    <circle r="94" fill="#2e343d"/>
    <circle r="84" fill="#eef5ff" stroke="#b9c8da" stroke-width="3"/>
    <g stroke="#9dafc4" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="0" x2="0" y2="-80"/>
      <line x1="0" y1="0" x2="0" y2="-80" transform="rotate(45)"/>
      <line x1="0" y1="0" x2="0" y2="-80" transform="rotate(90)"/>
      <line x1="0" y1="0" x2="0" y2="-80" transform="rotate(135)"/>
      <line x1="0" y1="0" x2="0" y2="-80" transform="rotate(180)"/>
      <line x1="0" y1="0" x2="0" y2="-80" transform="rotate(225)"/>
      <line x1="0" y1="0" x2="0" y2="-80" transform="rotate(270)"/>
      <line x1="0" y1="0" x2="0" y2="-80" transform="rotate(315)"/>
      <circle r="10" fill="#6f8097" stroke="none"/>
      <rect x="-2" y="-90" width="4" height="10" rx="1.5" fill="#ffd277" stroke="none"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="-2160" dur="8s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Bicycle frame -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#2d5f8e" stroke-width="11">
      <line x1="320" y1="390" x2="480" y2="365"/>
      <line x1="420" y1="300" x2="480" y2="365"/>
      <line x1="420" y1="300" x2="560" y2="285"/>
      <line x1="545" y1="340" x2="480" y2="365"/>
      <line x1="420" y1="300" x2="320" y2="390"/>
      <line x1="560" y1="285" x2="545" y2="340"/>
      <line x1="545" y1="340" x2="640" y2="390"/>
      <line x1="555" y1="334" x2="640" y2="390"/>
      <line x1="560" y1="285" x2="590" y2="255"/>
      <path d="M575 252 Q600 240 625 252" />
      <line x1="420" y1="300" x2="420" y2="278"/>
    </g>
    <path d="M395 276 Q421 263 447 272 Q424 284 395 276Z" fill="#2c2d31" stroke="#1f2024" stroke-width="3"/>
    <line x1="611" y1="247" x2="623" y2="260" stroke="#2d5f8e" stroke-width="6"/>
    <circle cx="320" cy="390" r="14" fill="none" stroke="#5d6776" stroke-width="5"/>
    <line x1="334" y1="382" x2="506" y2="356" stroke="#858f9d" stroke-width="4"/>
    <line x1="333" y1="398" x2="506" y2="374" stroke="#858f9d" stroke-width="4"/>
  </g>

  <!-- Crank and pedals -->
  <g transform="translate(480 365)">
    <circle r="30" fill="none" stroke="#4f5966" stroke-width="6"/>
    <circle r="11" fill="#7a8594"/>
    <line x1="-32" y1="0" x2="32" y2="0" stroke="#4f5966" stroke-width="8" stroke-linecap="round"/>
    <rect x="23" y="-6" width="18" height="12" rx="3" fill="#2e2f35"/>
    <rect x="-41" y="-6" width="18" height="12" rx="3" fill="#2e2f35"/>
    <animateTransform attributeName="transform" type="rotate" from="0 480 365" to="-1440 480 365" dur="8s" repeatCount="indefinite"/>
  </g>

  <!-- Pelican back leg -->
  <path d="M448 318 Q446 340 445 352 Q446 360 448 365" fill="none" stroke="#c69358" stroke-width="9" stroke-linecap="round">
    <animate attributeName="d" dur="2s" repeatCount="indefinite"
      values="
      M448 318 Q446 340 445 352 Q446 360 448 365;
      M448 318 Q460 322 470 328 Q476 332 480 333;
      M448 318 Q468 332 488 348 Q501 358 512 365;
      M448 318 Q466 352 472 374 Q476 389 480 397;
      M448 318 Q446 340 445 352 Q446 360 448 365"/>
  </path>
  <ellipse cx="448" cy="365" rx="12" ry="7" fill="#e3ad6e" stroke="#8a5e34" stroke-width="2" opacity="0.92">
    <animate attributeName="cx" dur="2s" repeatCount="indefinite" values="448;480;512;480;448"/>
    <animate attributeName="cy" dur="2s" repeatCount="indefinite" values="365;333;365;397;365"/>
  </ellipse>

  <!-- Pelican body -->
  <g>
    <path d="M354 266 L322 253 L335 282 Z" fill="#d6dee8" stroke="#4f5b66" stroke-width="3"/>
    <ellipse cx="445" cy="268" rx="92" ry="58" fill="#f8f8f2" stroke="#4f5b66" stroke-width="3"/>
    <path d="M386 274 C421 244 481 247 512 279 C472 310 419 313 386 274 Z" fill="#dbe3ec" stroke="#4f5b66" stroke-width="3"/>
    <ellipse cx="420" cy="286" rx="52" ry="32" fill="#ffffff" opacity="0.65"/>

    <path d="M500 257 C526 250 538 229 525 207" fill="none" stroke="#4f5b66" stroke-width="34" stroke-linecap="round"/>
    <path d="M500 257 C526 250 538 229 525 207" fill="none" stroke="#f8f8f2" stroke-width="28" stroke-linecap="round"/>

    <ellipse cx="520" cy="198" rx="33" ry="24" fill="#f8f8f2" stroke="#4f5b66" stroke-width="3"/>
    <path d="M540 191 L674 178 L659 196 L540 202 Z" fill="#efc14f" stroke="#4f5b66" stroke-width="3" stroke-linejoin="round"/>
    <path d="M541 203 C575 233 631 235 664 205 L658 196 C626 216 581 217 548 199 Z" fill="#f1ac8c" stroke="#4f5b66" stroke-width="3"/>

    <ellipse cx="529" cy="193" rx="4" ry="4" fill="#111">
      <animate attributeName="ry" values="4;4;0.6;4;4" keyTimes="0;0.45;0.48;0.51;1" dur="8s" repeatCount="indefinite"/>
    </ellipse>
    <circle cx="530.5" cy="191.5" r="1.2" fill="#ffffff"/>

    <path d="M469 250 C518 244 558 245 595 252" fill="none" stroke="#4f5b66" stroke-width="18" stroke-linecap="round"/>
    <path d="M469 250 C518 244 558 245 595 252" fill="none" stroke="#dbe4ee" stroke-width="13" stroke-linecap="round"/>
    <ellipse cx="598" cy="252" rx="9" ry="7" fill="#dbe4ee" stroke="#4f5b66" stroke-width="2"/>
  </g>

  <!-- Pelican front leg -->
  <path d="M430 315 Q454 330 474 345 Q494 358 512 365" fill="none" stroke="#d8a567" stroke-width="10" stroke-linecap="round">
    <animate attributeName="d" dur="2s" repeatCount="indefinite"
      values="
      M430 315 Q454 330 474 345 Q494 358 512 365;
      M430 315 Q444 350 452 372 Q462 390 480 397;
      M430 315 Q430 340 438 352 Q444 360 448 365;
      M430 315 Q446 320 458 326 Q470 331 480 333;
      M430 315 Q454 330 474 345 Q494 358 512 365"/>
  </path>
  <ellipse cx="512" cy="365" rx="13" ry="8" fill="#efb777" stroke="#8a5e34" stroke-width="2">
    <animate attributeName="cx" dur="2s" repeatCount="indefinite" values="512;480;448;480;512"/>
    <animate attributeName="cy" dur="2s" repeatCount="indefinite" values="365;397;365;333;365"/>
  </ellipse>
</svg>