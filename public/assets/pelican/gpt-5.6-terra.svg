    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf1"/>
      <stop offset="0.72" stop-color="#e7e4d7"/>
      <stop offset="1" stop-color="#c9c9c3"/>
