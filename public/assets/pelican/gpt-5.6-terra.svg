      <stop offset="0.68" stop-color="#d9eff1"/>
      <stop offset="1" stop-color="#f9d7a1"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#586774"/>
      <stop offset="1" stop-color="#303c48"/>
    </linearGradient>
    <linearGradient id="bill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd76a"/>
      <stop offset="0.7" stop-color="#f5a83d"/>
      <stop offset="1" stop-color="#dc772c"/>
    </linearGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd48b"/>
      <stop offset="1" stop-color="#ee8b4a"/>
