      <stop offset="0" stop-color="#7c8d98"/>
      <stop offset="0.55" stop-color="#536671"/>
      <stop offset="1" stop-color="#334955"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
